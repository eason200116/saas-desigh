<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>风控规则配置中心 - 复杂多品牌配置原型</title>
    <style>
      :root {
        --bg: #f5f7f7;
        --surface: #ffffff;
        --surface-soft: #f0f4f3;
        --line: #d7e0dd;
        --line-strong: #aebfba;
        --text: #1f2927;
        --muted: #65736f;
        --faint: #87948f;
        --teal: #11756f;
        --teal-dark: #0d5652;
        --blue: #2d6f9f;
        --amber: #9a6519;
        --red: #a84235;
        --green: #27704a;
        --shadow: 0 16px 42px rgba(31, 42, 39, 0.08);
        --radius: 8px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
        line-height: 1.45;
        margin: 0;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .app {
        display: grid;
        grid-template-columns: 232px minmax(760px, 1fr) 340px;
        min-width: 1340px;
        min-height: 100vh;
      }

      .sidebar {
        background: #fbfcfc;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        padding: 18px 14px;
      }

      .brand {
        align-items: center;
        display: flex;
        gap: 10px;
        padding: 6px 6px 18px;
      }

      .brand-symbol {
        align-items: center;
        background: var(--teal);
        border-radius: 8px;
        color: #fff;
        display: inline-flex;
        height: 34px;
        justify-content: center;
        width: 34px;
      }

      .brand strong {
        display: block;
        font-size: 15px;
        line-height: 1.2;
      }

      .brand span {
        color: var(--muted);
        display: block;
        font-size: 12px;
        margin-top: 3px;
      }

      .nav-label {
        color: var(--faint);
        font-size: 12px;
        font-weight: 700;
        margin: 16px 8px 8px;
      }

      .nav {
        display: grid;
        gap: 4px;
      }

      .nav a,
      .nav button {
        align-items: center;
        background: transparent;
        border: 0;
        border-radius: 7px;
        color: #33403d;
        display: grid;
        font-size: 13px;
        gap: 9px;
        grid-template-columns: 18px 1fr auto;
        min-height: 36px;
        padding: 8px 9px;
        text-align: left;
      }

      .nav .active {
        background: #e8f3f1;
        color: var(--teal-dark);
        font-weight: 800;
      }

      .nav .disabled {
        color: #a2aaa7;
      }

      .nav .count {
        color: var(--faint);
        font-size: 11px;
      }

      .main {
        min-width: 0;
        padding: 20px 22px 34px;
      }

      .topbar {
        align-items: start;
        display: flex;
        gap: 16px;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      h1 {
        color: #182522;
        font-size: 24px;
        line-height: 1.2;
        margin: 0;
      }

      .subtitle {
        color: var(--muted);
        font-size: 13px;
        margin: 6px 0 0;
      }

      .top-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
      }

      .button,
      .icon-button,
      .small-button {
        align-items: center;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 7px;
        color: #263431;
        display: inline-flex;
        font-size: 13px;
        font-weight: 800;
        gap: 8px;
        min-height: 34px;
        padding: 7px 10px;
      }

      .button.primary {
        background: var(--teal);
        border-color: var(--teal);
        color: #fff;
      }

      .button.warn {
        background: #fff7e8;
        border-color: #ebd5ab;
        color: #5a3a10;
      }

      .button.danger {
        background: #fff2ef;
        border-color: #efc8bf;
        color: #7a2219;
      }

      .button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .icon-button {
        height: 36px;
        justify-content: center;
        padding: 0;
        width: 36px;
      }

      .small-button {
        font-size: 12px;
        min-height: 32px;
        padding: 6px 9px;
      }

      .scope-panel,
      .config-card,
      .summary-panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .scope-panel {
        margin-bottom: 16px;
      }

      .scope-row {
        align-items: center;
        display: grid;
        gap: 14px;
        grid-template-columns: 1fr auto;
        padding: 14px;
      }

      .segmented {
        background: var(--surface-soft);
        border: 1px solid var(--line);
        border-radius: 7px;
        display: inline-grid;
        gap: 4px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        padding: 4px;
        width: min(340px, 100%);
      }

      .segmented button {
        background: transparent;
        border: 0;
        border-radius: 5px;
        color: #465350;
        font-size: 13px;
        font-weight: 800;
        min-height: 30px;
        padding: 6px 9px;
      }

      .segmented button:disabled {
        cursor: not-allowed;
        opacity: 0.42;
      }

      .segmented button.active {
        background: var(--surface);
        box-shadow: 0 1px 4px rgba(31, 42, 39, 0.08);
        color: var(--teal-dark);
      }

      .scope-meta,
      .brand-tools {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .scope-meta {
        color: var(--muted);
        font-size: 12px;
        justify-content: flex-end;
      }

      .chip {
        align-items: center;
        background: var(--surface-soft);
        border: 1px solid var(--line);
        border-radius: 999px;
        color: #3c4845;
        display: inline-flex;
        font-size: 12px;
        font-weight: 800;
        gap: 6px;
        min-height: 26px;
        padding: 4px 9px;
      }

      .chip.warning {
        background: #fff7e8;
        border-color: #ead3a7;
        color: #694512;
      }

      .chip.danger {
        background: #fff2ef;
        border-color: #efc8bf;
        color: #7a2219;
      }

      .chip.green {
        background: #e8f5ed;
        border-color: #c6dfcf;
        color: var(--green);
      }

      .scenario-ladder {
        border-top: 1px solid var(--line);
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        padding: 0 14px 14px;
      }

      .scenario-heading {
        align-items: center;
        color: var(--muted);
        display: flex;
        font-size: 12px;
        gap: 8px;
        grid-column: 1 / -1;
        justify-content: space-between;
        padding-top: 12px;
      }

      .scenario-heading strong {
        color: #263431;
        font-size: 13px;
      }

      .scenario-step {
        background: #fbfcfc;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: inherit;
        cursor: pointer;
        display: grid;
        gap: 7px;
        min-height: 106px;
        padding: 10px;
        text-align: left;
      }

      .scenario-step.active {
        border-color: #a7cdc8;
        box-shadow: inset 0 0 0 1px #cbe4df;
      }

      .scenario-step strong {
        align-items: center;
        color: #1f2927;
        display: flex;
        font-size: 13px;
        gap: 7px;
      }

      .scenario-step p {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
        margin: 0;
      }

      .scenario-step .scenario-status {
        align-items: center;
        color: var(--teal-dark);
        display: inline-flex;
        font-size: 11px;
        font-weight: 800;
        gap: 5px;
      }

      .brand-strip {
        border-top: 1px solid var(--line);
        display: grid;
        gap: 10px;
        grid-template-columns: 1fr auto;
        padding: 12px 14px 14px;
      }

      .brand-lock {
        align-items: center;
        background: #f1f7f5;
        border: 1px solid #d8e7e2;
        border-radius: 7px;
        color: #2f4c47;
        display: none;
        font-size: 13px;
        font-weight: 750;
        gap: 8px;
        min-height: 36px;
        padding: 8px 10px;
      }

      .brand-strip.locked .brand-lock {
        display: flex;
      }

      .brand-strip.locked .brand-tools,
      .brand-strip.locked .brand-list {
        display: none;
      }

      .search {
        align-items: center;
        background: var(--surface-soft);
        border: 1px solid var(--line);
        border-radius: 7px;
        display: flex;
        gap: 8px;
        min-height: 34px;
        padding: 0 10px;
        width: min(280px, 100%);
      }

      .search input {
        background: transparent;
        border: 0;
        color: var(--text);
        min-width: 0;
        outline: 0;
        width: 100%;
      }

      .brand-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .brand-pill {
        align-items: center;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 7px;
        color: #2e3b38;
        display: inline-flex;
        gap: 7px;
        min-height: 34px;
        padding: 6px 9px;
      }

      .brand-pill input {
        accent-color: var(--teal);
      }

      .status {
        border-radius: 999px;
        font-size: 11px;
        font-weight: 800;
        padding: 2px 6px;
      }

      .status.live {
        background: #e8f5ed;
        color: var(--green);
      }

      .status.test {
        background: #eef3ff;
        color: var(--blue);
      }

      .status.pause {
        background: #fff2e1;
        color: var(--amber);
      }

      .currency-tag {
        background: #eef3f2;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: #3c4845;
        font-size: 11px;
        font-weight: 800;
        padding: 2px 6px;
      }

      .template-map {
        border-top: 1px solid var(--line);
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        padding: 12px 14px 14px;
      }

      .template-card {
        background: #fbfcfc;
        border: 1px solid var(--line);
        border-radius: 8px;
        cursor: pointer;
        display: grid;
        gap: 8px;
        min-width: 0;
        padding: 10px;
      }

      .template-card.active {
        border-color: #a7cdc8;
        box-shadow: inset 0 0 0 1px #cbe4df;
      }

      .template-card strong {
        color: #1f2927;
        display: block;
        font-size: 13px;
      }

      .template-card p {
        color: var(--muted);
        font-size: 12px;
        margin: 0;
      }

      .template-card .template-values {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .template-card .template-values span {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 999px;
        color: #45524f;
        font-size: 11px;
        padding: 3px 7px;
      }

      .market-brand-list {
        border-top: 1px dashed var(--line);
        display: grid;
        gap: 6px;
        padding-top: 8px;
      }

      .market-brand-list strong {
        color: #51615d;
        font-size: 12px;
      }

      .market-brand-list div {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .market-brand-list span,
      .market-select-hint {
        align-items: center;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 999px;
        color: #45524f;
        display: inline-flex;
        font-size: 11px;
        gap: 4px;
        padding: 3px 7px;
      }

      .market-select-hint {
        background: #e9f5f2;
        border-color: #c4ded8;
        color: var(--teal-dark);
        font-weight: 800;
        justify-self: start;
      }

      .workbench {
        display: grid;
        gap: 14px;
      }

      .config-card {
        overflow: hidden;
      }

      .card-head {
        align-items: center;
        background: #fbfcfc;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 12px;
        justify-content: space-between;
        padding: 13px 15px;
      }

      .card-head h2 {
        color: #182522;
        font-size: 16px;
        margin: 0;
      }

      .card-head span {
        color: var(--muted);
        display: block;
        font-size: 12px;
        margin-top: 3px;
      }

      .config-row {
        border-bottom: 1px solid var(--line);
        display: grid;
        gap: 14px;
        grid-template-columns: minmax(190px, 250px) minmax(330px, 1fr) 220px;
        min-height: 84px;
        padding: 14px 15px;
      }

      .config-row:last-child {
        border-bottom: 0;
      }

      .field-name strong {
        display: block;
        font-size: 14px;
      }

      .field-name span {
        color: var(--muted);
        display: block;
        font-size: 12px;
        margin-top: 4px;
      }

      .value-box {
        background: var(--surface-soft);
        border: 1px solid var(--line);
        border-radius: 8px;
        display: grid;
        gap: 8px;
        padding: 10px;
      }

      .value-box.mixed {
        background: #fff8ec;
        border-color: #ecd7af;
      }

      .value-box.changed {
        background: #eaf6f4;
        border-color: #b8dbd6;
      }

      .value-top {
        align-items: start;
        display: grid;
        gap: 8px;
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .value-title {
        color: #263431;
        display: block;
        font-size: 13px;
        font-weight: 900;
      }

      .value-sub {
        color: var(--muted);
        display: block;
        font-size: 12px;
        margin-top: 2px;
      }

      .source-badge {
        border-radius: 999px;
        font-size: 11px;
        font-weight: 900;
        padding: 4px 7px;
        white-space: nowrap;
      }

      .source-badge.default {
        background: #eef3f2;
        color: #50605c;
      }

      .source-badge.mixed {
        background: #fff1db;
        color: #80510e;
      }

      .source-badge.changed {
        background: #dff0ed;
        color: var(--teal-dark);
      }

      .source-badge.danger {
        background: #fff2ef;
        color: var(--red);
      }

      .source-badge.currency {
        background: #eef3ff;
        color: var(--blue);
      }

      .distribution {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .distribution span {
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid var(--line);
        border-radius: 999px;
        color: #52615d;
        font-size: 11px;
        padding: 4px 7px;
      }

      .rule-list {
        display: grid;
        gap: 8px;
      }

      .rule-item {
        background: #fbfcfc;
        border: 1px solid var(--line);
        border-radius: 7px;
        display: grid;
        gap: 8px;
        grid-template-columns: minmax(0, 1fr) auto;
        padding: 10px;
      }

      .rule-item strong {
        font-size: 13px;
      }

      .rule-meta {
        color: var(--muted);
        display: flex;
        flex-wrap: wrap;
        font-size: 12px;
        gap: 6px;
        margin-top: 5px;
      }

      .rule-score {
        align-self: start;
        background: #fff7e8;
        border: 1px solid #ead3a7;
        border-radius: 7px;
        color: #6b4511;
        font-size: 12px;
        font-weight: 900;
        padding: 5px 7px;
      }

      .edit-cell {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
      }

      .small-button:disabled {
        cursor: not-allowed;
        opacity: 0.48;
      }

      .editor-row {
        background: #fbfcfc;
        border-bottom: 1px solid var(--line);
        display: none;
        grid-template-columns: 250px minmax(0, 1fr);
        padding: 0 15px 14px;
      }

      .editor-row.open {
        display: grid;
      }

      .editor-panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        grid-column: 2 / 3;
        padding: 13px;
      }

      .original-block {
        background: #fbfcfc;
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-bottom: 12px;
        overflow: hidden;
      }

      .original-head {
        align-items: center;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 10px;
        justify-content: space-between;
        padding: 10px 12px;
      }

      .original-head strong {
        font-size: 13px;
      }

      .original-head span {
        color: var(--muted);
        font-size: 12px;
      }

      .current-table-wrap {
        max-height: 240px;
        overflow: auto;
      }

      table {
        border-collapse: collapse;
        width: 100%;
      }

      th,
      td {
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        padding: 9px 10px;
        text-align: left;
        vertical-align: top;
      }

      th {
        background: var(--surface-soft);
        color: #2e3b38;
        font-weight: 900;
        position: sticky;
        top: 0;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      .editor-warning {
        background: #eef7f5;
        border: 1px solid #cbe4df;
        border-radius: 7px;
        color: #204a45;
        font-size: 12px;
        margin-bottom: 10px;
        padding: 9px 10px;
      }

      .editor-grid {
        align-items: end;
        display: grid;
        gap: 10px;
        grid-template-columns: 180px minmax(160px, 1fr) auto;
      }

      .rule-detail-grid {
        align-items: end;
        display: grid;
        gap: 10px;
        grid-template-columns: 150px minmax(220px, 1fr) 110px 120px auto;
        margin-top: 10px;
      }

      .detail-note {
        color: var(--muted);
        font-size: 12px;
        margin-top: 8px;
      }

      label {
        color: #34413e;
        display: grid;
        font-size: 12px;
        font-weight: 900;
        gap: 6px;
      }

      select,
      input[type="number"],
      input[type="text"] {
        background: var(--surface);
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        color: var(--text);
        min-height: 36px;
        padding: 7px 9px;
      }

      .aside {
        background: #fbfcfc;
        border-left: 1px solid var(--line);
        min-height: 100vh;
        padding: 20px 16px;
      }

      .summary-panel {
        overflow: hidden;
        position: sticky;
        top: 16px;
      }

      .summary-head {
        border-bottom: 1px solid var(--line);
        padding: 15px;
      }

      .summary-head h2 {
        font-size: 16px;
        margin: 0;
      }

      .summary-head p {
        color: var(--muted);
        font-size: 12px;
        margin: 5px 0 0;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        padding: 12px 15px;
      }

      .stat {
        background: var(--surface-soft);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 10px;
      }

      .stat strong {
        display: block;
        font-size: 20px;
        line-height: 1;
      }

      .stat span {
        color: var(--muted);
        display: block;
        font-size: 12px;
        margin-top: 6px;
      }

      .changes {
        border-top: 1px solid var(--line);
        max-height: 310px;
        overflow: auto;
        padding: 8px 0;
      }

      .change-item {
        border-bottom: 1px solid var(--line);
        padding: 10px 15px;
      }

      .change-title {
        align-items: center;
        display: flex;
        font-size: 13px;
        font-weight: 900;
        gap: 7px;
        justify-content: space-between;
      }

      .change-meta {
        color: var(--muted);
        font-size: 12px;
        margin-top: 5px;
      }

      .empty {
        color: var(--muted);
        font-size: 13px;
        padding: 18px 15px;
      }

      .risk-note {
        background: #fff7e8;
        border: 1px solid #ead3a7;
        border-radius: 7px;
        color: #5b3a10;
        display: none;
        font-size: 12px;
        margin: 0 15px 12px;
        padding: 9px 10px;
      }

      .risk-note.show {
        display: block;
      }

      .summary-actions {
        border-top: 1px solid var(--line);
        display: grid;
        gap: 8px;
        padding: 14px 15px 15px;
      }

      .modal-backdrop {
        align-items: center;
        background: rgba(13, 24, 22, 0.42);
        display: none;
        inset: 0;
        justify-content: center;
        padding: 24px;
        position: fixed;
        z-index: 20;
      }

      .modal-backdrop.show {
        display: flex;
      }

      .modal {
        background: var(--surface);
        border-radius: 8px;
        box-shadow: 0 24px 70px rgba(10, 20, 18, 0.25);
        max-height: min(720px, 92vh);
        max-width: 980px;
        overflow: hidden;
        width: 100%;
      }

      .modal-head,
      .modal-foot {
        align-items: center;
        display: flex;
        justify-content: space-between;
        padding: 16px 18px;
      }

      .modal-head {

    <script>
      const marketTemplates = {

          language: "泰语",

        PHP: {

        },

        }

      const currencyLabel = {
        THB: "泰国 / THB",
        VND: "越南 / VND",
        PHP: "菲律宾 / PHP"
      };

      const baseRules = [
        { id: "fail-login", name: "登录失败过多", condition: "10 分钟内失败 >= 5 次", score: 20, enabled: true },
        { id: "device-multi", name: "同设备多账号", condition: "24 小时内关联账号 >= 3", score: 25, enabled: true },
        { id: "ip-jump", name: "登录地区跳变", condition: "2 小时内跨地区登录", score: 15, enabled: true },
        { id: "fast-withdraw", name: "快进快出", condition: "充值后 30 分钟内提款", score: 35, enabled: true }
      ];

      const merchantDefaults = {
        rulePackage: "标准风控包",
        rules: clone(baseRules),

        publishMode: "人工复核后生效"
      };

      const brands = [
        {
          id: "aurora",
          name: "Aurora",
          currency: "THB",
          status: "live",
          values: {
            rulePackage: "标准风控包",

            publishMode: "人工复核后生效"
          }
        },
        {
          id: "metro",
          name: "Metro",
          currency: "THB",
          status: "live",
          values: {
            rulePackage: "标准风控包",
            rules: clone(baseRules).map((rule) => rule.id === "fast-withdraw" ? { ...rule, score: 30 } : rule),
            actionPolicy: "60分人工复核；80分临时冻结",
            withdrawReview: 8000,
            exemptions: ["VIP8+ 降低 10 分"],
            publishMode: "人工复核后生效"
          }
        },
        {
          id: "nova",
          name: "Nova",
          currency: "VND",
          status: "test",
          values: {
            rulePackage: "测试宽松包",
            rules: clone(baseRules).filter((rule) => rule.id !== "ip-jump"),
            actionPolicy: "70分人工复核；90分临时冻结",
            withdrawReview: 120000000,
            exemptions: ["测试账号免冻结", "白名单设备免二次验证"],
            publishMode: "发布后立即生效"
          }
        },
        {
          id: "tiger",
          name: "Tiger",
          currency: "PHP",
          status: "live",
          values: {
            rulePackage: "高敏感风控包",
            rules: clone(baseRules).concat([{ id: "same-card", name: "同银行卡多账号", condition: "同卡绑定账号 >= 2", score: 30, enabled: true }]),
            actionPolicy: "50分人工复核；75分临时冻结",
            withdrawReview: 6000,
            exemptions: ["VIP9+ 降低 5 分"],
            publishMode: "人工复核后生效"
          }
        },
        {
          id: "zenith",
          name: "Zenith",
          currency: "THB",
          status: "pause",
          values: {
            rulePackage: "标准风控包",
            rules: clone(baseRules),
            actionPolicy: "60分人工复核；80分临时冻结",
            withdrawReview: 5000,
            exemptions: ["VIP8+ 降低 10 分"],
            publishMode: "人工复核后生效"
          }
        },
        {
          id: "river",
          name: "River",
          currency: "VND",
          status: "live",
          values: {
            rulePackage: "标准风控包",
            rules: clone(baseRules),
            actionPolicy: "60分人工复核；80分临时冻结",
            withdrawReview: 120000000,
            exemptions: ["VIP8+ 降低 10 分", "白名单设备免二次验证"],
            publishMode: "人工复核后生效"
          }
        }
      ];

      const objects = [
        {
          group: "规则包与评分",
          note: "嵌套规则列表、评分和规则包版本",
          items: [
            {
              key: "rulePackage",
              name: "风控规则包",
              desc: "规则包名称与策略基线",
              type: "select",
              options: ["测试宽松包", "标准风控包", "高敏感风控包"],
              risk: false
            },
            {
              key: "rules",
              name: "评分规则列表",
              desc: "数组类配置：规则新增、删除、修改匹配项",
              type: "rules",
              risk: true
            }
          ]
        },
        {
          group: "处置策略",
          note: "命中后动作、提款复核和发布生效方式",
          items: [
            {
              key: "actionPolicy",
              name: "风险动作策略",
              desc: "按风险分触发人工复核、二次验证或临时冻结",
              type: "select",
              options: [
                "60分人工复核；80分临时冻结",
                "70分人工复核；90分临时冻结",
                "50分人工复核；75分临时冻结",
                "60分二次验证；85分临时冻结"
              ],
              risk: true
            },
            {
              key: "withdrawReview",
              name: "提款复核阈值",
              desc: "超过金额进入人工复核，跟随品牌市场模板",
              type: "number",
              currencySensitive: true,
              min: 1000,
              max: 999999999,
              risk: true
            },
            {
              key: "publishMode",
              name: "发布生效方式",
              desc: "风控配置发布后的生效机制",
              type: "select",
              options: ["人工复核后生效", "发布后立即生效", "灰度 10% 后全量"],
              risk: true
            }
          ]
        },
        {
          group: "例外名单",
          note: "白名单、VIP 例外与测试账号例外",
          items: [
            {
              key: "exemptions",
              name: "例外策略列表",
              desc: "数组类配置：新增例外、移除例外、替换全部",
              type: "list",
              risk: true
            }
          ]
        }
      ];

      const ruleToAdd = {
        id: "same-device-burst",
        name: "同设备短时批量注册",
        condition: "1 小时内注册账号 >= 4",
        score: 30,
        enabled: true
      };

      const state = {
        scope: "merchant",
        selected: new Set(["aurora", "metro", "nova", "tiger", "river"]),
        edits: {},
        openEditor: null,
        query: ""
      };

      const statusLabel = {
        live: "运营中",
        test: "测试",
        pause: "暂停"
      };

      function clone(value) {
        return JSON.parse(JSON.stringify(value));
      }

      function isSingleBrandMerchant() {
        return brands.length === 1;
      }

      function normalizeScope() {
        if (isSingleBrandMerchant()) {
          state.scope = "merchant";
          state.selected = new Set([brands[0].id]);
        }
      }

      function syncScopeControls() {
        document.querySelectorAll(".scope-tab").forEach((button) => {
          button.disabled = isSingleBrandMerchant() && button.dataset.scope === "brands";
          button.classList.toggle("active", button.dataset.scope === state.scope);
        });
      }

      function selectedBrands() {
        const selected = brands.filter((brand) => state.selected.has(brand.id));
        if (state.scope === "merchant") return selected.length ? selected : brands;
        return selected;
      }

      function getObject(key) {
        return objects.flatMap((group) => group.items).find((item) => item.key === key);
      }

      function selectedCurrencies() {
        return [...new Set(selectedBrands().map((brand) => brand.currency))];
      }

      function allMerchantCurrencies() {
        return [...new Set(brands.map((brand) => brand.currency))];
      }

      function activeMarketCurrencies() {
        const currencies = selectedCurrencies();
        return currencies.length ? currencies : allMerchantCurrencies();
      }

      function marketLabel(currency) {
        const market = marketTemplates[currency];
        return market ? `${market.country} / ${market.currency}` : currency;
      }

      function marketMetaText(currency) {
        const market = marketTemplates[currency];
        return market ? `币种 ${market.currency}，语言 ${market.language}` : currency;
      }

      function marketTemplateName(currency) {
        const market = marketTemplates[currency];
        return market ? market.name : `${currency} 市场`;
      }

      function marketBrandCount(currency) {
        return brands.filter((brand) => brand.currency === currency).length;
      }

      function marketBrands(currency) {
        return brands.filter((brand) => brand.currency === currency);
      }

      function selectMarket(currency) {
        state.selected = new Set(marketBrands(currency).map((brand) => brand.id));
        state.edits = {};
        state.openEditor = null;
        showToast(`已选择 ${marketLabel(currency)} 市场`);
        render();
      }

      function currentScenarioKey() {
        const brandCount = selectedBrands().length;
        const currencyCount = selectedCurrencies().length;
        if (brandCount <= 1 && currencyCount <= 1) return "singleBrand";
        if (currencyCount <= 1) return "singleCurrency";
        return "multiCurrency";
      }

      function scenarioSteps() {
        return [
          {
            key: "multiCurrency",
            icon: "layers-3",
            title: "1 多品牌多市场",
            status: "默认基准",
            desc: "先确保跨品牌、跨市场的模板继承、金额锁定、差异预览都成立。"
          },
          {
            key: "singleCurrency",
            icon: "coins",
            title: "2 多品牌单一市场",
            status: "简化态",
            desc: "同市场品牌可批量编辑金额阈值，仍保留品牌覆盖和发布差异。"
          },
          {
            key: "singleBrand",
            icon: "lock-keyhole",
            title: "3 单一品牌单一市场",
            status: "锁定态",
            desc: "真实单品牌商户锁定品牌选择，仅保留继承查看和模板编辑。"
          }
        ];
      }

      function renderScenarioLadder() {
        const ladder = document.getElementById("scenarioLadder");
        const active = currentScenarioKey();
        ladder.innerHTML = `
          <div class="scenario-heading">
            <strong>场景优先级</strong>
            <span>市场模板是唯一基础；先按多品牌多市场优先设计，再逐层收敛</span>
          </div>
          ${scenarioSteps()
            .map((step) => `
              <button class="scenario-step ${active === step.key ? "active" : ""}" type="button" data-scenario-preset="${step.key}" aria-pressed="${active === step.key}">
                <strong><i data-lucide="${step.icon}" size="15"></i>${step.title}</strong>
                <p>${step.desc}</p>
                <span class="scenario-status"><i data-lucide="${active === step.key ? "check-circle-2" : "circle"}" size="13"></i>${active === step.key ? "当前状态" : step.status}</span>
              </button>
            `)
            .join("")}
        `;
      }

      function applyScenarioPreset(key) {
        state.edits = {};
        state.openEditor = null;
        state.query = "";
        if (key === "multiCurrency") {
          state.scope = "merchant";
          state.selected = new Set(brands.map((brand) => brand.id));
          showToast("已切换到多品牌多市场基准场景");
        }
        if (key === "singleCurrency") {
          const currency = allMerchantCurrencies().find((item) => brands.filter((brand) => brand.currency === item && brand.status !== "pause").length > 1) || allMerchantCurrencies()[0];
          state.scope = "merchant";
          state.selected = new Set(brands.filter((brand) => brand.currency === currency && brand.status !== "pause").map((brand) => brand.id));
          showToast(`已切换到 ${marketLabel(currency)} 多品牌单一市场样例`);
        }
        if (key === "singleBrand") {
          const brand = brands.find((item) => item.status === "live") || brands[0];
          state.scope = "merchant";
          state.selected = new Set([brand.id]);
          showToast("已切换到单一品牌单一市场样例");
        }
        render();
      }

      function isCurrencySensitive(item) {
        return Boolean(item?.currencySensitive);
      }

      function templateValue(item, brandOrCurrency) {
        const currency = typeof brandOrCurrency === "string" ? brandOrCurrency : brandOrCurrency?.currency;
        if (isCurrencySensitive(item)) return currencyDefaults[currency]?.[item.key] ?? merchantDefaults[item.key];
        return merchantDefaults[item.key];
      }

      function templateSource(item, brand) {
        return stable(brand.values[item.key]) === stable(templateValue(item, brand)) ? `继承 ${marketLabel(brand.currency)} 市场模板` : "品牌覆盖";
      }

      function canEditItem(item) {
        if (!isCurrencySensitive(item)) return true;
        return selectedCurrencies().length === 1;
      }

      function itemLockReason(item) {
        if (!isCurrencySensitive(item)) return "";
        return `当前选中 ${selectedCurrencies().map(marketLabel).join(" / ")}，金额阈值需按单一市场分组编辑。`;
      }

      function stable(value) {
        return JSON.stringify(value);
      }

      function aggregate(key) {
        const item = getObject(key);
        const items = selectedBrands();
        if (!items.length) {
          return { kind: "empty", title: "未选择品牌", sub: "无作用范围", source: "default", values: [] };
        }
        if (state.scope === "merchant") {
          if (isCurrencySensitive(item)) {
            const currencies = activeMarketCurrencies();
            if (currencies.length === 1) {
              const value = templateValue(item, currencies[0]);
              return {
                kind: "same",
                title: formatValue(key, value, currencies[0]),
                sub: `${marketLabel(currencies[0])} 市场模板`,
                source: "currency",
                values: [value]
              };
            }
            return {
              kind: "mixed",
              title: "按市场模板维护",
              sub: `${currencies.map(marketLabel).join(" / ")} ${currencies.length} 个市场模板`,
              source: "currency",
              values: currencies.map((currency) => templateValue(item, currency))
            };
          }
          return {
            kind: "same",
            title: formatValue(key, merchantDefaults[key]),
            sub: "跨市场批量默认值",
            source: "default",
            values: [merchantDefaults[key]]
          };
        }
        const currencies = selectedCurrencies();
        if (isCurrencySensitive(item) && currencies.length > 1) {
          return {
            kind: "mixed",
            title: "跨市场金额阈值",
            sub: `${currencies.map(marketLabel).join(" / ")}，需按市场分组编辑`,
            source: "currency",
            values: items.map((brand) => brand.values[key])
          };
        }
        const values = items.map((brand) => brand.values[key]);
        const unique = [...new Set(values.map(stable))].map(JSON.parse);
        const defaultCount = items.filter((brand) => stable(brand.values[key]) === stable(templateValue(item, brand))).length;
        if (unique.length === 1) {
          return {
            kind: "same",
            title: formatValue(key, unique[0], isCurrencySensitive(item) ? currencies[0] : null),
            sub: defaultCount === values.length
              ? isCurrencySensitive(item) ? `全部继承 ${marketLabel(currencies[0])} 市场模板` : "全部继承各自市场模板"
              : "全部品牌同值",
            source: defaultCount === values.length ? "default" : "mixed",
            values
          };
        }
        return {
          kind: "mixed",
          title: "多个配置版本",
          sub: `${unique.length} 种配置，${defaultCount} 个品牌等于市场模板`,
          source: "mixed",
          values
        };
      }

      function formatValue(key, value) {
        const object = getObject(key);
        if (!object) return String(value);
        const currency = arguments.length > 2 ? arguments[2] : null;
        if (object.type === "number") return `${Number(value).toLocaleString()}${isCurrencySensitive(object) && currency ? ` ${currency}` : object.unit || ""}`;
        if (object.type === "rules") {
          const enabled = value.filter((rule) => rule.enabled).length;
          const maxScore = Math.max(...value.map((rule) => rule.score));
          return `${value.length} 条规则，${enabled} 条启用，最高 ${maxScore} 分`;
        }
        if (object.type === "list") return `${value.length} 条例外：${value.slice(0, 2).join("、")}${value.length > 2 ? "..." : ""}`;
        return value;
      }

      function formatTableValue(key, value) {
        const object = getObject(key);
        const currency = arguments.length > 2 ? arguments[2] : null;
        if (object?.type !== "rules") return formatValue(key, value, currency);
        return value
          .map((rule) => `${rule.name} ${rule.enabled ? "启用" : "停用"} +${rule.score}`)
          .join("；");
      }

      function availableRuleOptions() {
        const map = new Map();
        [...baseRules, ruleToAdd, { id: "same-card", name: "同银行卡多账号", condition: "同卡绑定账号 >= 2", score: 30, enabled: true }].forEach((rule) => {
          map.set(rule.id, rule);
        });
        selectedBrands().forEach((brand) => {
          brand.values.rules.forEach((rule) => map.set(rule.id, rule));
        });
        return [...map.values()];
      }

      function distribution(key) {
        const item = getObject(key);
        if (state.scope === "merchant") {
          if (isCurrencySensitive(item)) {
            return activeMarketCurrencies().map((currency) => `${marketLabel(currency)} 市场模板：${formatValue(key, templateValue(item, currency), currency)}`);
          }
          return activeMarketCurrencies().map((currency) => `${marketLabel(currency)} 市场模板：${formatValue(key, merchantDefaults[key])}`);
        }
        const counts = new Map();
        selectedBrands().forEach((brand) => {
          const label = formatValue(key, brand.values[key], isCurrencySensitive(item) ? brand.currency : null);
          counts.set(label, (counts.get(label) || 0) + 1);
        });
        if (!counts.size) return ["未选择品牌"];
        return [...counts.entries()].map(([label, count]) => `${label}：${count} 个品牌`);
      }

      function renderBrands() {
        const strip = document.getElementById("brandStrip");
        const lock = document.getElementById("brandLock");
        const list = document.getElementById("brandList");
        const locked = state.scope === "merchant" || isSingleBrandMerchant();
        strip.classList.toggle("locked", locked);
        if (locked) {
          lock.innerHTML = isSingleBrandMerchant()
            ? '<i data-lucide="lock-keyhole" size="15"></i><span>单品牌商户已锁定为唯一市场模板，品牌侧只读继承。</span>'
            : '<i data-lucide="file-cog" size="15"></i><span>当前维护市场模板；上方只用于选择市场和查看继承品牌，字段编辑在下方完成。</span>';
          list.innerHTML = "";
          return;
        }
        const filtered = brands.filter((brand) => brand.name.toLowerCase().includes(state.query.toLowerCase()));
        list.innerHTML = filtered
          .map((brand) => {
            const checked = state.selected.has(brand.id) ? "checked" : "";
            const disabled = state.scope === "merchant" ? "disabled" : "";
            return `
              <label class="brand-pill">
                <input type="checkbox" data-brand="${brand.id}" ${checked} ${disabled} />
                <span>${brand.name}</span>
                <span class="currency-tag">${brand.currency}</span>
                <span class="status ${brand.status}">${statusLabel[brand.status]}</span>
              </label>
            `;
          })
          .join("");
      }

      function renderTemplateMap() {
        const map = document.getElementById("templateMap");
        const activeCurrencies = activeMarketCurrencies();
        map.innerHTML = `
          ${activeCurrencies
            .map(
              (currency) => `
                <div class="template-card active" role="button" tabindex="0" data-market-select="${currency}">
                  <strong>${marketTemplateName(currency)} <span class="currency-tag">${currency}</span></strong>
                  <p>${marketTemplates[currency].defaultSource}，${marketMetaText(currency)}；${marketBrandCount(currency)} 个品牌继承。这里只做选择和关系展示。</p>
                  ${renderMarketSelectorContent(currency)}
                </div>
              `
            )
            .join("")}
        `;
      }

      function renderMarketSelectorContent(currency) {
        const brandChips = marketBrands(currency)
          .map((brand) => `<span>${brand.name} · ${statusLabel[brand.status]}</span>`)
          .join("");
        return `
          <div class="market-brand-list">
            <strong>继承品牌</strong>
            <div>${brandChips}</div>
          </div>
          <span class="market-select-hint"><i data-lucide="mouse-pointer-2" size="13"></i>选择此市场</span>
        `;
      }

      function renderWorkbench() {
        const workbench = document.getElementById("workbench");
        workbench.innerHTML = objects
          .map((group) => {
            const rows = group.items
              .map((item) => {
                const agg = aggregate(item.key);
                const edit = state.edits[item.key];
                const open = state.openEditor === item.key;
                const changed = edit ? "changed" : "";
                const risk = item.risk ? '<span class="chip danger">高风险</span>' : "";
                const currency = isCurrencySensitive(item) ? '<span class="chip"><i data-lucide="globe-2" size="13"></i>市场字段</span>' : "";
                const locked = !canEditItem(item);
                const openEditor = open && !locked;
                return `
                  <div class="config-row">
                    <div class="field-name">
                      <strong>${item.name}</strong>
                      <span>${item.desc}</span>
                    </div>
                    <div class="value-box ${agg.kind === "mixed" ? "mixed" : ""} ${changed}">
                      <div class="value-top">
                        <div>
                          <span class="value-title">${edit ? draftTitle(item, edit) : agg.title}</span>
                          <span class="value-sub">${edit ? draftSubtitle(edit, item) : agg.sub}</span>
                        </div>
                        <span class="source-badge ${edit ? "changed" : agg.source}">
                          ${edit ? "本次变更" : sourceText(agg.source)}
                        </span>
                      </div>
                      ${renderObjectPreview(item, edit)}
                      <div class="distribution">
                        ${distribution(item.key)
                          .slice(0, 4)
                          .map((entry) => `<span>${entry}</span>`)
                          .join("")}
                      </div>
                    </div>
                    <div class="edit-cell">
                      ${currency}
                      ${locked ? '<span class="chip warning">按市场编辑</span>' : risk}
                      <button class="small-button" type="button" data-edit="${item.key}" ${locked ? "disabled" : ""} title="${locked ? itemLockReason(item) : ""}">
                        <i data-lucide="${openEditor ? "chevron-up" : locked ? "lock-keyhole" : "pencil"}" size="14"></i>
                        ${openEditor ? "收起" : locked ? "锁定" : "编辑"}
                      </button>
                    </div>
                  </div>
                  <div class="editor-row ${openEditor ? "open" : ""}">
                    <div></div>
                    <div class="editor-panel">${openEditor ? renderEditor(item) : ""}</div>
                  </div>
                `;
              })
              .join("");
            return `
              <section class="config-card">
                <div class="card-head">
                  <div>
                    <h2>${group.group}</h2>
                    <span>${group.note}</span>
                  </div>
                  <span class="chip">${group.items.length} 个对象</span>
                </div>
                ${rows}
              </section>
            `;
          })
          .join("");
      }

      function renderObjectPreview(item, edit) {
        const preview = edit ? previewValueForObject(item, edit) : firstValue(item.key);
        if (item.type === "rules") {
          return `<div class="rule-list">${preview
            .slice(0, 3)
            .map(
              (rule) => `
                <div class="rule-item">
                  <div>
                    <strong>${rule.name}</strong>
                    <div class="rule-meta">
                      <span>${rule.condition}</span>
                      <span>${rule.enabled ? "启用" : "停用"}</span>
                    </div>
                  </div>
                  <span class="rule-score">+${rule.score}</span>
                </div>
              `
            )
            .join("")}</div>`;
        }
        if (item.type === "list") {
          return `<div class="distribution">${preview.map((entry) => `<span>${entry}</span>`).join("")}</div>`;
        }
        return "";
      }

      function firstValue(key) {
        if (state.scope === "merchant") return merchantDefaults[key];
        const brand = selectedBrands()[0];
        return brand ? brand.values[key] : merchantDefaults[key];
      }

      function renderEditor(item) {
        const edit = state.edits[item.key] || defaultEdit(item);
        const currency = isCurrencySensitive(item) ? selectedCurrencies()[0] : null;
        return `
          ${renderOriginalValues(item, edit)}
          <div class="editor-warning">
            ${isCurrencySensitive(item)
              ? state.scope === "merchant" ? `当前编辑 ${currencyLabel[currency]} 市场模板。金额阈值不做跨市场统一设置，也不做汇率折算。` : `当前仅编辑 ${currencyLabel[currency]} 品牌。金额阈值不做跨市场统一设置，也不做汇率折算。`
              : state.scope === "merchant" ? "当前是跨市场批量同步工具，不是统一继承层；发布后写入每个市场模板。" : "先看各品牌当前配置，再加入变更。数组类配置默认做“新增 / 修改匹配项”，避免误替换整套规则。"}
          </div>
          ${renderEditorControls(item, edit)}
        `;
      }

      function renderEditorControls(item, edit) {
        if (item.type === "rules") {
          const ruleOptions = availableRuleOptions();
          const targetRule = ruleOptions.find((rule) => rule.id === (edit.targetRuleId || "fail-login")) || ruleOptions[0];
          return `
            <div class="editor-grid">
              <label>
                操作方式
                <select data-draft-mode="${item.key}">
                  <option value="editRule" ${edit.mode === "editRule" ? "selected" : ""}>直接编辑规则</option>
                  <option value="addRule" ${edit.mode === "addRule" ? "selected" : ""}>新增规则</option>
                  <option value="replacePackage" ${edit.mode === "replacePackage" ? "selected" : ""}>替换为高敏感包</option>
                  <option value="keep" ${edit.mode === "keep" ? "selected" : ""}>不修改</option>
                </select>
              </label>
              <label>
                规则
                <select data-draft-value="${item.key}">
                  <option value="same-device-burst">同设备短时批量注册 +30</option>
                  <option value="same-card">同银行卡多账号 +30</option>
                </select>
              </label>
              <button class="button primary" type="button" data-apply="${item.key}">
                <i data-lucide="plus" size="15"></i>
                加入变更
              </button>
            </div>
            <div class="rule-detail-grid">
              <label>
                编辑目标
                <select data-rule-target="${item.key}">
                  ${ruleOptions
                    .map((rule) => `<option value="${rule.id}" ${targetRule.id === rule.id ? "selected" : ""}>${rule.name}</option>`)
                    .join("")}
                </select>
              </label>
              <label>
                命中条件
                <input data-rule-condition="${item.key}" type="text" value="${edit.condition || targetRule.condition}" />
              </label>
              <label>
                分数
                <input data-rule-score="${item.key}" type="number" min="1" max="100" value="${edit.score || targetRule.score}" />
              </label>
              <label>
                启停
                <select data-rule-enabled="${item.key}">
                  <option value="true" ${(edit.enabled ?? targetRule.enabled) ? "selected" : ""}>启用</option>
                  <option value="false" ${!(edit.enabled ?? targetRule.enabled) ? "selected" : ""}>停用</option>
                </select>
              </label>
              <button class="button primary" type="button" data-apply="${item.key}">
                <i data-lucide="save" size="15"></i>
                保存明细变更
              </button>
            </div>
            <div class="detail-note">
              直接编辑规则会按规则 ID 修改各品牌中已存在的匹配规则；没有该规则的品牌保持不变，不会被偷偷新增。
            </div>
          `;
        }
        if (item.type === "list") {
          return `
            <div class="editor-grid">
              <label>
                操作方式
                <select data-draft-mode="${item.key}">
                  <option value="append" ${edit.mode === "append" ? "selected" : ""}>新增例外</option>
                  <option value="remove" ${edit.mode === "remove" ? "selected" : ""}>移除测试例外</option>
                  <option value="keep" ${edit.mode === "keep" ? "selected" : ""}>不修改</option>
                </select>
              </label>
              <label>
                例外内容
                <select data-draft-value="${item.key}">
                  <option value="VIP10+ 降低 15 分">VIP10+ 降低 15 分</option>
                  <option value="测试账号免冻结">测试账号免冻结</option>
                </select>
              </label>
              <button class="button primary" type="button" data-apply="${item.key}">
                <i data-lucide="plus" size="15"></i>
                加入变更
              </button>
            </div>
          `;
        }
        const valueControl =
          item.type === "select"
            ? `<select data-draft-value="${item.key}">
                ${item.options
                  .map((option) => `<option value="${option}" ${edit.value === option ? "selected" : ""}>${option}</option>`)
                  .join("")}
              </select>`
            : `<input data-draft-value="${item.key}" type="number" min="${item.min}" max="${item.max}" value="${edit.value}" />`;
        return `
          <div class="editor-grid">
            <label>
              操作方式
              <select data-draft-mode="${item.key}">
                <option value="set" ${edit.mode === "set" ? "selected" : ""}>统一设置</option>
                <option value="default" ${edit.mode === "default" ? "selected" : ""}>恢复市场模板</option>
                <option value="keep" ${edit.mode === "keep" ? "selected" : ""}>不修改</option>
              </select>
            </label>
            <label>
              目标值${isCurrencySensitive(item) ? `（${selectedCurrencies()[0]}）` : ""}
              ${valueControl}
            </label>
            <button class="button primary" type="button" data-apply="${item.key}">
              <i data-lucide="plus" size="15"></i>
              加入变更
            </button>
          </div>
        `;
      }

      function renderOriginalValues(item, edit) {
        const rows =
          state.scope === "merchant"
            ? activeMarketCurrencies().map((currency) => ({
                name: `${marketLabel(currency)} 市场模板`,
                currency,
                current: isCurrencySensitive(item) ? templateValue(item, currency) : merchantDefaults[item.key],
                source: marketTemplates[currency].defaultSource,
                next: previewNextText(item, edit, { currency, values: merchantDefaults })
              }))
            : selectedBrands().map((brand) => ({
                name: brand.name,
                currency: brand.currency,
                current: brand.values[item.key],
                source: templateSource(item, brand),
                next: previewNextText(item, edit, brand)
              }));
        return `
          <div class="original-block">
            <div class="original-head">
              <strong>原配置明细</strong>
              <span>${state.scope === "merchant" ? `${rows.length} 个市场模板值` : `${rows.length} 个品牌当前配置`}</span>
            </div>
            <div class="current-table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>${state.scope === "merchant" ? "市场模板" : "品牌"}</th>
                    <th>币种</th>
                    <th>当前配置</th>
                    <th>来源</th>
                    <th>若发布本对象</th>
                  </tr>
                </thead>
                <tbody>
                  ${rows
                    .map(
                      (row) => `
                        <tr>
                          <td>${row.name}</td>
                          <td>${row.currency}</td>
                          <td>${formatTableValue(item.key, row.current, isCurrencySensitive(item) ? row.currency : null)}</td>
                          <td>${row.source}</td>
                          <td>${row.next}</td>
                        </tr>
                      `
                    )
                    .join("")}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      function defaultEdit(item) {
        if (item.type === "rules") {
          const targetRule = availableRuleOptions().find((rule) => rule.id === "fail-login") || availableRuleOptions()[0];
          return {
            mode: "editRule",
            value: "same-device-burst",
            targetRuleId: targetRule.id,
            condition: targetRule.condition,
            score: targetRule.score + 5,
            enabled: targetRule.enabled
          };
        }
        if (item.type === "list") return { mode: "append", value: "VIP10+ 降低 15 分" };
        const agg = aggregate(item.key);
        if (agg.kind === "same") return { mode: "set", value: agg.values[0] };
        if (item.type === "select") return { mode: "set", value: item.options[0] };
        if (isCurrencySensitive(item)) return { mode: "set", value: templateValue(item, selectedCurrencies()[0]) };
        return { mode: "set", value: merchantDefaults[item.key] };
      }

      function previewValueForObject(item, edit, brand) {
        const current = brand && state.scope === "merchant" && isCurrencySensitive(item)
          ? templateValue(item, brand)
          : brand ? brand.values[item.key] : firstValue(item.key);
        if (!edit || edit.mode === "keep") return current;
        if (edit.mode === "default") return templateValue(item, brand);
        if (edit.mode === "set") return edit.value;
        if (item.type === "rules") {
          if (edit.mode === "editRule") {
            return current.map((rule) => {
              if (rule.id !== edit.targetRuleId) return rule;
              return {
                ...rule,
                condition: edit.condition,
                score: Number(edit.score),
                enabled: Boolean(edit.enabled)
              };
            });
          }
          if (edit.mode === "replacePackage") return clone(baseRules).concat([{ id: "same-card", name: "同银行卡多账号", condition: "同卡绑定账号 >= 2", score: 30, enabled: true }]);
          const addRule = edit.value === "same-card"
            ? { id: "same-card", name: "同银行卡多账号", condition: "同卡绑定账号 >= 2", score: 30, enabled: true }
            : ruleToAdd;
          return current.some((rule) => rule.id === addRule.id) ? current : current.concat([addRule]);
        }
        if (item.type === "list") {
          if (edit.mode === "remove") return current.filter((entry) => entry !== "测试账号免冻结");
          return current.includes(edit.value) ? current : current.concat([edit.value]);
        }
        return current;
      }

      function previewNextText(item, edit, brand) {
        if (!state.edits[item.key]) return "不变";
        const next = previewValueForObject(item, edit, brand);
        const currentValue = state.scope === "merchant" ? templateValue(item, brand) : brand.values[item.key];
        if (stable(next) === stable(currentValue)) return "不变";
        return formatValue(item.key, next, isCurrencySensitive(item) ? brand?.currency : null);
      }

      function draftTitle(item, edit) {
        if (edit.mode === "keep") return "不修改";
        if (edit.mode === "default") {
          const currency = isCurrencySensitive(item) ? selectedCurrencies()[0] : null;
          return formatValue(item.key, templateValue(item, currency), currency);
        }
        if (item.type === "rules") {
          if (edit.mode === "editRule") {
            const target = availableRuleOptions().find((rule) => rule.id === edit.targetRuleId);
            return `编辑规则：${target ? target.name : edit.targetRuleId}，${edit.score} 分`;
          }
          return edit.mode === "replacePackage" ? "替换为高敏感规则包" : "新增一条评分规则";
        }
        if (item.type === "list") return edit.mode === "remove" ? "移除测试账号例外" : `新增例外：${edit.value}`;
        return formatValue(item.key, edit.value, isCurrencySensitive(item) ? selectedCurrencies()[0] : null);
      }

      function draftSubtitle(edit, item) {
        if (edit.mode === "default") return "恢复为市场模板";
        if (edit.mode === "keep") return "不修改该对象";
        if (edit.mode === "editRule") return "直接修改规则明细，不替换规则包";
        if (edit.mode === "addRule") return "新增规则，不替换原规则包";
        if (edit.mode === "replacePackage") return "替换整套规则包，需要复核";
        if (edit.mode === "append") return "新增例外，不覆盖现有例外";
        if (edit.mode === "remove") return "按匹配项移除例外";
        if (state.scope === "merchant") return "发布后写入选中市场模板";
        return item && isCurrencySensitive(item) ? "发布后写入同市场选中品牌" : "发布后统一写入选中品牌";
      }

      function sourceText(source) {
        if (source === "mixed") return "多个版本";
        if (source === "currency") return "市场模板";
        return "市场模板";
      }

      function renderSummary() {
        const selected = selectedBrands();
        const editEntries = Object.entries(state.edits).filter(([, edit]) => edit.mode !== "keep");
        const riskCount = editEntries.filter(([key]) => getObject(key).risk).length;
        const errors = selected.length === 0 ? 1 : 0;
        const mixedCount = objects.flatMap((group) => group.items).filter((item) => aggregate(item.key).kind === "mixed").length;
        const currencies = selectedCurrencies();
        const lockedCurrencyItems = objects
          .flatMap((group) => group.items)
          .filter((item) => isCurrencySensitive(item) && !canEditItem(item)).length;
        document.getElementById("scopeText").textContent = isSingleBrandMerchant()
          ? "单品牌商户：唯一市场模板"
          : state.scope === "merchant"
            ? "市场模板集合"
            : `已选 ${selected.length} 个品牌`;
        document.getElementById("currencyText").textContent = state.scope === "merchant"
          ? `启用市场：${allMerchantCurrencies().map(marketLabel).join(" / ")}`
          : `市场：${currencies.length ? currencies.map(marketLabel).join(" / ") : "未选择"}`;
        document.getElementById("mixedText").textContent = lockedCurrencyItems
          ? `${lockedCurrencyItems} 个金额阈值需按市场编辑`
          : `${mixedCount} 个对象存在差异`;
        document.getElementById("summarySubtitle").textContent = isSingleBrandMerchant()
          ? "单品牌商户仅维护唯一市场模板"
          : state.scope === "merchant"
            ? "保存为市场模板参数"
            : `本次发布影响 ${selected.length} 个品牌`;
        document.getElementById("statBrands").textContent = state.scope === "merchant" ? activeMarketCurrencies().length : selected.length;
        document.getElementById("statScopeLabel").textContent = state.scope === "merchant" ? "影响市场" : "影响品牌";
        document.getElementById("statObjects").textContent = editEntries.length;
        document.getElementById("statRisk").textContent = riskCount;
        document.getElementById("statErrors").textContent = errors;
        document.getElementById("riskNote").classList.toggle("show", riskCount > 0);
        const changeList = document.getElementById("changeList");
        if (!editEntries.length) {
          changeList.innerHTML = '<div class="empty">尚未产生变更</div>';
        } else {
          changeList.innerHTML = editEntries
            .map(([key, edit]) => {
              const item = getObject(key);
              return `
                <div class="change-item">
                  <div class="change-title">
                    <span>${item.name}</span>
                    ${item.risk ? '<span class="source-badge danger">高风险</span>' : ""}
                  </div>
                  <div class="change-meta">${draftSubtitle(edit, item)}：${draftTitle(item, edit)}</div>
                </div>
              `;
            })
            .join("");
        }
        const canPublish = editEntries.length > 0 && errors === 0;
        document.getElementById("previewDiff").disabled = !canPublish;
        document.getElementById("publishDraft").disabled = !canPublish;
      }

      function renderDiff() {
        const rows = [];
        const selected = state.scope === "merchant"
          ? activeMarketCurrencies().map((currency) => ({ id: currency, name: `${marketLabel(currency)} 市场模板`, currency, values: merchantDefaults }))
          : selectedBrands();
        Object.entries(state.edits).forEach(([key, edit]) => {
          if (edit.mode === "keep") return;
          const item = getObject(key);
          selected.forEach((brand) => {
            const current = state.scope === "merchant" ? templateValue(item, brand) : brand.values[key];
            const next = previewValueForObject(item, edit, brand);
            rows.push({
              brand: brand.name,
              currency: brand.currency,
              object: item.name,
              source: edit.mode === "default"
                ? `${marketLabel(brand.currency)} 市场模板`
                : state.scope === "merchant" ? "市场模板批量同步" : isCurrencySensitive(item) ? "品牌金额覆盖" : "品牌覆盖",
              current: formatValue(key, current, isCurrencySensitive(item) ? brand.currency : null),
              next: formatValue(key, next, isCurrencySensitive(item) ? brand.currency : null),
              status: item.risk ? "需复核" : "可发布"
            });
          });
        });
        document.getElementById("diffRows").innerHTML = rows
          .map(
            (row) => `
              <tr>
                <td>${row.brand}</td>
                <td>${row.currency}</td>
                <td>${row.object}</td>
                <td>${row.source}</td>
                <td>${row.current}</td>
                <td>${row.next}</td>
                <td>${row.status}</td>
              </tr>
            `
          )
          .join("");
      }

      function applyDraft(key) {
        const item = getObject(key);
        if (!canEditItem(item)) {
          showToast(itemLockReason(item));
          return;
        }
        const mode = document.querySelector(`[data-draft-mode="${key}"]`).value;
        const control = document.querySelector(`[data-draft-value="${key}"]`);
        const value = control ? (item.type === "number" ? Number(control.value) : control.value) : null;
        if (mode === "keep") {
          delete state.edits[key];
        } else if (item.type === "rules" && mode === "editRule") {
          state.edits[key] = {
            mode,
            value,
            targetRuleId: document.querySelector(`[data-rule-target="${key}"]`).value,
            condition: document.querySelector(`[data-rule-condition="${key}"]`).value,
            score: Number(document.querySelector(`[data-rule-score="${key}"]`).value),
            enabled: document.querySelector(`[data-rule-enabled="${key}"]`).value === "true"
          };
        } else {
          state.edits[key] = { mode, value };
        }
      }

      function publish() {
        const targets = state.scope === "merchant"
          ? activeMarketCurrencies().map((currency) => ({ currency, values: merchantDefaults }))
          : selectedBrands();
        Object.entries(state.edits).forEach(([key, edit]) => {
          const item = getObject(key);
          if (edit.mode === "keep") return;
          targets.forEach((target) => {
            if (state.scope === "merchant" && isCurrencySensitive(item)) {
              currencyDefaults[target.currency][key] = previewValueForObject(item, edit, target);
            } else {
              target.values[key] = previewValueForObject(item, edit, target);
            }
          });
        });
        state.edits = {};
        state.openEditor = null;
        closeDiff();
        render();
        showToast("风控发布单已生成，原型已模拟写入市场/品牌配置");
      }

      function render() {
        normalizeScope();
        syncScopeControls();
        renderScenarioLadder();
        renderBrands();
        renderTemplateMap();
        renderWorkbench();
        renderSummary();
        if (window.lucide) window.lucide.createIcons();
      }

      function showToast(text) {
        const toast = document.getElementById("toast");
        toast.textContent = text;
        toast.classList.add("show");
        window.setTimeout(() => toast.classList.remove("show"), 2200);
      }

      function openDiff() {
        renderDiff();
        document.getElementById("diffModal").classList.add("show");
      }

      function closeDiff() {
        document.getElementById("diffModal").classList.remove("show");
      }

      document.addEventListener("click", (event) => {
        const scopeTab = event.target.closest(".scope-tab");
        if (scopeTab) {
          if (isSingleBrandMerchant() && scopeTab.dataset.scope === "brands") {
            showToast("单品牌商户只开放唯一市场模板配置");
            return;
          }
          state.scope = scopeTab.dataset.scope;
          state.edits = {};
          state.openEditor = null;
          document.querySelectorAll(".scope-tab").forEach((button) => button.classList.remove("active"));
          scopeTab.classList.add("active");
          render();
          return;
        }
        const scenarioPreset = event.target.closest("[data-scenario-preset]");
        if (scenarioPreset) {
          applyScenarioPreset(scenarioPreset.dataset.scenarioPreset);
          return;
        }
        const marketSelect = event.target.closest("[data-market-select]");
        if (marketSelect) {
          selectMarket(marketSelect.dataset.marketSelect);
          return;
        }
        const preset = event.target.closest("[data-select-preset]");
        if (preset) {
          const mode = preset.dataset.selectPreset;
          if (state.scope === "merchant") return;
          if (mode === "all") state.selected = new Set(brands.filter((brand) => brand.status === "live").map((brand) => brand.id));
          if (mode === "test") state.selected = new Set(brands.filter((brand) => brand.status === "test").map((brand) => brand.id));
          if (mode === "clear") state.selected = new Set();
          state.edits = {};
          render();
          return;
        }
        const currencyPreset = event.target.closest("[data-select-currency]");
        if (currencyPreset) {
          if (state.scope === "merchant") return;
          const currency = currencyPreset.dataset.selectCurrency;
          state.selected = new Set(brands.filter((brand) => brand.currency === currency && brand.status !== "pause").map((brand) => brand.id));
          state.edits = {};
          state.openEditor = null;
          render();
          return;
        }
        const editButton = event.target.closest("[data-edit]");
        if (editButton) {
          const key = editButton.dataset.edit;
          const item = getObject(key);
          if (!canEditItem(item)) {
            showToast(itemLockReason(item));
            return;
          }
          state.openEditor = state.openEditor === key ? null : key;
          render();
          return;
        }
        const applyButton = event.target.closest("[data-apply]");
        if (applyButton) {
          applyDraft(applyButton.dataset.apply);
          render();
          return;
        }
        if (event.target.closest("#previewDiff")) openDiff();
        if (event.target.closest("#publishDraft")) openDiff();
        if (event.target.closest("#publishFromModal")) publish();
        if (event.target.closest("#closeDiff") || event.target.closest("#closeDiffBottom")) closeDiff();
        if (event.target.closest("#resetDraft")) {
          state.edits = {};
          state.openEditor = null;
          render();
        }
        if (event.target.closest("#validateDraft")) {
          const selected = selectedBrands();
          showToast(selected.length ? "校验通过；高风险项需要复核后发布" : "请先选择作用品牌");
        }
      });

      document.addEventListener("change", (event) => {
        const brandCheckbox = event.target.closest("[data-brand]");
        if (!brandCheckbox) return;
        if (state.scope === "merchant") return;
        const id = brandCheckbox.dataset.brand;
        if (brandCheckbox.checked) {
          state.selected.add(id);
        } else {
          state.selected.delete(id);
        }
        state.edits = {};
        render();
      });

      document.getElementById("brandSearch").addEventListener("input", (event) => {
        state.query = event.target.value;
        renderBrands();
        if (window.lucide) window.lucide.createIcons();
      });

      document.getElementById("diffModal").addEventListener("click", (event) => {
        if (event.target.id === "diffModal") closeDiff();
      });

      render();
    </script>
  </body>
</html>
