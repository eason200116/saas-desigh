<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VIP 配置中心 - 多品牌配置原型</title>
    <style>
      :root {
        --bg: #f5f7f7;
        --surface: #ffffff;
        --surface-soft: #f0f4f3;
        --surface-strong: #e7eeec;
        --line: #d7e0dd;
        --line-strong: #aebfba;
        --text: #1f2927;
        --muted: #65736f;
        --faint: #87948f;
        --teal: #11756f;
        --teal-dark: #0d5652;
        --blue: #2d6f9f;
        --amber: #9a6519;
        --red: #a84235;
        --green: #27704a;
        --shadow: 0 16px 42px rgba(31, 42, 39, 0.08);
        --radius: 8px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
        line-height: 1.45;
        margin: 0;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .app {
        display: grid;
        grid-template-columns: 232px minmax(680px, 1fr) 320px;
        min-width: 1280px;
        min-height: 100vh;
      }

      .sidebar {
        background: #fbfcfc;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        padding: 18px 14px;
      }

      .brand {
        align-items: center;
        display: flex;
        gap: 10px;
        padding: 6px 6px 18px;
      }

      .brand-symbol {
        align-items: center;
        background: var(--teal);
        border-radius: 8px;
        color: #fff;
        display: inline-flex;
        height: 34px;
        justify-content: center;
        width: 34px;
      }

      .brand strong {
        display: block;
        font-size: 15px;
        line-height: 1.2;
      }

      .brand span {
        color: var(--muted);
        display: block;
        font-size: 12px;
        margin-top: 3px;
      }

      .nav-label {
        color: var(--faint);
        font-size: 12px;
        font-weight: 700;
        margin: 16px 8px 8px;
      }

      .nav {
        display: grid;
        gap: 4px;
      }

      .nav a,
      .nav button {
        align-items: center;
        background: transparent;
        border: 0;
        border-radius: 7px;
        color: #33403d;
        display: grid;
        font-size: 13px;
        gap: 9px;
        grid-template-columns: 18px 1fr auto;
        min-height: 36px;
        padding: 8px 9px;
        text-align: left;
      }

      .nav a.active,
      .nav button.active {
        background: #e8f3f1;
        color: var(--teal-dark);
        font-weight: 800;
      }

      .nav a.disabled,
      .nav button.disabled {
        color: #a2aaa7;
      }

      .nav .count {
        color: var(--faint);
        font-size: 11px;
      }

      .main {
        min-width: 0;
        padding: 20px 22px 32px;
      }

      .topbar {
        align-items: start;
        display: flex;
        gap: 16px;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      h1 {
        color: #182522;
        font-size: 24px;
        line-height: 1.2;
        margin: 0;
      }

      .subtitle {
        color: var(--muted);
        font-size: 13px;
        margin: 6px 0 0;
      }

      .top-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
      }

      .icon-button,
      .button {
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 7px;
        display: inline-flex;
        gap: 8px;
        min-height: 34px;
        padding: 7px 10px;
      }

      .icon-button {
        background: var(--surface);
        color: #35423f;
        width: 36px;
        justify-content: center;
      }

      .button {
        background: var(--surface);
        color: #263431;
        font-size: 13px;
        font-weight: 700;
      }

      .button.primary {
        background: var(--teal);
        border-color: var(--teal);
        color: #fff;
      }

      .button.warn {
        background: #fff7e8;
        border-color: #ebd5ab;
        color: #5a3a10;
      }

      .button:disabled {
        cursor: not-allowed;
        opacity: 0.48;
      }

      .scope-panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        margin-bottom: 16px;
      }

      .scope-row {
        align-items: center;
        display: grid;
        gap: 14px;
        grid-template-columns: 1fr auto;
        padding: 14px;
      }

      .segmented {
        background: var(--surface-soft);
        border: 1px solid var(--line);
        border-radius: 7px;
        display: inline-grid;
        gap: 4px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        padding: 4px;
        width: min(340px, 100%);
      }

      .segmented button {
        background: transparent;
        border: 0;
        border-radius: 5px;
        color: #465350;
        font-size: 13px;
        font-weight: 800;
        min-height: 30px;
        padding: 6px 9px;
      }

      .segmented button:disabled {
        cursor: not-allowed;
        opacity: 0.42;
      }

      .segmented button.active {
        background: var(--surface);
        box-shadow: 0 1px 4px rgba(31, 42, 39, 0.08);
        color: var(--teal-dark);
      }

      .scope-meta {
        align-items: center;
        color: var(--muted);
        display: flex;
        flex-wrap: wrap;
        font-size: 12px;
        gap: 8px;
        justify-content: flex-end;
      }

      .chip {
        align-items: center;
        background: var(--surface-soft);
        border: 1px solid var(--line);
        border-radius: 999px;
        color: #3c4845;
        display: inline-flex;
        font-size: 12px;
        font-weight: 700;
        gap: 6px;
        min-height: 26px;
        padding: 4px 9px;
      }

      .chip.warning {
        background: #fff7e8;
        border-color: #ead3a7;
        color: #694512;
      }

      .scenario-ladder {
        border-top: 1px solid var(--line);
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        padding: 0 14px 14px;
      }

      .scenario-heading {
        align-items: center;
        color: var(--muted);
        display: flex;
        font-size: 12px;
        gap: 8px;
        grid-column: 1 / -1;
        justify-content: space-between;
        padding-top: 12px;
      }

      .scenario-heading strong {
        color: #263431;
        font-size: 13px;
      }

      .scenario-step {
        background: #fbfcfc;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: inherit;
        cursor: pointer;
        display: grid;
        gap: 7px;
        min-height: 106px;
        padding: 10px;
        text-align: left;
      }

      .scenario-step.active {
        border-color: #a7cdc8;
        box-shadow: inset 0 0 0 1px #cbe4df;
      }

      .scenario-step strong {
        align-items: center;
        color: #1f2927;
        display: flex;
        font-size: 13px;
        gap: 7px;
      }

      .scenario-step p {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
        margin: 0;
      }

      .scenario-step .scenario-status {
        align-items: center;
        color: var(--teal-dark);
        display: inline-flex;
        font-size: 11px;
        font-weight: 800;
        gap: 5px;
      }

      .brand-strip {
        border-top: 1px solid var(--line);
        display: grid;
        gap: 10px;
        grid-template-columns: 1fr auto;
        padding: 12px 14px 14px;
      }

      .brand-lock {
        align-items: center;
        background: #f1f7f5;
        border: 1px solid #d8e7e2;
        border-radius: 7px;
        color: #2f4c47;
        display: none;
        font-size: 13px;
        font-weight: 750;
        gap: 8px;
        min-height: 36px;
        padding: 8px 10px;
      }

      .brand-strip.locked .brand-lock {
        display: flex;
      }

      .brand-strip.locked .brand-tools,
      .brand-strip.locked .brand-list {
        display: none;
      }

      .brand-tools {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .search {
        align-items: center;
        background: var(--surface-soft);
        border: 1px solid var(--line);
        border-radius: 7px;
        display: flex;
        gap: 8px;
        min-height: 34px;
        padding: 0 10px;
        width: min(280px, 100%);
      }

      .search input {
        background: transparent;
        border: 0;
        color: var(--text);
        min-width: 0;
        outline: 0;
        width: 100%;
      }

      .brand-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .brand-pill {
        align-items: center;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 7px;
        color: #2e3b38;
        display: inline-flex;
        gap: 7px;
        min-height: 34px;
        padding: 6px 9px;
      }

      .brand-pill input {
        accent-color: var(--teal);
      }

      .brand-pill .status {
        border-radius: 999px;
        font-size: 11px;
        font-weight: 800;
        padding: 2px 6px;
      }

      .status.live {
        background: #e8f5ed;
        color: var(--green);
      }

      .status.test {
        background: #eef3ff;
        color: var(--blue);
      }

      .status.pause {
        background: #fff2e1;
        color: var(--amber);
      }

      .currency-tag {
        background: #eef3f2;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: #3c4845;
        font-size: 11px;
        font-weight: 800;
        padding: 2px 6px;
      }

      .template-map {
        border-top: 1px solid var(--line);
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        padding: 12px 14px 14px;
      }

      .template-card {
        background: #fbfcfc;
        border: 1px solid var(--line);
        border-radius: 8px;
        cursor: pointer;
        display: grid;
        gap: 8px;
        min-width: 0;
        padding: 10px;
      }

      .template-card.active {
        border-color: #a7cdc8;
        box-shadow: inset 0 0 0 1px #cbe4df;
      }

      .template-card strong {
        color: #1f2927;
        display: block;
        font-size: 13px;
      }

      .template-card p {
        color: var(--muted);
        font-size: 12px;
        margin: 0;
      }

      .template-card .template-values {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .template-card .template-values span {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 999px;
        color: #45524f;
        font-size: 11px;
        padding: 3px 7px;
      }

      .market-brand-list {
        border-top: 1px dashed var(--line);
        display: grid;
        gap: 6px;
        padding-top: 8px;
      }

      .market-brand-list strong {
        color: #51615d;
        font-size: 12px;
      }

      .market-brand-list div {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .market-brand-list span,
      .market-select-hint {
        align-items: center;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 999px;
        color: #45524f;
        display: inline-flex;
        font-size: 11px;
        gap: 4px;
        padding: 3px 7px;
      }

      .market-select-hint {
        background: #e9f5f2;
        border-color: #c4ded8;
        color: var(--teal-dark);
        font-weight: 800;
        justify-self: start;
      }

      .workbench {
        display: grid;
        gap: 14px;
      }

      .config-group {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
      }

      .group-head {
        align-items: center;
        background: #fbfcfc;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 12px;
        justify-content: space-between;
        padding: 13px 15px;
      }

      .group-head h2 {
        color: #182522;
        font-size: 16px;
        margin: 0;
      }

      .group-head span {
        color: var(--muted);
        font-size: 12px;
      }

      .field-table {
        display: grid;
      }

      .field-row {
        align-items: center;
        border-bottom: 1px solid var(--line);
        display: grid;
        gap: 12px;
        grid-template-columns: minmax(190px, 240px) minmax(260px, 1fr) 150px 112px;
        min-height: 74px;
        padding: 12px 15px;
      }

      .field-row:last-child {
        border-bottom: 0;
      }

      .field-name {
        min-width: 0;
      }

      .field-name strong {
        color: #1f2927;
        display: block;
        font-size: 14px;
      }

      .field-name span {
        color: var(--muted);
        display: block;
        font-size: 12px;
        margin-top: 4px;
      }

      .value-box {
        align-items: center;
        background: var(--surface-soft);
        border: 1px solid var(--line);
        border-radius: 7px;
        display: grid;
        gap: 8px;
        grid-template-columns: minmax(0, 1fr) auto;
        min-height: 42px;
        padding: 8px 10px;
      }

      .value-box.mixed {
        background: #fff8ec;
        border-color: #ecd7af;
      }

      .value-main {
        min-width: 0;
      }

      .value-title {
        color: #263431;
        display: block;
        font-size: 13px;
        font-weight: 800;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .value-sub {
        color: var(--muted);
        display: block;
        font-size: 12px;
        margin-top: 2px;
      }

      .value-distribution {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        grid-column: 1 / -1;
      }

      .value-distribution span {
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid var(--line);
        border-radius: 999px;
        color: #53615d;
        font-size: 11px;
        padding: 3px 7px;
      }

      .source-badge {
        border-radius: 999px;
        font-size: 11px;
        font-weight: 800;
        justify-self: start;
        padding: 4px 7px;
      }

      .source-badge.default {
        background: #eef3f2;
        color: #50605c;
      }

      .source-badge.override {
        background: #e7f2f1;
        color: var(--teal-dark);
      }

      .source-badge.mixed {
        background: #fff1db;
        color: #80510e;
      }

      .source-badge.currency {
        background: #eef3ff;
        color: var(--blue);
      }

      .edit-cell {
        align-items: center;
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }

      .small-button {
        align-items: center;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 7px;
        color: #2d3936;
        display: inline-flex;
        font-size: 12px;
        font-weight: 800;
        gap: 6px;
        min-height: 32px;
        padding: 6px 9px;
      }

      .small-button.active {
        background: #e8f3f1;
        border-color: #a7cdc8;
        color: var(--teal-dark);
      }

      .small-button:disabled {
        cursor: not-allowed;
        opacity: 0.48;
      }

      .editor-row {
        background: #fbfcfc;
        border-bottom: 1px solid var(--line);
        display: none;
        grid-template-columns: 240px minmax(0, 1fr);
        padding: 0 15px 14px;
      }

      .editor-row.open {
        display: grid;
      }

      .editor-panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        grid-column: 2 / 3;
        padding: 13px;
      }

      .original-block {
        background: #fbfcfc;
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-bottom: 12px;
        overflow: hidden;
      }

      .original-head {
        align-items: center;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 10px;
        justify-content: space-between;
        padding: 10px 12px;
      }

      .original-head strong {
        font-size: 13px;
      }

      .original-head span {
        color: var(--muted);
        font-size: 12px;
      }

      .current-table-wrap {
        max-height: 230px;
        overflow: auto;
      }

      .current-table {
        border-collapse: collapse;
        width: 100%;
      }

      .current-table th,
      .current-table td {
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        padding: 9px 10px;
        text-align: left;
        vertical-align: top;
      }

      .current-table th {
        background: var(--surface-soft);
        color: #2e3b38;
        font-weight: 800;
        position: sticky;
        top: 0;
      }

      .current-table tr:last-child td {
        border-bottom: 0;
      }

      .editor-warning {
        background: #eef7f5;
        border: 1px solid #cbe4df;
        border-radius: 7px;
        color: #204a45;
        font-size: 12px;
        margin-bottom: 10px;
        padding: 9px 10px;
      }

      .editor-grid {
        align-items: end;
        display: grid;
        gap: 10px;
        grid-template-columns: 180px minmax(160px, 1fr) auto;
      }

      label {
        color: #34413e;
        display: grid;
        font-size: 12px;
        font-weight: 800;
        gap: 6px;
      }

      select,
      input[type="number"],
      input[type="text"] {
        background: var(--surface);
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        color: var(--text);
        min-height: 36px;
        padding: 7px 9px;
      }

      .distribution {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }

      .distribution span {
        background: var(--surface-soft);
        border: 1px solid var(--line);
        border-radius: 999px;
        color: #45524f;
        font-size: 12px;
        padding: 4px 8px;
      }

      .aside {
        background: #fbfcfc;
        border-left: 1px solid var(--line);
        min-height: 100vh;
        padding: 20px 16px;
      }

      .summary-panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
        position: sticky;
        top: 16px;
      }

      .summary-head {
        border-bottom: 1px solid var(--line);
        padding: 15px;
      }

      .summary-head h2 {
        font-size: 16px;
        margin: 0;
      }

      .summary-head p {
        color: var(--muted);
        font-size: 12px;
        margin: 5px 0 0;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        padding: 12px 15px;
      }

      .stat {
        background: var(--surface-soft);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 10px;
      }

      .stat strong {
        display: block;
        font-size: 20px;
        line-height: 1;
      }

      .stat span {
        color: var(--muted);
        display: block;
        font-size: 12px;
        margin-top: 6px;
      }

      .changes {
        border-top: 1px solid var(--line);
        max-height: 280px;
        overflow: auto;
        padding: 8px 0;
      }

      .change-item {
        border-bottom: 1px solid var(--line);
        padding: 10px 15px;
      }

      .change-item:last-child {
        border-bottom: 0;
      }

      .change-title {
        align-items: center;
        display: flex;
        font-size: 13px;
        font-weight: 800;
        gap: 7px;
        justify-content: space-between;
      }

      .change-meta {
        color: var(--muted);
        font-size: 12px;
        margin-top: 5px;
      }

      .empty {
        color: var(--muted);
        font-size: 13px;
        padding: 18px 15px;
      }

      .summary-actions {
        border-top: 1px solid var(--line);
        display: grid;
        gap: 8px;
        padding: 14px 15px 15px;
      }

      .risk-note {
        background: #fff7e8;
        border: 1px solid #ead3a7;
        border-radius: 7px;
        color: #5b3a10;
        display: none;
        font-size: 12px;
        padding: 9px 10px;
      }

      .risk-note.show {
        display: block;
      }

      .modal-backdrop {
        align-items: center;
        background: rgba(13, 24, 22, 0.42);
        display: none;
        inset: 0;
        justify-content: center;
        padding: 24px;
        position: fixed;
        z-index: 20;
      }

      .modal-backdrop.show {
        display: flex;
      }

      .modal {
        background: var(--surface);
        border-radius: 8px;
        box-shadow: 0 24px 70px rgba(10, 20, 18, 0.25);
        max-height: min(720px, 92vh);
        max-width: 920px;
        overflow: hidden;
        width: 100%;
      }

      .modal-head {
        align-items: center;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        padding: 16px 18px;
      }

      .modal-head h2 {
        font-size: 18px;
        margin: 0;
      }

      .modal-body {
        max-height: 520px;
        overflow: auto;
        padding: 0 18px 18px;
      }

      .diff-table {
        border-collapse: collapse;
        width: 100%;
      }

      .diff-table th,
      .diff-table td {
        border-bottom: 1px solid var(--line);
        font-size: 13px;

    <script>

      const fields = [

        {

            },
            {
              key: "highRiskReview",
              name: "高风险复核",
              desc: "高价值权益变更是否要求复核",
              type: "select",
              options: ["开启", "关闭"],
              risk: true
            }
          ]
        }
      ];

      const state = {
        scope: "merchant",
        selected: new Set(["aurora", "metro", "nova", "tiger", "river"]),
        edits: {},
        openEditor: null,
        query: ""
      };

      const statusLabel = {
        live: "运营中",
        test: "测试",
        pause: "暂停"
      };

      function isSingleBrandMerchant() {
        return brands.length === 1;
      }

      function normalizeScope() {
        if (isSingleBrandMerchant()) {
          state.scope = "merchant";
          state.selected = new Set([brands[0].id]);
        }
      }

      function syncScopeControls() {
        document.querySelectorAll(".scope-tab").forEach((button) => {
          button.disabled = isSingleBrandMerchant() && button.dataset.scope === "brands";
          button.classList.toggle("active", button.dataset.scope === state.scope);
        });
      }

      function selectedBrands() {
        const selected = brands.filter((brand) => state.selected.has(brand.id));
        if (state.scope === "merchant") return selected.length ? selected : brands;
        return selected;
      }

      function getField(key) {
        return fields.flatMap((group) => group.items).find((field) => field.key === key);
      }

      function selectedCurrencies() {
        return [...new Set(selectedBrands().map((brand) => brand.currency))];
      }

      function allMerchantCurrencies() {
        return [...new Set(brands.map((brand) => brand.currency))];
      }

      function activeMarketCurrencies() {
        const currencies = selectedCurrencies();
        return currencies.length ? currencies : allMerchantCurrencies();
      }

      function marketLabel(currency) {
        const market = marketTemplates[currency];
        return market ? `${market.country} / ${market.currency}` : currency;
      }

      function marketMetaText(currency) {
        const market = marketTemplates[currency];
        return market ? `币种 ${market.currency}，语言 ${market.language}` : currency;
      }

      function marketTemplateName(currency) {
        const market = marketTemplates[currency];
        return market ? market.name : `${currency} 市场`;
      }

      function marketBrandCount(currency) {
        return brands.filter((brand) => brand.currency === currency).length;
      }

      function marketBrands(currency) {
        return brands.filter((brand) => brand.currency === currency);
      }

      function selectMarket(currency) {
        state.selected = new Set(marketBrands(currency).map((brand) => brand.id));
        state.edits = {};
        state.openEditor = null;
        showToast(`已选择 ${marketLabel(currency)} 市场`);
        render();
      }

      function currentScenarioKey() {
        const brandCount = selectedBrands().length;
        const currencyCount = selectedCurrencies().length;
        if (brandCount <= 1 && currencyCount <= 1) return "singleBrand";
        if (currencyCount <= 1) return "singleCurrency";
        return "multiCurrency";
      }

      function scenarioSteps() {
        return [
          {
            key: "multiCurrency",
            icon: "layers-3",
            title: "1 多品牌多市场",
            status: "默认基准",
            desc: "先确保跨品牌、跨市场的模板继承、金额锁定、差异预览都成立。"
          },
          {
            key: "singleCurrency",
            icon: "coins",
            title: "2 多品牌单一市场",
            status: "简化态",
            desc: "同市场品牌可批量编辑金额字段，仍保留品牌覆盖和发布差异。"
          },
          {
            key: "singleBrand",
            icon: "lock-keyhole",
            title: "3 单一品牌单一市场",
            status: "锁定态",
            desc: "真实单品牌商户锁定品牌选择，仅保留继承查看和模板编辑。"
          }
        ];
      }

      function renderScenarioLadder() {
        const ladder = document.getElementById("scenarioLadder");
        const active = currentScenarioKey();
        ladder.innerHTML = `
          <div class="scenario-heading">
            <strong>场景优先级</strong>
            <span>市场模板是唯一基础；先按多品牌多市场优先设计，再逐层收敛</span>
          </div>
          ${scenarioSteps()
            .map((step) => `
              <button class="scenario-step ${active === step.key ? "active" : ""}" type="button" data-scenario-preset="${step.key}" aria-pressed="${active === step.key}">
                <strong><i data-lucide="${step.icon}" size="15"></i>${step.title}</strong>
                <p>${step.desc}</p>
                <span class="scenario-status"><i data-lucide="${active === step.key ? "check-circle-2" : "circle"}" size="13"></i>${active === step.key ? "当前状态" : step.status}</span>
              </button>
            `)
            .join("")}
        `;
      }

      function applyScenarioPreset(key) {
        state.edits = {};
        state.openEditor = null;
        state.query = "";
        if (key === "multiCurrency") {
          state.scope = "merchant";
          state.selected = new Set(brands.map((brand) => brand.id));
          showToast("已切换到多品牌多市场基准场景");
        }
        if (key === "singleCurrency") {
          const currency = allMerchantCurrencies().find((item) => brands.filter((brand) => brand.currency === item && brand.status !== "pause").length > 1) || allMerchantCurrencies()[0];
          state.scope = "merchant";
          state.selected = new Set(brands.filter((brand) => brand.currency === currency && brand.status !== "pause").map((brand) => brand.id));
          showToast(`已切换到 ${marketLabel(currency)} 多品牌单一市场样例`);
        }
        if (key === "singleBrand") {
          const brand = brands.find((item) => item.status === "live") || brands[0];
          state.scope = "merchant";
          state.selected = new Set([brand.id]);
          showToast("已切换到单一品牌单一市场样例");
        }
        render();
      }

      function isCurrencySensitive(field) {
        return Boolean(field?.currencySensitive);
      }

      function templateValue(field, brandOrCurrency) {
        const currency = typeof brandOrCurrency === "string" ? brandOrCurrency : brandOrCurrency?.currency;
        if (isCurrencySensitive(field)) return currencyDefaults[currency]?.[field.key] ?? merchantDefaults[field.key];
        return merchantDefaults[field.key];
      }

      function templateSource(field, brand) {
        return brand.values[field.key] === templateValue(field, brand) ? `继承 ${marketLabel(brand.currency)} 市场模板` : "品牌覆盖";
      }

      function canEditField(field) {
        if (!isCurrencySensitive(field)) return true;
        return selectedCurrencies().length === 1;
      }

      function fieldLockReason(field) {
        if (!isCurrencySensitive(field)) return "";
        return `当前选中 ${selectedCurrencies().map(marketLabel).join(" / ")}，金额字段需按单一市场分组编辑。`;
      }

      function aggregate(key) {
        const field = getField(key);
        const items = selectedBrands();
        if (!items.length) {
          return { kind: "empty", title: "未选择品牌", sub: "无作用范围", source: "default", values: [] };
        }
        if (state.scope === "merchant") {
          if (isCurrencySensitive(field)) {
            const currencies = activeMarketCurrencies();
            if (currencies.length === 1) {
              const value = templateValue(field, currencies[0]);
              return {
                kind: "same",
                title: formatValue(key, value, currencies[0]),
                sub: `${marketLabel(currencies[0])} 市场模板`,
                source: "currency",
                values: [value]
              };
            }
            return {
              kind: "mixed",
              title: "按市场模板维护",
              sub: `${currencies.map(marketLabel).join(" / ")} ${currencies.length} 个市场模板`,
              source: "currency",
              values: currencies.map((currency) => templateValue(field, currency))
            };
          }
          const value = merchantDefaults[key];
          return {
            kind: "same",
            title: formatValue(key, value),
            sub: "跨市场批量默认值",
            source: "default",
            values: [value]
          };
        }
        const currencies = selectedCurrencies();
        if (isCurrencySensitive(field) && currencies.length > 1) {
          return {
            kind: "mixed",
            title: "跨市场金额字段",
            sub: `${currencies.map(marketLabel).join(" / ")}，需按市场分组编辑`,
            source: "currency",
            values: items.map((brand) => brand.values[key])
          };
        }
        const values = items.map((brand) => brand.values[key]);
        const unique = [...new Set(values)];
        const defaultCount = items.filter((brand) => brand.values[key] === templateValue(field, brand)).length;
        if (unique.length === 1) {
          return {
            kind: "same",
            title: formatValue(key, unique[0], isCurrencySensitive(field) ? currencies[0] : null),
            sub: defaultCount === values.length
              ? isCurrencySensitive(field) ? `全部继承 ${marketLabel(currencies[0])} 市场模板` : "全部继承各自市场模板"
              : "全部品牌同值",
            source: defaultCount === values.length ? "default" : "override",
            values
          };
        }
        return {
          kind: "mixed",
          title: "多个值",
          sub: `${unique.length} 种取值，${defaultCount} 个品牌等于市场模板`,
          source: "mixed",
          values
        };
      }

      function formatValue(key, value) {
        const field = getField(key);
        if (!field) return value;
        const currency = arguments.length > 2 ? arguments[2] : null;
        if (field.type === "number") return `${Number(value).toLocaleString()}${isCurrencySensitive(field) && currency ? ` ${currency}` : field.unit || ""}`;
        return value;
      }

      function distribution(key) {
        const field = getField(key);
        if (state.scope === "merchant") {
          if (isCurrencySensitive(field)) {
            return activeMarketCurrencies().map((currency) => `${marketLabel(currency)} 市场模板：${formatValue(key, templateValue(field, currency), currency)}`);
          }
          return activeMarketCurrencies().map((currency) => `${marketLabel(currency)} 市场模板：${formatValue(key, merchantDefaults[key])}`);
        }
        const counts = new Map();
        selectedBrands().forEach((brand) => {
          const label = formatValue(key, brand.values[key], isCurrencySensitive(field) ? brand.currency : null);
          counts.set(label, (counts.get(label) || 0) + 1);
        });
        if (!counts.size) return ["未选择品牌"];
        return [...counts.entries()].map(([label, count]) => `${label}：${count} 个品牌`);
      }

      function renderBrands() {
        const strip = document.getElementById("brandStrip");
        const lock = document.getElementById("brandLock");
        const list = document.getElementById("brandList");
        const locked = state.scope === "merchant" || isSingleBrandMerchant();
        strip.classList.toggle("locked", locked);
        if (locked) {
          lock.innerHTML = isSingleBrandMerchant()
            ? '<i data-lucide="lock-keyhole" size="15"></i><span>单品牌商户已锁定为唯一市场模板，品牌侧只读继承。</span>'
            : '<i data-lucide="file-cog" size="15"></i><span>当前维护市场模板；上方只用于选择市场和查看继承品牌，字段编辑在下方完成。</span>';
          list.innerHTML = "";
          return;
        }
        const filtered = brands.filter((brand) => brand.name.toLowerCase().includes(state.query.toLowerCase()));
        list.innerHTML = filtered
          .map((brand) => {
            const checked = state.selected.has(brand.id) ? "checked" : "";
            const disabled = state.scope === "merchant" ? "disabled" : "";
            return `
              <label class="brand-pill">
                <input type="checkbox" data-brand="${brand.id}" ${checked} ${disabled} />
                <span>${brand.name}</span>
                <span class="currency-tag">${brand.currency}</span>
                <span class="status ${brand.status}">${statusLabel[brand.status]}</span>
              </label>
            `;
          })
          .join("");
      }

      function renderTemplateMap() {
        const map = document.getElementById("templateMap");
        const activeCurrencies = activeMarketCurrencies();
        map.innerHTML = `
          ${activeCurrencies
            .map(
              (currency) => `
                <div class="template-card active" role="button" tabindex="0" data-market-select="${currency}">
                  <strong>${marketTemplateName(currency)} <span class="currency-tag">${currency}</span></strong>
                  <p>${marketTemplates[currency].defaultSource}，${marketMetaText(currency)}；${marketBrandCount(currency)} 个品牌继承。这里只做选择和关系展示。</p>
                  ${renderMarketSelectorContent(currency)}
                </div>
              `
            )
            .join("")}
        `;
      }

      function renderMarketSelectorContent(currency) {
        const brandChips = marketBrands(currency)
          .map((brand) => `<span>${brand.name} · ${statusLabel[brand.status]}</span>`)
          .join("");
        return `
          <div class="market-brand-list">
            <strong>继承品牌</strong>
            <div>${brandChips}</div>
          </div>
          <span class="market-select-hint"><i data-lucide="mouse-pointer-2" size="13"></i>选择此市场</span>
        `;
      }

      function renderWorkbench() {
        const workbench = document.getElementById("workbench");
        workbench.innerHTML = fields
          .map((group) => {
            const rows = group.items
              .map((field) => {
                const agg = aggregate(field.key);
                const edit = state.edits[field.key];
                const open = state.openEditor === field.key;
                const active = edit ? "active" : "";
                const risk = field.risk ? '<span class="chip warning">高风险</span>' : "";
                const currency = isCurrencySensitive(field) ? '<span class="chip"><i data-lucide="globe-2" size="13"></i>市场字段</span>' : "";
                const locked = !canEditField(field);
                const openEditor = open && !locked;
                return `
                  <div class="field-row">
                    <div class="field-name">
                      <strong>${field.name}</strong>
                      <span>${field.desc}</span>
                    </div>
                    <div class="value-box ${agg.kind === "mixed" ? "mixed" : ""}">
                      <div class="value-main">
                        <span class="value-title">${edit ? formatDraft(field, edit) : agg.title}</span>
                        <span class="value-sub">${edit ? draftSubtitle(edit, field) : agg.sub}</span>
                      </div>
                      <span class="source-badge ${edit ? "override" : agg.source}">
                        ${edit ? "本次变更" : sourceText(agg.source)}
                      </span>
                      <div class="value-distribution">
                        ${distribution(field.key)
                          .slice(0, 4)
                          .map((item) => `<span>${item}</span>`)
                          .join("")}
                      </div>
                    </div>
                    <div class="scope-meta">
                      ${currency}
                      ${locked ? '<span class="chip warning">按市场编辑</span>' : risk}
                    </div>
                    <div class="edit-cell">
                      <button class="small-button ${active}" type="button" data-edit="${field.key}" ${locked ? "disabled" : ""} title="${locked ? fieldLockReason(field) : ""}">
                        <i data-lucide="${openEditor ? "chevron-up" : locked ? "lock-keyhole" : "pencil"}" size="14"></i>
                        ${openEditor ? "收起" : locked ? "锁定" : "编辑"}
                      </button>
                    </div>
                  </div>
                  <div class="editor-row ${openEditor ? "open" : ""}">
                    <div></div>
                    <div class="editor-panel">
                      ${openEditor ? renderEditor(field) : ""}
                    </div>
                  </div>
                `;
              })
              .join("");
            return `
              <section class="config-group">
                <div class="group-head">
                  <div>
                    <h2>${group.group}</h2>
                    <span>${group.note}</span>
                  </div>
                  <span class="chip">${group.items.length} 个字段</span>
                </div>
                <div class="field-table">${rows}</div>
              </section>
            `;
          })
          .join("");
      }

      function renderEditor(field) {
        const edit = state.edits[field.key] || { mode: "set", value: defaultDraftValue(field) };
        const currency = isCurrencySensitive(field) ? selectedCurrencies()[0] : null;
        const valueControl =
          field.type === "select"
            ? `<select data-draft-value="${field.key}">
                ${field.options
                  .map((option) => `<option value="${option}" ${edit.value === option ? "selected" : ""}>${option}</option>`)
                  .join("")}
              </select>`
            : `<input data-draft-value="${field.key}" type="number" min="${field.min}" max="${field.max}" value="${edit.value}" />`;

        return `
          ${renderOriginalValues(field, edit)}
          <div class="editor-warning">
            ${isCurrencySensitive(field)
              ? state.scope === "merchant" ? `当前编辑 ${currencyLabel[currency]} 市场模板。金额字段不做跨市场统一设置，也不做汇率折算。` : `当前仅编辑 ${currencyLabel[currency]} 品牌。金额字段不做跨市场统一设置，也不做汇率折算。`
              : state.scope === "merchant" ? "当前是跨市场批量同步工具，不是统一继承层；发布后写入每个市场模板。" : "先确认原配置明细，再加入变更。本页面只提交主动加入变更的字段，未修改字段会保留各品牌原值。"}
          </div>
          <div class="editor-grid">
            <label>
              操作方式
              <select data-draft-mode="${field.key}">
                <option value="set" ${edit.mode === "set" ? "selected" : ""}>统一设置</option>
                <option value="default" ${edit.mode === "default" ? "selected" : ""}>恢复市场模板</option>
                <option value="keep" ${edit.mode === "keep" ? "selected" : ""}>不修改</option>
              </select>
            </label>
            <label>
              目标值${currency ? `（${currency}）` : ""}
              ${valueControl}
            </label>
            <button class="button primary" type="button" data-apply="${field.key}">
              <i data-lucide="plus" size="15"></i>
              加入变更
            </button>
          </div>
        `;
      }

      function renderOriginalValues(field, edit) {
        const rows =
          state.scope === "merchant"
            ? activeMarketCurrencies().map((currency) => ({
                name: `${marketLabel(currency)} 市场模板`,
                currency,
                current: isCurrencySensitive(field) ? templateValue(field, currency) : merchantDefaults[field.key],
                source: marketTemplates[currency].defaultSource,
                next: previewNextValue(field, edit, { currency, values: merchantDefaults })
              }))
            : selectedBrands().map((brand) => ({
                name: brand.name,
                currency: brand.currency,
                current: brand.values[field.key],
                source: templateSource(field, brand),
                next: previewNextValue(field, edit, brand)
              }));

        return `
          <div class="original-block">
            <div class="original-head">
              <strong>原配置明细</strong>
              <span>${state.scope === "merchant" ? `${rows.length} 个市场模板值` : `${rows.length} 个品牌当前值`}</span>
            </div>
            <div class="current-table-wrap">
              <table class="current-table">
                <thead>
                  <tr>
                    <th>${state.scope === "merchant" ? "市场模板" : "品牌"}</th>
                    <th>币种</th>
                    <th>当前原值</th>
                    <th>来源</th>
                    <th>若发布本字段</th>
                  </tr>
                </thead>
                <tbody>
                  ${rows
                    .map(
                      (row) => `
                        <tr>
                          <td>${row.name}</td>
                          <td>${row.currency}</td>
                          <td>${formatValue(field.key, row.current, isCurrencySensitive(field) ? row.currency : null)}</td>
                          <td>${row.source}</td>
                          <td>${row.next}</td>
                        </tr>
                      `
                    )
                    .join("")}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      function previewNextValue(field, edit, brand) {
        if (!state.edits[field.key]) return "不变";
        if (edit.mode === "keep") return "不变";
        const value = edit.mode === "default" ? templateValue(field, brand) : edit.value;
        const current = state.scope === "merchant" ? templateValue(field, brand) : brand.values[field.key];
        if (current === value) return "不变";
        return formatValue(field.key, value, isCurrencySensitive(field) ? brand?.currency : null);
      }

      function defaultDraftValue(field) {
        const agg = aggregate(field.key);
        if (agg.kind === "same") return agg.values[0];
        if (field.type === "select") return field.options[0];
        if (isCurrencySensitive(field)) return templateValue(field, selectedCurrencies()[0]);
        return merchantDefaults[field.key];
      }

      function sourceText(source) {
        if (source === "mixed") return "多个来源";
        if (source === "currency") return "市场模板";
        if (source === "override") return "品牌覆盖";
        return "市场模板";
      }

      function draftSubtitle(edit, field) {
        if (edit.mode === "default") return "恢复为市场模板值";
        if (edit.mode === "keep") return "不修改该字段";
        if (state.scope === "merchant") return "发布后写入选中市场模板";
        return field && isCurrencySensitive(field) ? "发布后写入同市场选中品牌" : "发布后统一写入选中品牌";
      }

      function formatDraft(field, edit) {
        const currency = isCurrencySensitive(field) ? selectedCurrencies()[0] : null;
        if (edit.mode === "default") return formatValue(field.key, templateValue(field, currency), currency);
        if (edit.mode === "keep") return "不修改";
        return formatValue(field.key, edit.value, currency);
      }

      function renderSummary() {
        const selected = selectedBrands();
        const editEntries = Object.entries(state.edits).filter(([, edit]) => edit.mode !== "keep");
        const riskCount = editEntries.filter(([key]) => getField(key).risk).length;
        const errors = selected.length === 0 ? 1 : 0;
        const mixedCount = fields
          .flatMap((group) => group.items)
          .filter((field) => aggregate(field.key).kind === "mixed").length;
        const currencies = selectedCurrencies();
        const lockedCurrencyFields = fields
          .flatMap((group) => group.items)
          .filter((field) => isCurrencySensitive(field) && !canEditField(field)).length;

        document.getElementById("scopeText").textContent = isSingleBrandMerchant()
          ? "单品牌商户：唯一市场模板"
          : state.scope === "merchant"
            ? "市场模板集合"
            : `已选 ${selected.length} 个品牌`;
        document.getElementById("currencyText").textContent = state.scope === "merchant"
          ? `启用市场：${allMerchantCurrencies().map(marketLabel).join(" / ")}`
          : `市场：${currencies.length ? currencies.map(marketLabel).join(" / ") : "未选择"}`;
        document.getElementById("mixedText").textContent = lockedCurrencyFields
          ? `${lockedCurrencyFields} 个金额字段需按市场编辑`
          : `${mixedCount} 个字段存在多个值`;
        document.getElementById("summarySubtitle").textContent = isSingleBrandMerchant()
          ? "单品牌商户仅维护唯一市场模板"
          : state.scope === "merchant"
            ? "保存为市场模板参数"
            : `本次发布影响 ${selected.length} 个品牌`;
        document.getElementById("statBrands").textContent = state.scope === "merchant" ? activeMarketCurrencies().length : selected.length;
        document.getElementById("statScopeLabel").textContent = state.scope === "merchant" ? "影响市场" : "影响品牌";
        document.getElementById("statFields").textContent = editEntries.length;
        document.getElementById("statRisks").textContent = riskCount;
        document.getElementById("statErrors").textContent = errors;
        document.getElementById("riskNote").classList.toggle("show", riskCount > 0);

        const changeList = document.getElementById("changeList");
        if (!editEntries.length) {
          changeList.innerHTML = '<div class="empty">尚未产生变更</div>';
        } else {
          changeList.innerHTML = editEntries
            .map(([key, edit]) => {
              const field = getField(key);
              return `
                <div class="change-item">
                  <div class="change-title">
                    <span>${field.name}</span>
                    ${field.risk ? '<span class="source-badge mixed">高风险</span>' : ""}
                  </div>
                  <div class="change-meta">${draftSubtitle(edit, field)}：${formatDraft(field, edit)}</div>
                </div>
              `;
            })
            .join("");
        }

        const canPublish = editEntries.length > 0 && errors === 0;
        document.getElementById("previewDiff").disabled = !canPublish;
        document.getElementById("publishDraft").disabled = !canPublish;
      }

      function renderDiff() {
        const rows = [];
        const selected = state.scope === "merchant"
          ? activeMarketCurrencies().map((currency) => ({ name: `${marketLabel(currency)} 市场模板`, currency, values: merchantDefaults }))
          : selectedBrands();
        Object.entries(state.edits).forEach(([key, edit]) => {
          if (edit.mode === "keep") return;
          const field = getField(key);
          selected.forEach((brand) => {
            const current = state.scope === "merchant" ? templateValue(field, brand) : brand.values[key];
            const next = edit.mode === "default" ? templateValue(field, brand) : edit.value;
            rows.push({
              brand: brand.name,
              currency: brand.currency,
              field: field.name,
              source: edit.mode === "default"
                ? `${marketLabel(brand.currency)} 市场模板`
                : state.scope === "merchant" ? "市场模板批量同步" : isCurrencySensitive(field) ? "品牌金额覆盖" : "品牌覆盖",
              current: formatValue(key, current, isCurrencySensitive(field) ? brand.currency : null),
              next: formatValue(key, next, isCurrencySensitive(field) ? brand.currency : null),
              status: field.risk ? "需复核" : "可发布"
            });
          });
        });
        document.getElementById("diffRows").innerHTML = rows
          .map(
            (row) => `
              <tr>
                <td>${row.brand}</td>
                <td>${row.currency}</td>
                <td>${row.field}</td>
                <td>${row.source}</td>
                <td>${row.current}</td>
                <td>${row.next}</td>
                <td>${row.status}</td>
              </tr>
            `
          )
          .join("");
      }

      function render() {
        normalizeScope();
        syncScopeControls();
        renderScenarioLadder();
        renderBrands();
        renderTemplateMap();
        renderWorkbench();
        renderSummary();
        if (window.lucide) window.lucide.createIcons();
      }

      function publish() {
        Object.entries(state.edits).forEach(([key, edit]) => {
          if (edit.mode === "keep") return;
          const field = getField(key);
          if (state.scope === "merchant") {
            if (isCurrencySensitive(field)) {
              activeMarketCurrencies().forEach((currency) => {
                currencyDefaults[currency][key] = edit.mode === "default" ? templateValue(field, currency) : edit.value;
              });
            } else if (edit.mode !== "default") {
              merchantDefaults[key] = edit.value;
            }
          } else {
            selectedBrands().forEach((brand) => {
              const next = edit.mode === "default" ? templateValue(field, brand) : edit.value;
              brand.values[key] = next;
            });
          }
        });
        state.edits = {};
        state.openEditor = null;
        closeDiff();
        render();
        showToast("发布单已生成，当前原型已模拟写入市场/品牌配置");
      }

      function showToast(text) {
        const toast = document.getElementById("toast");
        toast.textContent = text;
        toast.classList.add("show");
        window.setTimeout(() => toast.classList.remove("show"), 2200);
      }

      function openDiff() {
        renderDiff();
        document.getElementById("diffModal").classList.add("show");
      }

      function closeDiff() {
        document.getElementById("diffModal").classList.remove("show");
      }

      document.addEventListener("click", (event) => {
        const scopeTab = event.target.closest(".scope-tab");
        if (scopeTab) {
          if (isSingleBrandMerchant() && scopeTab.dataset.scope === "brands") {
            showToast("单品牌商户只开放唯一市场模板配置");
            return;
          }
          state.scope = scopeTab.dataset.scope;
          state.edits = {};
          state.openEditor = null;
          render();
          return;
        }

        const scenarioPreset = event.target.closest("[data-scenario-preset]");
        if (scenarioPreset) {
          applyScenarioPreset(scenarioPreset.dataset.scenarioPreset);
          return;
        }

        const marketSelect = event.target.closest("[data-market-select]");
        if (marketSelect) {
          selectMarket(marketSelect.dataset.marketSelect);
          return;
        }

        const preset = event.target.closest("[data-select-preset]");
        if (preset) {
          const mode = preset.dataset.selectPreset;
          if (state.scope === "merchant") return;
          if (mode === "all") state.selected = new Set(brands.filter((brand) => brand.status === "live").map((brand) => brand.id));
          if (mode === "test") state.selected = new Set(brands.filter((brand) => brand.status === "test").map((brand) => brand.id));
          if (mode === "clear") state.selected = new Set();
          state.edits = {};
          render();
          return;
        }

        const currencyPreset = event.target.closest("[data-select-currency]");
        if (currencyPreset) {
          if (state.scope === "merchant") return;
          const currency = currencyPreset.dataset.selectCurrency;
          state.selected = new Set(brands.filter((brand) => brand.currency === currency && brand.status !== "pause").map((brand) => brand.id));
          state.edits = {};
          state.openEditor = null;
          render();
          return;
        }

        const editButton = event.target.closest("[data-edit]");
        if (editButton) {
          const key = editButton.dataset.edit;
          const field = getField(key);
          if (!canEditField(field)) {
            showToast(fieldLockReason(field));
            return;
          }
          state.openEditor = state.openEditor === key ? null : key;
          render();
          return;
        }

        const applyButton = event.target.closest("[data-apply]");
        if (applyButton) {
          const key = applyButton.dataset.apply;
          const field = getField(key);
          if (!canEditField(field)) {
            showToast(fieldLockReason(field));
            return;
          }
          const mode = document.querySelector(`[data-draft-mode="${key}"]`).value;
          const control = document.querySelector(`[data-draft-value="${key}"]`);
          const value = field.type === "number" ? Number(control.value) : control.value;
          if (mode === "keep") {
            delete state.edits[key];
          } else {
            state.edits[key] = { mode, value };
          }
          render();
          return;
        }

        if (event.target.closest("#previewDiff")) openDiff();
        if (event.target.closest("#publishDraft")) openDiff();
        if (event.target.closest("#publishFromModal")) publish();
        if (event.target.closest("#closeDiff") || event.target.closest("#closeDiffBottom")) closeDiff();
        if (event.target.closest("#resetDraft")) {
          state.edits = {};
          state.openEditor = null;
          render();
        }
        if (event.target.closest("#validateDraft")) {
          const selected = selectedBrands();
          showToast(selected.length ? "校验通过，未发现阻断项" : "请先选择作用品牌");
        }
      });

      document.addEventListener("change", (event) => {
        const brandCheckbox = event.target.closest("[data-brand]");
        if (!brandCheckbox) return;
        if (state.scope === "merchant") return;
        const id = brandCheckbox.dataset.brand;
        if (brandCheckbox.checked) {
          state.selected.add(id);
        } else {
          state.selected.delete(id);
        }
        state.edits = {};
        render();
      });

      document.getElementById("brandSearch").addEventListener("input", (event) => {
        state.query = event.target.value;
        renderBrands();
        if (window.lucide) window.lucide.createIcons();
      });

      document.getElementById("diffModal").addEventListener("click", (event) => {
        if (event.target.id === "diffModal") closeDiff();
      });

      render();
    </script>
  </body>
</html>
