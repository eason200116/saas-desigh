<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>渠道管理 · 原型（照抄真实后台）</title>
<style>
  :root{--pri:#2563eb;--pri-d:#1d4ed8;--ink:#1f2733;--label:#5b6573;--muted:#8a93a3;--line:#e8ebf0;--head:#f5f7fa;--green:#18a058;--bg:#f0f2f5}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#fff;color:var(--ink);font-size:13px;line-height:1.5}
  .tabbar{display:flex;align-items:center;border-bottom:1px solid var(--line);padding:0 16px;height:42px;gap:18px}
  .tabbar .tab{font-size:14px;color:var(--pri);font-weight:600;height:100%;display:flex;align-items:center;box-shadow:inset 0 -2px 0 var(--pri)}
  .tabbar .spacer{flex:1}
  .btn{border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:5px;padding:6px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
  .btn:hover{background:var(--pri-d)}
  .btn.ghost{background:#fff;color:var(--pri)}
  .btn.ghost:hover{background:#f0f6ff}
  .btn.gray{background:#fff;color:#5b6573;border-color:#d4d9e0}
  .btn.gray:hover{background:#f5f7fa}
  .wrap{padding:14px 16px 40px}
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px}
  .filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 22px;align-items:center}
  .fi{display:flex;align-items:center;gap:8px}
  .fi label{flex:none;color:var(--label);white-space:nowrap}
  .sel,.ipt{flex:1;min-width:0;height:32px;border:1px solid #d4d9e0;border-radius:5px;padding:0 28px 0 10px;font-size:13px;color:var(--ink);background:#fff;appearance:none;-webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23a8b0bd' stroke-width='1.4'/></svg>");
    background-repeat:no-repeat;background-position:right 10px center}
  .ipt{background-image:none;padding-right:10px}
  .fi .q{flex:none}
  .quick{display:flex;align-items:center;gap:10px;margin-top:14px}
  .quick .ql{color:var(--label)}
  .chip{border:1px solid #d4d9e0;background:#fff;color:#5b6573;border-radius:5px;padding:5px 16px;cursor:pointer;font-size:13px}
  .chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
  .acts{display:flex;justify-content:flex-end;gap:10px;margin-bottom:10px}
  .tablewrap{border:1px solid var(--line);border-radius:8px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:1400px}
  th,td{padding:11px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
  th{background:var(--head);color:#4b5563;font-weight:600;white-space:nowrap}
  td{color:var(--ink)}
  tbody tr:hover{background:#f7faff}
  .link-cell{max-width:200px;word-break:break-all;color:#374151;line-height:1.5}
  .install-url{color:var(--green);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .install-url:hover{text-decoration:underline}
  .cp{cursor:pointer;color:#9aa4b2;font-size:13px}
  .cp:hover{color:var(--pri)}
  /* 开关 */
  .sw{position:relative;width:42px;height:22px;display:inline-flex;align-items:center;cursor:pointer;flex:none}
  .sw i{position:absolute;inset:0;background:#c9ced6;border-radius:22px;transition:.2s}
  .sw i:before{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .sw.on i{background:var(--green)}
  .sw.on i:before{transform:translateX(20px)}
  .sw b{position:relative;z-index:1;font-size:11px;color:#fff;font-weight:400;font-style:normal;margin-left:6px;white-space:nowrap}
  .sw.on b{margin-left:6px}
  .op{display:inline-flex;gap:10px;align-items:center;white-space:nowrap}
  .op .oi{cursor:pointer;font-size:14px;color:var(--pri)}
  .op .testin{color:var(--green);cursor:pointer;font-size:12px}
  .op .msg{cursor:pointer;color:#6b7280;font-size:14px}
  .pager{display:flex;align-items:center;gap:12px;padding:14px 4px 0;color:var(--label);font-size:13px}
  .pager .pg{min-width:28px;height:28px;border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:5px;display:inline-flex;align-items:center;justify-content:center}
  .pager .pp{height:28px;border:1px solid #d4d9e0;border-radius:5px;padding:0 8px;display:inline-flex;align-items:center;background:#fff;color:#5b6573}
  /* 弹窗 */
  .mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:flex-start;justify-content:center;padding:60px 16px;overflow:auto}
  .mask.show{display:flex}
  .modal{background:#fff;border-radius:8px;width:560px;max-width:96vw;box-shadow:0 12px 40px rgba(0,0,0,.2)}
  .modal.wide{width:980px}
  .mh{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line);font-size:16px;font-weight:600}
  .mh .x{cursor:pointer;color:#9aa4b2;font-size:18px;line-height:1}
  .mb{padding:22px 26px}
  .mf{display:flex;justify-content:center;padding:8px 0 22px}
  .form-row{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .form-row>label{flex:none;width:96px;text-align:right;color:var(--label)}
  .form-row .ctrl{flex:1;min-width:0}
  .seg{display:inline-flex;border:1px solid #d4d9e0;border-radius:5px;overflow:hidden}
  .seg span{padding:6px 20px;cursor:pointer;font-size:13px;color:#5b6573}
  .seg span.on{background:var(--pri);color:#fff}
  .radio{display:inline-flex;align-items:center;gap:6px;margin-right:22px;cursor:pointer}
  .radio i{width:15px;height:15px;border:1.5px solid #c4cad2;border-radius:50%;display:inline-block;position:relative}
  .radio.on i{border-color:var(--pri)}
  .radio.on i:after{content:"";position:absolute;width:8px;height:8px;background:var(--pri);border-radius:50%;left:2px;top:2px}
  .sub-toolbar{display:flex;align-items:center;gap:14px;margin-bottom:12px;flex-wrap:wrap}
  .sub-toolbar .grow{flex:1}
  .toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:rgba(31,39,51,.92);color:#fff;padding:9px 18px;border-radius:6px;font-size:13px;z-index:300;opacity:0;transition:.2s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>

<div class="tabbar">
  <span class="tab">渠道管理</span>
  <span class="spacer"></span>
  <button class="btn" onclick="toast('打开使用教程（演示）')">使用教程</button>
</div>

<div class="wrap">

  <!-- 筛选 -->
  <div class="card">
    <div class="filters">
      <div class="fi"><label>地区：</label><select class="sel"><option>巴西</option><option>印度</option><option>越南</option></select></div>
      <div class="fi"><label>商户：</label><select class="sel"><option>448</option><option>2001</option><option>1050</option></select></div>
      <div class="fi"><label>埋点类型：</label><select class="sel"><option>全部</option><option>facebook-api</option><option>常规推广</option><option>google-ads</option></select></div>
      <div class="fi"><label>推广渠道：</label><select class="sel"><option>全部</option><option>Facebook</option><option>Google</option><option>TikTok</option></select></div>
      <div class="fi"><label>安卓引导开关：</label><select class="sel"><option>全部</option><option>开启</option><option>关闭</option></select></div>
      <div class="fi"><label>弹框时间点：</label><select class="sel"><option>全部</option><option>用户充值</option><option>进入首页</option><option>注册成功</option></select></div>
      <div class="fi"><label>弹框间隔：</label><select class="sel"><option>全部</option><option>0小时(强制安装)</option><option>6小时</option><option>24小时</option></select></div>
      <div class="fi"><label>安装类型：</label><select class="sel"><option>全部</option><option>pwa(优先)+apk(推荐使用)</option><option>仅PWA</option><option>仅APK</option></select></div>
      <div class="fi" style="grid-column:4;justify-content:flex-end"><button class="btn q" onclick="render()">查询</button></div>
    </div>
    <div class="quick">
      <span class="ql">快捷筛选：</span>
      <span class="chip" data-p="" onclick="setChip(this)">全部</span>
      <span class="chip on" data-p="鳗鱼" onclick="setChip(this)">鳗鱼</span>
      <span class="chip" data-p="奥运" onclick="setChip(this)">奥运</span>
      <span class="chip" data-p="小卡" onclick="setChip(this)">小卡</span>
      <span class="chip" data-p="线下" onclick="setChip(this)">线下</span>
    </div>
  </div>

  <!-- 操作按钮 -->
  <div class="acts">
    <button class="btn" onclick="toast('批量替换：请在弹窗中选择替换项（演示）')">批量替换</button>
    <button class="btn" onclick="openPromoter()">新增推广商</button>
    <button class="btn" onclick="openChannel(null)">新增渠道</button>
    <button class="btn" onclick="toast('批量新增渠道：上传 CSV 批量创建（演示）')">批量新增渠道</button>
  </div>

  <!-- 表格 -->
  <div class="tablewrap">
    <table>
      <thead><tr>
        <th>序号</th><th>渠道名称</th><th>地区</th><th>商户</th><th>推广商</th><th>渠道Id</th><th>埋点类型</th>
        <th>渠道链接</th><th>安卓引导安装弹框</th><th>弹框时间点</th><th>弹框间隔</th><th>安装类型</th><th>安装方式</th><th>操作</th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
  <div class="pager">
    <span id="total">共 0 条数据</span>
    <span class="pg">1</span>
    <span class="pp">50 条/页 ▾</span>
  </div>
</div>

<!-- ===== 新增渠道 弹窗 ===== -->
<div class="mask" id="m-channel">
  <div class="modal">
    <div class="mh"><span id="m-channel-title">新增渠道</span><span class="x" onclick="closeM('m-channel')">✕</span></div>
    <div class="mb">
      <div class="form-row"><label>地区：</label><div class="ctrl"><select class="sel"><option>巴西</option><option>印度</option><option>越南</option></select></div></div>
      <div class="form-row"><label>所属商户：</label><div class="ctrl"><select class="sel"><option>448</option><option>2001</option><option>1050</option></select></div></div>
      <div class="form-row"><label>渠道名称：</label><div class="ctrl"><input class="ipt" placeholder="请输入"></div></div>
      <div class="form-row"><label>落地指向：</label><div class="ctrl"><select class="sel"><option>仿谷歌页</option><option>仿应用商店页</option><option>自定义落地页</option></select></div></div>
      <div class="form-row"><label>跳转域名：</label><div class="ctrl"><select class="sel"><option>请选择</option><option>googlebtpeb.com</option><option>googleuvbqc.com</option></select></div></div>
      <div class="form-row"><label>埋点类型：</label><div class="ctrl"><select class="sel"><option>常规推广</option><option>facebook-api</option><option>google-ads</option></select></div></div>
      <div class="form-row"><label>推广商：</label><div class="ctrl"><select class="sel"><option>鳗鱼</option><option>奥运</option><option>小卡</option><option>线下</option></select></div></div>
      <div class="form-row"><label>渠道设置：</label><div class="ctrl"><span class="seg"><span class="on" onclick="seg(this)">安卓</span><span onclick="seg(this)">苹果</span></span></div></div>
      <div class="form-row"><label>下载按钮：</label><div class="ctrl"><select class="sel"><option>关闭</option><option>开启</option></select></div></div>
      <div class="form-row"><label>引导安装：</label><div class="ctrl"><select class="sel"><option>关闭</option><option>开启</option></select></div></div>
      <div class="form-row"><label>安装pwa/App赠送：</label><div class="ctrl"><select class="sel"><option>关闭</option><option>开启</option></select></div></div>
    </div>
    <div class="mf"><button class="btn" onclick="closeM('m-channel');toast('保存成功')">确定</button></div>
  </div>
</div>

<!-- ===== 推广商 列表 弹窗 ===== -->
<div class="mask" id="m-promoter">
  <div class="modal wide">
    <div class="mh"><span>推广商</span><span class="x" onclick="closeM('m-promoter')">✕</span></div>
    <div class="mb">
      <div class="sub-toolbar">
        <div class="fi" style="flex:none"><label style="color:var(--label)">推广商：</label><input class="ipt" style="width:170px" placeholder="请输入"></div>
        <div class="fi" style="flex:none"><label style="color:var(--label)">显示/隐藏：</label><select class="sel" style="width:120px"><option>全部</option><option>显示</option><option>隐藏</option></select></div>
        <button class="btn gray" onclick="toast('已重置')">重置</button>
        <button class="btn" onclick="toast('查询完成')">查询</button>
        <div class="grow"></div>
        <button class="btn" onclick="openPromoterAdd()">新增推广商</button>
      </div>
      <div class="tablewrap">
        <table style="min-width:auto">
          <thead><tr><th>推广商</th><th>显示/隐藏</th><th>排序</th><th>操作</th></tr></thead>
          <tbody id="pr-tb"></tbody>
        </table>
      </div>
      <div class="pager"><span>共 4 条数据</span><span class="pg">1</span><span class="pp">50 条/页 ▾</span></div>
    </div>
  </div>
</div>

<!-- ===== 新增推广商 弹窗 ===== -->
<div class="mask" id="m-promoter-add">
  <div class="modal" style="width:500px">
    <div class="mh"><span id="pa-title">新增</span><span class="x" onclick="closeM('m-promoter-add')">✕</span></div>
    <div class="mb">
      <div class="form-row"><label>推广商：</label><div class="ctrl"><input class="ipt" id="pa-name" placeholder="请输入"></div></div>
      <div class="form-row"><label>排序：</label><div class="ctrl"><input class="ipt" id="pa-sort" placeholder="请输入"></div></div>
      <div class="form-row"><label>显示/隐藏：</label><div class="ctrl">
        <span class="radio on" onclick="radio(this)"><i></i>显示</span>
        <span class="radio" onclick="radio(this)"><i></i>隐藏</span>
      </div></div>
    </div>
    <div class="mf"><button class="btn" onclick="closeM('m-promoter-add');toast('保存成功')">确定</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // —— 数据 ——
  var DOMS=['googlebtpeb','googleuvbqc','googleekeej','googleemvmt','googlefzkq','googlehxnp','googlewqrt','googlemkvb','googlepdca','googlersne','googletbmw','googlexcqd'];
  function pix(){var s='';for(var i=0;i<15;i++)s+=Math.floor(Math.random()*10);return s;}
  var DATA=[];
  (function(){
    var promo=['鳗鱼','鳗鱼','鳗鱼','鳗鱼','鳗鱼','鳗鱼','奥运','奥运','小卡','小卡','线下','线下'];
    var names=['ME001','ME001','ME001','ME009','ME001','ME009','ME002','ME002','ME003','ME003','ME004','ME004'];
    for(var i=0;i<12;i++){
      var cid=26125+i*3+(i%2);
      DATA.push({
        name:names[i]+'-fbpw'+(1000+i),region:'巴西',mch:'448',promoter:promo[i],cid:cid,track:'facebook-api',
        link:'https://'+DOMS[i]+'.com?ch='+cid+'&fbPixelId='+pix(),
        popup:true,popupTime:'用户充值',popupGap:'0小时(强制安装)',
        installType:'pwa(优先)+apk(推荐使用)',installUrl:'https://dl.megsite.com/'+cid
      });
    }
  })();
  var PROMOTERS=[['鳗鱼','显示',1000],['奥运','显示',102],['小卡','显示',101],['线下','显示',100]];
  var chipP='鳗鱼';

  function esc(s){return (''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
  function render(){
    var rows=DATA.filter(function(r){return !chipP||r.promoter===chipP;});
    var h=rows.map(function(r,i){
      return '<tr>'+
        '<td>'+(i+1)+'</td>'+
        '<td>'+esc(r.name).slice(0,9)+'…</td>'+
        '<td>'+r.region+'</td>'+
        '<td>'+r.mch+'</td>'+
        '<td><b>'+r.promoter+'</b></td>'+
        '<td>'+r.cid+'</td>'+
        '<td>'+r.track+'</td>'+
        '<td><div class="link-cell">'+esc(r.link)+'</div></td>'+
        '<td><span class="sw'+(r.popup?' on':'')+'" onclick="togglePopup(this,'+r.cid+')"><i></i><b>'+(r.popup?'开启':'关闭')+'</b></span></td>'+
        '<td>'+r.popupTime+'</td>'+
        '<td>'+r.popupGap+'</td>'+
        '<td>'+r.installType+'</td>'+
        '<td><a class="install-url" href="javascript:;">https://…<span class="cp" title="复制" onclick="event.stopPropagation();copy(\''+r.installUrl+'\')">⧉</span></a></td>'+
        '<td><span class="op"><span class="oi" title="编辑" onclick="openChannel('+r.cid+')">✎</span><span class="testin" onclick="toast(\'Testin 检测链接（演示）\')">Testin</span><span class="msg" title="留言" onclick="toast(\'打开留言（演示）\')">💬</span></span></td>'+
      '</tr>';
    }).join('')||'<tr><td colspan="14" style="text-align:center;color:#9aa4b2;padding:30px">暂无数据</td></tr>';
    document.getElementById('tb').innerHTML=h;
    document.getElementById('total').textContent='共 '+rows.length+' 条数据';
  }
  function setChip(el){
    [].slice.call(document.querySelectorAll('.chip')).forEach(function(c){c.classList.remove('on');});
    el.classList.add('on');chipP=el.getAttribute('data-p');render();
  }
  function togglePopup(el,cid){
    var on=el.classList.contains('on');
    el.classList.toggle('on');el.querySelector('b').textContent=on?'关闭':'开启';
    var d=DATA.filter(function(x){return x.cid===cid;})[0];if(d)d.popup=!on;
    toast('安卓引导安装弹框 已'+(on?'关闭':'开启'));
  }
  function renderPromoters(){
    document.getElementById('pr-tb').innerHTML=PROMOTERS.map(function(p){
      return '<tr><td>'+p[0]+'</td><td>'+p[1]+'</td><td>'+p[2]+'</td><td><span class="oi" style="color:var(--pri);cursor:pointer" onclick="openPromoterAdd(\''+p[0]+'\','+p[2]+')">✎</span></td></tr>';
    }).join('');
  }
  function openChannel(cid){
    document.getElementById('m-channel-title').textContent=cid?('编辑渠道 · '+cid):'新增渠道';
    openM('m-channel');
  }
  function openPromoter(){renderPromoters();openM('m-promoter');}
  function openPromoterAdd(name,sort){
    document.getElementById('pa-title').textContent=name?'编辑':'新增';
    document.getElementById('pa-name').value=name||'';
    document.getElementById('pa-sort').value=sort||'';
    openM('m-promoter-add');
  }
  function seg(el){[].slice.call(el.parentNode.children).forEach(function(s){s.classList.remove('on');});el.classList.add('on');}
  function radio(el){[].slice.call(el.parentNode.querySelectorAll('.radio')).forEach(function(r){r.classList.remove('on');});el.classList.add('on');}
  function openM(id){document.getElementById(id).classList.add('show');}
  function closeM(id){document.getElementById(id).classList.remove('show');}
  function copy(t){try{navigator.clipboard&&navigator.clipboard.writeText(t);}catch(e){}toast('已复制：'+t);}
  var tt;
  function toast(m){var el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){el.classList.remove('show');},1800);}
  // 点遮罩关闭
  [].slice.call(document.querySelectorAll('.mask')).forEach(function(m){m.addEventListener('click',function(e){if(e.target===m)m.classList.remove('show');});});
  render();
</script>
</body>
</html>
