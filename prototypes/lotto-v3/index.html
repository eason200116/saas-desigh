<html lang="zh-cmn-Hans" id="htmlRoot" data-theme="light">

    <script>
      // [部署兜底] SPA 深链还原：配合 GitHub Pages 根 404.html 重定向，把 /base/?/x/y 还原成 /base/x/y
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
      // [部署兜底] 线上(github.io)注入演示 token 跳过登录；本地 dev 不受影响
      try {
        if (location.hostname.endsWith('github.io')) {
          var __k = 'ACCESS-TOKEN';
          if (!localStorage.getItem(__k)) {
            localStorage.setItem(__k, JSON.stringify({ value: 'prototype-demo', expire: null }));
          }
        }
      } catch (e) {}
    </script>

    <script>
      (() => {
        const DESIGN_SETTING_KEY = 'DESIGN-SETTING';
        const DEFAULT_THEME = '#009688';
        const SOURCE_PALETTE = {
          backgroundEnd: '#58d6b7',
          backgroundMid: '#0b969b',
          backgroundStart: '#007888',
          dotEnd: '#53f2df',
          dotStart: '#f7fffd',
          glyphEnd: '#c9fff8',
          outline: '#85f2de',
          shadow: '#065a70',
        };

        function normalizeHexColor(input) {
          if (!input) return DEFAULT_THEME;

          const value = String(input).trim();
          if (/^#[0-9a-fA-F]{6}$/.test(value)) {
            return value;
          }

          if (/^#[0-9a-fA-F]{3}$/.test(value)) {
            return `#${value[1]}${value[1]}${value[2]}${value[2]}${value[3]}${value[3]}`;
          }

          return DEFAULT_THEME;
        }

        function getCachedDesignSetting() {
          try {
            const raw = window.localStorage.getItem(DESIGN_SETTING_KEY);
            if (!raw) return null;

            const parsed = JSON.parse(raw);
            if (
              parsed?.expire !== null &&
              typeof parsed?.expire === 'number' &&
              parsed.expire < Date.now()
            ) {
              return null;
            }

            return parsed?.value ?? null;
          } catch {
            return null;
          }
        }

        function createColorTransform(themeColor) {
          const source = hexToHsl(DEFAULT_THEME);
          const target = hexToHsl(normalizeHexColor(themeColor));

          return {
            hueShift: wrapHue(target.h - source.h),
            lightnessShift: clamp((target.l - source.l) * 0.55, -0.12, 0.12),
            saturationScale: clamp(target.s / Math.max(source.s, 0.01), 0.72, 1.45),
          };
        }

        function tintSourceColor(sourceHex, transform, options = {}) {
          const { h, l, s } = hexToHsl(sourceHex);

          return hslToHex(
            h + transform.hueShift + (options.hueShift ?? 0),
            clamp(s * transform.saturationScale * (options.saturationScale ?? 1), 0, 1),
            clamp(l + transform.lightnessShift + (options.lightnessShift ?? 0), 0, 1),
          );
        }

        function tintThemeColor(themeHex, options = {}) {
          const { h, l, s } = hexToHsl(themeHex);

          return hslToHex(
            h + (options.hueShift ?? 0),
            clamp(s * (options.saturationScale ?? 1), 0, 1),
            clamp(l + (options.lightnessShift ?? 0), 0, 1),
          );
        }

        function mixHex(primary, secondary, secondaryWeight) {
          const weight = clamp(secondaryWeight, 0, 1);
          const first = hexToRgb(primary);
          const second = hexToRgb(secondary);

          return `#${['r', 'g', 'b']
            .map((channel) =>
              Math.round(first[channel] * (1 - weight) + second[channel] * weight)
                .toString(16)
                .padStart(2, '0'),
            )
            .join('')}`;
        }

        function toAlpha(hexColor, opacity) {
          const { b, g, r } = hexToRgb(hexColor);
          return `rgba(${r}, ${g}, ${b}, ${clamp(opacity, 0, 1)})`;
        }

        function hexToRgb(hexColor) {
          const hex = normalizeHexColor(hexColor).slice(1);

          return {
            r: parseInt(hex.slice(0, 2), 16),
            g: parseInt(hex.slice(2, 4), 16),
            b: parseInt(hex.slice(4, 6), 16),
          };
        }

        function hexToHsl(hexColor) {
          const { b, g, r } = hexToRgb(hexColor);
          const red = r / 255;
          const green = g / 255;
          const blue = b / 255;
          const max = Math.max(red, green, blue);
          const min = Math.min(red, green, blue);
          const l = (max + min) / 2;

          if (max === min) {
            return { h: 0, s: 0, l };
          }

          const delta = max - min;
          const s = l > 0.5 ? delta / (2 - max - min) : delta / (max + min);
          let h = 0;

          switch (max) {
            case red:
              h = ((green - blue) / delta + (green < blue ? 6 : 0)) * 60;
              break;
            case green:
              h = ((blue - red) / delta + 2) * 60;
              break;
            default:
              h = ((red - green) / delta + 4) * 60;
              break;
          }

          return { h, s, l };
        }

        function hslToHex(h, s, l) {
          const hue = wrapHue(h);

          if (s === 0) {
            const channel = Math.round(l * 255)
              .toString(16)
              .padStart(2, '0');
            return `#${channel}${channel}${channel}`;
          }

          const q = l < 0.5 ? l * (1 + s) : l + s - l * s;
          const p = 2 * l - q;
          const red = hueToRgb(p, q, hue / 360 + 1 / 3);
          const green = hueToRgb(p, q, hue / 360);
          const blue = hueToRgb(p, q, hue / 360 - 1 / 3);

          return `#${[red, green, blue]
            .map((channel) =>
              Math.round(channel * 255)
                .toString(16)
                .padStart(2, '0'),
            )
            .join('')}`;
        }

        function hueToRgb(p, q, t) {
          let channel = t;
          if (channel < 0) channel += 1;
          if (channel > 1) channel -= 1;
          if (channel < 1 / 6) return p + (q - p) * 6 * channel;
          if (channel < 1 / 2) return q;
          if (channel < 2 / 3) return p + (q - p) * (2 / 3 - channel) * 6;
          return p;
        }

        function wrapHue(value) {
          let hue = value % 360;
          if (hue < 0) hue += 360;
          return hue;
        }

        function clamp(value, min, max) {
          return Math.min(max, Math.max(min, value));
        }

        function createFaviconSvg(themeColor, isDark) {
          // Keep in sync with src/components/Brand/theme.ts and src/components/Brand/svg.ts.
          const accent = normalizeHexColor(themeColor);
          const transform = createColorTransform(accent);
          const backgroundStart = mixHex(
            tintSourceColor(SOURCE_PALETTE.backgroundStart, transform, {
              lightnessShift: isDark ? -0.04 : -0.01,
              saturationScale: 0.95,
              hueShift: 4,
            }),
            tintThemeColor(accent, {
              lightnessShift: isDark ? -0.16 : -0.1,
              saturationScale: 1.08,
              hueShift: 4,
            }),
            0.42,
          );
          const backgroundMid = mixHex(
            tintSourceColor(SOURCE_PALETTE.backgroundMid, transform, {
              lightnessShift: isDark ? -0.03 : 0,
            }),
            tintThemeColor(accent, {
              lightnessShift: isDark ? -0.06 : 0,
              saturationScale: 1.04,
            }),
            0.52,
          );
          const backgroundEnd = mixHex(
            tintSourceColor(SOURCE_PALETTE.backgroundEnd, transform, {
              lightnessShift: isDark ? -0.08 : 0.03,
              saturationScale: 0.88,
              hueShift: -6,
            }),
            tintThemeColor(accent, {
              lightnessShift: isDark ? 0.05 : 0.2,
              saturationScale: 0.9,
              hueShift: -8,
            }),
            0.62,
          );
          const backgroundGlowStart = toAlpha(
            mixHex(
              backgroundEnd,
              tintThemeColor(accent, {
                lightnessShift: isDark ? 0.12 : 0.26,
                saturationScale: 0.42,
                hueShift: -10,
              }),
              0.28,
            ),
            isDark ? 0.22 : 0.3,
          );
          const backgroundGlowEnd = toAlpha(mixHex(backgroundEnd, '#ffffff', 0.24), 0);
          const glyphEnd = mixHex(
            tintSourceColor(SOURCE_PALETTE.glyphEnd, transform, {
              lightnessShift: isDark ? -0.05 : 0.02,
              saturationScale: 0.4,
              hueShift: -4,
            }),
            tintThemeColor(accent, {
              lightnessShift: isDark ? 0.22 : 0.38,
              saturationScale: 0.32,
              hueShift: -6,
            }),
            0.4,
          );
          const dotStart = mixHex(
            tintSourceColor(SOURCE_PALETTE.dotStart, transform, {
              lightnessShift: isDark ? -0.06 : 0.01,
              saturationScale: 0.24,
              hueShift: -6,
            }),
            tintThemeColor(accent, {
              lightnessShift: isDark ? 0.3 : 0.46,
              saturationScale: 0.18,
              hueShift: -6,
            }),
            0.34,
          );
          const dotEnd = mixHex(
            tintSourceColor(SOURCE_PALETTE.dotEnd, transform, {
              lightnessShift: isDark ? -0.03 : 0.04,
              saturationScale: 1.05,
              hueShift: -4,
            }),
            tintThemeColor(accent, {
              lightnessShift: isDark ? 0.16 : 0.28,
              saturationScale: 1.08,
              hueShift: -4,
            }),
            0.62,
          );
          const shadowColor = mixHex(
            tintSourceColor(SOURCE_PALETTE.shadow, transform, {
              lightnessShift: isDark ? -0.09 : -0.04,
              saturationScale: 0.9,
              hueShift: 8,
            }),
            tintThemeColor(accent, {
              lightnessShift: isDark ? -0.24 : -0.18,
              saturationScale: 0.88,
              hueShift: 8,
            }),
            0.5,
          );
          const outlineColor = mixHex(
            tintSourceColor(SOURCE_PALETTE.outline, transform, {
              lightnessShift: isDark ? -0.1 : -0.02,
              saturationScale: 0.72,
              hueShift: -4,
            }),
            tintThemeColor(accent, {
              lightnessShift: isDark ? 0.02 : 0.14,
              saturationScale: 0.74,
              hueShift: -4,
            }),
            0.56,
          );
          const shadowOpacity = isDark ? 0.44 : 0.32;

          return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 394 403" fill="none">
  <defs>
    <linearGradient id="bg" x1="34" y1="364" x2="356" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="${backgroundStart}"/>
      <stop offset="0.58" stop-color="${backgroundMid}"/>
      <stop offset="1" stop-color="${backgroundEnd}"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(328 31) rotate(121) scale(301 274)">
      <stop offset="0" stop-color="${backgroundGlowStart}"/>
      <stop offset="1" stop-color="${backgroundGlowEnd}"/>
    </radialGradient>
    <linearGradient id="surface" x1="97" y1="41" x2="297" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glyph" x1="14%" y1="0" x2="84%" y2="100%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="${glyphEnd}"/>
    </linearGradient>
    <linearGradient id="dot" x1="18%" y1="6%" x2="82%" y2="92%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.24" stop-color="${dotStart}"/>
      <stop offset="1" stop-color="${dotEnd}"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-18%" width="150%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="${shadowColor}" flood-opacity="${shadowOpacity}"/>
    </filter>
  </defs>
  <rect width="394" height="403" rx="82" fill="url(#bg)"/>
  <rect width="394" height="403" rx="82" fill="url(#glow)"/>
  <rect width="394" height="403" rx="82" fill="url(#surface)"/>
  <rect x="1.5" y="1.5" width="391" height="400" rx="80.5" stroke="${outlineColor}" stroke-opacity="${isDark ? 0.2 : 0.28}" stroke-width="1.5"/>
  <g filter="url(#shadow)" transform="translate(15 28) scale(1.4)">
    <path d="M128 24L40 224H74L92 184H164L182 224H216L128 24ZM107 148L128 98L149 148H107Z" fill="url(#glyph)"/>
    <path d="M128 72H176C200 72 216 87 216 108C216 126 204 138 184 143L220 224H183L152 153H128V128H172C181 128 188 121 188 111C188 101 181 96 172 96H128V72Z" fill="url(#glyph)"/>
  </g>
</svg>`;
        }

        function setInitialFavicon() {
          const link = document.getElementById('app-favicon');
          if (!(link instanceof HTMLLinkElement)) return;

          try {
            const cached = getCachedDesignSetting() || {};
            const svg = createFaviconSvg(cached.appTheme, Boolean(cached.darkTheme));
            const encoded = encodeURIComponent(svg).replace(/%([0-9A-F]{2})/g, (_, hex) =>
              String.fromCharCode(parseInt(hex, 16)),
            );
            link.href = `data:image/svg+xml;base64,${window.btoa(encoded)}`;
          } catch {
            link.type = 'image/x-icon';
            link.sizes = '';
            link.href = '/favicon.ico';
          }
        }

        setInitialFavicon();
      })();
    </script>

      <style>
        .first-loading-wrap {
          display: flex;
          width: 100%;
          height: 100vh;
          justify-content: center;
          align-items: center;
          flex-direction: column;
        }

        .first-loading-wrap > h1 {
          font-size: 128px;
        }

        .first-loading-wrap .loading-wrap {
          padding: 98px;
          display: flex;
          justify-content: center;
          align-items: center;
        }

        .dot {
          animation: antRotate 1.2s infinite linear;
          transform: rotate(45deg);
          position: relative;
          display: inline-block;
          font-size: 32px;
          width: 32px;
          height: 32px;
          box-sizing: border-box;
        }

        .dot i {
          width: 14px;
          height: 14px;
          position: absolute;
          display: block;
          background-color: #1890ff;
          border-radius: 100%;
          transform: scale(0.75);
          transform-origin: 50% 50%;
          opacity: 0.3;
          animation: antSpinMove 1s infinite linear alternate;
        }

        .dot i:nth-child(1) {
          top: 0;
          left: 0;
        }

        .dot i:nth-child(2) {
          top: 0;
          right: 0;
          -webkit-animation-delay: 0.4s;
          animation-delay: 0.4s;
        }

        .dot i:nth-child(3) {
          right: 0;
          bottom: 0;
          -webkit-animation-delay: 0.8s;
          animation-delay: 0.8s;
        }

        .dot i:nth-child(4) {
          bottom: 0;
          left: 0;
          -webkit-animation-delay: 1.2s;
          animation-delay: 1.2s;
        }

        @keyframes antRotate {
          to {
            -webkit-transform: rotate(405deg);
            transform: rotate(405deg);
          }
        }

        @-webkit-keyframes antRotate {
          to {
            -webkit-transform: rotate(405deg);
            transform: rotate(405deg);
          }
        }

        @keyframes antSpinMove {
          to {
            opacity: 1;
          }
        }

        @-webkit-keyframes antSpinMove {
          to {
            opacity: 1;
          }
        }
      </style>
      <div class="first-loading-wrap">
        <div class="loading-wrap">
          <span class="dot dot-spin"><i></i><i></i><i></i><i></i></span>
        </div>
