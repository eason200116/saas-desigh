<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>会员/运营/配置 · 导航结构原型</title>
<style>
:root{--blue:#2563eb;--blue-d:#1d4ed8;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--bg:#f3f4f6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}

/* ===== 顶栏（复刻目标后台·蓝色） ===== */
.topbar{height:56px;background:var(--blue);color:#fff;display:flex;align-items:center;padding:0 16px;gap:18px}
.tb-logo{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.tb-ident{display:flex;flex-direction:column;line-height:1.3;min-width:150px}
.tb-time{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.tb-meta{font-size:11px;opacity:.82;display:flex;align-items:center;gap:6px}
.tb-pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:0 7px;font-size:10px}
.tb-nav{flex:1;display:flex;justify-content:center;gap:4px}
.tb-nav a{color:rgba(255,255,255,.82);text-decoration:none;padding:8px 13px;border-radius:8px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:5px;position:relative;white-space:nowrap}
.tb-nav a.active{color:#fff;background:rgba(255,255,255,.16);font-weight:600}
.tb-nav a .nnew{position:absolute;top:-2px;right:0;background:#f59e0b;color:#fff;font-size:8px;font-weight:700;border-radius:5px;padding:0 3px}
.tb-right{display:flex;align-items:center;gap:16px}
.tb-ic{display:flex;flex-direction:column;align-items:center;font-size:11px;opacity:.9;position:relative}
.tb-ic b{font-size:13px}
.tb-badge{position:absolute;top:-6px;right:-10px;background:#ef4444;color:#fff;font-size:9px;border-radius:8px;padding:0 4px;font-weight:700}
.tb-user{display:flex;align-items:center;gap:8px;font-size:13px}
.tb-ava{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.25)}

/* ===== 模块面板 ===== */
.wrap{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modpanel{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mod-h{display:flex;align-items:center;gap:10px;padding:11px 18px;background:#f8fafc;border-bottom:1px solid var(--line)}
.mod-h .mi{width:26px;height:26px;border-radius:7px;background:#eef4ff;display:flex;align-items:center;justify-content:center;font-size:15px}
.mod-h h3{font-size:15px;color:var(--ink)}
.mod-h .msub{font-size:12px;color:var(--muted)}
.mod-h .mtag{font-size:10px;font-weight:700;color:#fff;background:#f59e0b;border-radius:6px;padding:1px 6px}
.mod-h .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
/* 子功能以 tab 页签形态展示，按分类成行 */
.catrows{padding:14px 18px 18px;display:flex;flex-direction:column;gap:12px}
.catrow{display:flex;align-items:flex-start;gap:14px}
.catrow-label{flex:0 0 112px;font-size:12px;font-weight:700;color:var(--blue);padding-top:8px;text-align:right}
.tabstrip{flex:1;display:flex;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.subtab{display:flex;align-items:center;gap:7px;padding:7px 14px;border:1px solid var(--line);border-radius:8px 8px 0 0;background:#fff;font-size:13px;color:#374151;cursor:pointer;position:relative;margin-bottom:-5px}
.subtab:hover{border-color:#bcd0ff;background:#f5f9ff}
.subtab .ico{width:7px;height:7px;border-radius:50%;flex:none}
.subtab.done .ico{background:#22c55e}
.subtab.todo{background:#fffdf5}
.subtab.todo .ico{background:#f59e0b}
.subtab.active{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.subtab.active .ico{background:#fff}
.subtab .nb{font-size:9px;font-weight:700;color:#fff;background:#f59e0b;border-radius:5px;padding:1px 4px}
.subtab.active .nb{background:rgba(255,255,255,.32)}
.subtab.add{background:#fdf2f8}
.subtab.add .ico{background:#db2777}
.subtab .nb.addb{background:#db2777}
</style>
</head>
<body>

<!-- 顶栏 -->
<div class="topbar">
  <div class="tb-logo">A</div>
  <div class="tb-ident">
    <div class="tb-time">🕐 2026-06-08 11:50:00 <span style="opacity:.7;font-weight:400">UTC+5:30</span></div>
    <div class="tb-meta">亚太集团 <span class="tb-pill">Site (1050) daman</span> 切换 ▾</div>
  </div>
  <div class="tb-nav">
    <a class="active">👥 会员管理 ▾</a>
    <a>📣 运营管理 ▾<span class="nnew">新</span></a>
    <a>🛡 风控管理 ▾<span class="nnew">新</span></a>
    <a>⚙️ 配置中心 ▾<span class="nnew">新</span></a>
    <a>💰 财务管理</a>
    <a>🎮 游戏管理</a>
    <a>📊 报表管理</a>
    <a>🛠 系统管理</a>
  </div>
  <div class="tb-right">
    <div class="tb-ic"><b>5000</b>在线<span class="tb-badge">5000</span></div>
    <div class="tb-ic"><b>60</b>出入款<span class="tb-badge">60</span></div>
    <div class="tb-ic"><b>11</b>消息<span class="tb-badge">11</span></div>
    <div class="tb-user"><div class="tb-ava"></div>sysadmin ▾</div>
  </div>
</div>

<div class="wrap" id="wrap"></div>

<script>
// 状态: 1=已建, 0=原待迁移, 2=本次对照SitINR补充
const MODULES=[
  {m:"会员管理", sub:"会员查询 + 基本管理", ic:"👥", isnew:0, cats:[
    {t:"账号查询", items:[["会员列表",1],["下级会员列表",1],["在线人数",1],["会员层级",1]]},
    {t:"会员分组", items:[["用户分组",0],["分组表单",0]]},
    {t:"认证 / 银行卡", items:[["会员银行卡管理",1],["CPF认证",0],["KW认证",0]]},
    {t:"登录 / 验证", items:[["登录日志列表",0],["登录日志",0],["登录日志(代理)",0],["短信验证码查询",2]]},
    {t:"代理关系", items:[["代理关系(D/C/M/A)",0],["代理关系导入",0]]},
  ]},
  {m:"运营管理", sub:"运营日常使用", ic:"📣", isnew:1, cats:[
    {t:"活动任务", items:[["任务活动",0],["任务活动配置",0],["任务订单",0]]},
    {t:"消息触达", items:[["站内消息",0]]},
    {t:"首充", items:[["首充管理",0]]},
    {t:"奖励 / 返佣数据", items:[["VIP奖励记录",0],["VIP等级人数",0],["返佣报表",0],["昨日返佣等级",2]]},
  ]},
  {m:"风控管理", sub:"风险检测 + 名单管控", ic:"🛡", isnew:1, cats:[
    {t:"异常 / 检测", items:[["异常会员处理",0],["对打查询",0],["同IP/设备检测",2]]},
  ]},
  {m:"配置中心", sub:"低频规则 · 集团模板 + 商户定制", ic:"⚙️", isnew:1, cats:[
    {t:"等级配置", items:[["VIP等级配置",0]]},
    {t:"返佣 / 代理配置", items:[["返佣等级",0],["代理审核机制",2]]},
    {t:"会员规则", items:[["分组权限配置",0],["签到配置",0]]},
  ]},
  {m:"系统管理", sub:"平台 · 权限 · 访问控制（已有模块）", ic:"🛠", isnew:0, cats:[
    {t:"权限管理", items:[["系统用户管理",1],["系统角色管理",1]]},
    {t:"访问控制", items:[["IP白名单",1],["IP黑名单",2]]},
    {t:"日志", items:[["平台日志",1],["中台日志",1]]},
  ]},
];
const wrap=document.getElementById("wrap");
MODULES.forEach(mod=>{
  const total=mod.cats.reduce((a,c)=>a+c.items.length,0);
  const done=mod.cats.reduce((a,c)=>a+c.items.filter(i=>i[1]===1).length,0);
  const add=mod.cats.reduce((a,c)=>a+c.items.filter(i=>i[1]===2).length,0);
  const todo=total-done-add;
  const p=document.createElement("div"); p.className="modpanel";
  let rows="";
  mod.cats.forEach((c,ci)=>{
    let tabs="";
    c.items.forEach(([n,st],ii)=>{
      const active=(ci===0&&ii===0)?" active":"";
      let cls="todo",badge='<span class="nb">新</span>';
      if(st===1){cls="done";badge="";}
      else if(st===2){cls="add";badge='<span class="nb addb">补</span>';}
      tabs+=`<div class="subtab ${cls}${active}"><span class="ico"></span><span>${n}</span>${badge}</div>`;
    });
    rows+=`<div class="catrow"><div class="catrow-label">${c.t}</div><div class="tabstrip">${tabs}</div></div>`;
  });
  p.innerHTML=`<div class="mod-h"><div class="mi">${mod.ic}</div><h3>${mod.m}</h3><span class="msub">${mod.sub}</span>${mod.isnew?'<span class="mtag">新模块</span>':''}<span class="cnt">${total} 项 · 已建 ${done} · 待迁移 ${todo}${add?` · <b style="color:#db2777">本次补 ${add}</b>`:''}</span></div><div class="catrows">${rows}</div>`;
  wrap.appendChild(p);
});
</script>
</body>
</html>
