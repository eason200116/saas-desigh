<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>集团后台 - 商户挂靠与统一配置</title>
<style>
  :root{
    --green:#13a884;--green-d:#0f8e6f;--green-l:#e8f7f2;
    --bg:#f0f2f5;--card:#fff;--text:#2c3344;--muted:#8b93a3;
    --border:#e8ebf1;--link:#2f74e6;--danger:#e0524d;--warn:#d97706;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:13px}
  /* top nav */
  .nav{background:#0960bd;height:58px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #084e98;gap:20px;position:relative;color:#fff}
  .nav .brand{display:flex;align-items:center;gap:10px}
  .nav .brand .lg{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
  .nav .clock{font-size:13px;line-height:1.25;color:#fff}.nav .clock small{color:rgba(255,255,255,.72)}
  .nav .site{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.78);font-size:11.5px;margin-top:2px}
  .nav .site .pill{background:rgba(255,255,255,.22);color:#fff;padding:1px 8px;border-radius:10px;font-weight:600}
  .nav .menus{display:flex;gap:2px;position:absolute;left:50%;transform:translateX(-50%)}
  .nav .menus a{padding:7px 13px;border-radius:8px;color:rgba(255,255,255,.92);text-decoration:none;font-size:13px;cursor:pointer;white-space:nowrap}
  .nav .menus a.active,.nav .menus a:hover{background:rgba(255,255,255,.18);color:#fff;font-weight:600}
  .nav .right{margin-left:auto;display:flex;align-items:center;gap:16px}
  .nav .kpi{text-align:center;position:relative;font-size:11px;color:rgba(255,255,255,.78);cursor:pointer}
  .nav .kpi b{display:block;color:#fff;font-size:13px}
  .nav .kpi .badge{position:absolute;top:-6px;right:-10px;background:var(--danger);color:#fff;border-radius:10px;font-size:10px;padding:0 5px;line-height:15px}
  .nav .me{display:flex;align-items:center;gap:8px}
  .nav .me .av{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.22);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
  /* mega dropdown menu */
  .megamenu{display:none;position:absolute;left:0;right:0;top:58px;background:#fff;border-bottom:1px solid var(--border);box-shadow:0 14px 34px rgba(0,0,0,.10);z-index:50;padding:18px 22px}
  .megamenu.show{display:block}
  .megamenu .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 26px}
  .megamenu .col h4{font-size:12px;color:var(--green-d);font-weight:700;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
  .megamenu .col a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:6px;color:var(--text);text-decoration:none;font-size:12.5px;cursor:pointer}
  .megamenu .col a:hover{background:var(--green-l);color:var(--green-d)}
  .megamenu .col a.active{background:var(--green-l);color:var(--green-d);font-weight:600}
  .st{font-size:10px;padding:0 6px;border-radius:8px;line-height:15px;flex-shrink:0}
  .st.done{background:var(--green-l);color:var(--green-d)}
  .st.todo{background:#fff3e0;color:var(--warn)}
  .st.plan{background:#eef1f5;color:var(--muted)}
  /* tab bar */
  .tabbar{background:#fff;display:flex;align-items:center;gap:2px;padding:0 12px;border-bottom:1px solid var(--border);overflow-x:auto}
  .tabbar .tab{padding:10px 14px;font-size:12.5px;color:var(--text);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:9px}
  .tabbar .tab.active{color:var(--green-d);border-bottom-color:var(--green);font-weight:600;background:#fafffd}
  .tabbar .tab .x{color:#b8bfcc;font-size:14px;line-height:1}
  .tabbar .tab .x:hover{color:var(--danger)}
  /* content */
  .content{overflow:auto;padding:14px}
  .pagehead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .pagehead h2{font-size:17px}.pagehead .desc{color:var(--muted);font-size:12.5px}
  .pagehead .badge2{font-size:11px}
  .card{background:#fff;border-radius:10px;border:1px solid var(--border);padding:14px 16px}
  .filters{display:grid;grid-template-columns:repeat(4,1fr);gap:11px 16px}
  .field{display:flex;align-items:center;gap:8px}
  .field label{width:70px;text-align:right;color:#5a6275;flex-shrink:0;font-size:12.5px}
  .field label .req{color:var(--danger)}
  .field .ctl{flex:1;min-width:0}
  input,select{width:100%;height:32px;border:1px solid var(--border);border-radius:6px;padding:0 9px;font-size:12.5px;background:#fff;color:var(--text);outline:none}
  input::placeholder{color:#b8bfcc}
  input:focus,select:focus{border-color:var(--green)}
  .range{display:flex;align-items:center;gap:6px}.range span{color:var(--muted)}
  .filter-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}
  .btn{height:32px;padding:0 15px;border:1px solid var(--border);background:#fff;color:var(--text);border-radius:6px;cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{border-color:var(--green);color:var(--green-d)}
  .btn.primary{background:var(--green);border-color:var(--green);color:#fff}
  .btn.primary:hover{background:var(--green-d)}
  .btn.sm{height:26px;padding:0 9px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn:disabled:hover{border-color:var(--border);color:var(--text)}
  .btn.primary:disabled{background:#aacfc4;border-color:#aacfc4;color:#fff}
  .btn.primary:disabled:hover{background:#aacfc4;color:#fff}
  .table-card{margin-top:12px;background:#fff;border-radius:10px;border:1px solid var(--border);overflow:hidden}
  .table-top{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-bottom:1px solid var(--border)}
  .table-top h3{font-size:14px}
  .table-scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th,td{padding:10px 12px;font-size:12.5px;white-space:nowrap;border-bottom:1px solid var(--border);text-align:left}
  th{background:#f7f9fb;color:#5a6275;font-weight:600}
  tbody tr:hover{background:#f6fbfa}
  td.money{font-variant-numeric:tabular-nums;font-weight:600}
  .link{color:var(--link);cursor:pointer;text-decoration:none}
  .merchant{color:var(--link);cursor:pointer}
  .badge2{display:inline-block;padding:1px 9px;border-radius:4px;font-size:12px;font-weight:600}
  .badge2.ok{background:var(--green-l);color:var(--green-d)}
  .badge2.bad{background:#fdeceb;color:var(--danger)}
  .badge2.gray{background:#eef1f5;color:#69748a}
  .badge2.warn{background:#fff3e0;color:var(--warn)}
  .ops a{margin-right:10px}
  .pager{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:13px 16px;color:#5a6275}
  .pager .pages{display:flex;gap:4px}
  .pager .pages button{min-width:30px;height:30px;border:1px solid var(--border);background:#fff;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--text)}
  .pager .pages button.active{background:var(--green);border-color:var(--green);color:#fff}
  .pager .pages button:disabled{opacity:.4;cursor:not-allowed}
  .pager select{width:auto;height:30px}.pager input{width:46px;height:30px;text-align:center}
  .empty{padding:60px;text-align:center;color:var(--muted)}
  .plan-box{padding:50px;text-align:center;color:var(--muted)}
  .plan-box .big{font-size:40px;margin-bottom:10px}
  .note{background:#fffbe9;border:1px solid #f6e4a8;color:#8a6d1c;padding:8px 12px;border-radius:8px;font-size:12px;margin-bottom:12px}
  .mask{position:fixed;inset:0;background:rgba(20,30,40,.45);display:none;align-items:flex-start;justify-content:center;z-index:60;padding-top:6vh}
  .mask.show{display:flex}
  .modal{background:#fff;border-radius:10px;width:640px;max-width:95vw;max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .modal .mh{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .modal .mh b{font-size:15px}.modal .mh .x{cursor:pointer;color:var(--muted);font-size:20px}
  .modal .mb{padding:16px 18px}
  .dl{display:grid;grid-template-columns:110px 1fr 110px 1fr;gap:11px 16px;font-size:13px}
  .dl dt{color:var(--muted);text-align:right}.dl dd{font-weight:500}
  .modal .mf{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#2c3344;color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;z-index:99;pointer-events:none}
  .toast.show{opacity:1}
  /* config editor (VIP配置) — 分组卡片布局 */
  .cfg-group{border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden}
  .cfg-group:last-child{margin-bottom:0}
  .cfg-group .cg-head{display:flex;justify-content:space-between;align-items:center;background:#fafbfc;border-bottom:1px solid var(--border);padding:11px 16px}
  .cfg-group .cg-head h4{font-size:14px;margin:0;color:#182522}
  .cfg-group .cg-head span{font-size:12px;color:var(--muted)}
  .cfg-row{display:grid;grid-template-columns:minmax(200px,1fr) 210px 200px;gap:16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
  .cfg-row:last-child{border-bottom:0}
  .cfg-name strong{display:block;color:#1f2927;font-size:13.5px;font-weight:700}
  .cfg-name strong .risk-tag{display:inline-block;background:#fff3e0;color:var(--warn);font-size:10px;font-weight:700;padding:1px 7px;border-radius:8px;margin-left:6px;vertical-align:middle}
  .cfg-name span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
  .cfg-cur{color:var(--muted);font-size:12px;text-align:right}
  .cfg-ctl .range{width:100%}
  .cfg-ctl .range input{flex:1;width:auto}
  /* group scope (集团多商户统一配置) */
  .scope-bar{display:grid;gap:10px;padding:12px 16px;background:#f0f7f4;border:1px solid #cfe6db;border-radius:10px;margin-bottom:12px}
  .scope-row2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .scope-row2>label{font-size:12.5px;color:#3a4256;font-weight:700;min-width:64px}
  .scope-row2 select{width:auto;min-width:160px}
  .msel{display:flex;flex-wrap:wrap;gap:8px;max-height:200px;overflow:auto;width:100%}
  .mchk{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer;background:#fff;white-space:nowrap;line-height:1.2}
  .mchk:hover{border-color:var(--green-d)}
  .mchk.on{border-color:var(--green);background:var(--green-l);color:var(--green-d);font-weight:600}
  .mchk input[type="checkbox"]{width:15px;height:15px;margin:0;flex:none;accent-color:var(--green);cursor:pointer}
  .scope-count{font-size:12.5px;color:var(--green-d);font-weight:700;margin-left:auto}
  .affil-tag{display:inline-block;background:#eef1f5;color:#69748a;border-radius:6px;padding:1px 8px;font-size:11px;font-weight:600}
  /* 模板使用概览（按模板分组展示商户） */
  .usage-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .usage-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px}
  .usage-card.custom{border-color:#f6e4a8;background:#fffdf5}
  .usage-card .uh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .usage-card .uh strong{font-size:14px;color:#182522}
  .usage-mlist{display:flex;flex-wrap:wrap;gap:6px}
  .usage-mlist .mtag{display:inline-flex;align-items:center;gap:5px;background:#f6f8fb;border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;color:#3a4256;cursor:pointer;white-space:nowrap}
  .usage-mlist .mtag:hover{border-color:var(--green)}
  .usage-mlist .mtag code{color:var(--muted);font-size:10px}
  @media (max-width:1024px){.usage-grid{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>

<script>
/* ---------- shared faker ---------- */
const MERCHANTS=["(1050) daman","(1040) 66bet","(1048) 91club"];
const DEVICES=["Android","iOS","PC","未知"];
const CHANNELS=["CH001","CH002","CH003","CH005"];
const VIPS=["VIP0","VIP1","VIP2","VIP3","VIP4"];
const rnd=(n)=>Math.floor(Math.random()*n);
const pick=(a)=>a[rnd(a.length)];
const money=(max)=>+(Math.random()*max).toFixed(2);
const n2=(v)=>Number(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const acc=(id)=>"member"+id;
const ip=()=> "8."+(200+rnd(55))+".x.x";
const dt=(daysBack)=>{const d=new Date(Date.now()-rnd(daysBack)*864e5-rnd(86400)*1000);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;};
const C=(t,c,html)=>({t,c:c||"",html:!!html});           // cell
const badge=(t,kind)=>C(`<span class="badge2 ${kind}">${t}</span>`,"",true);
const stCell=(ok,a,b)=>badge(ok?a:b, ok?"ok":"bad");

/* ---------- menu (from mind map) ---------- */
const MENU=[
  {g:"账号",items:[
    {k:"member-list",t:"会员列表",s:"done",d:"查询会员汇总信息和基本操作"},
    {k:"login-log",t:"登录日志",s:"todo",d:"查询会员登录情况"},
    {k:"sms-query",t:"短信验证码查询",s:"todo",d:"查询手机验证码信息"},
    {k:"kyc",t:"实名认证",s:"done",d:"查询用户实名认证信息"},
    {k:"group-mgmt",t:"分组管理",s:"todo",d:"编辑用户分组权限"},
    {k:"ip-black",t:"IP黑名单",s:"todo",d:"对指定IP所对应所有用户进行限制操作"},
    {k:"abnormal-member",t:"异常会员处理",s:"done",d:"异常账户冻结/解冻/限制操作（迁移自 SitINR）"},
  ]},
  {g:"会员层级",items:[
    {k:"level",t:"会员层级",s:"done",d:"查看和编辑会员层级"},
    {k:"recharge-level",t:"充值等级",s:"todo",d:"编辑会员层级对应充值权限"},
  ]},
  {g:"风控",items:[
    {k:"same-reg-ip",t:"注册IP",s:"todo",d:"查询同IP批量注册"},
    {k:"same-login-ip",t:"登录IP",s:"todo",d:"查询同IP批量登录（新增）"},
    {k:"fingerprint",t:"浏览器指纹",s:"todo",d:"查询同浏览器指纹注册（新增）"},
    {k:"same-device",t:"同设备",s:"plan",d:"待定"},
    {k:"brush-channel",t:"刷通道用户清单",s:"todo",d:"查询充值通道刷单情况，或指定会员刷单情况"},
  ]},
  {g:"活动",items:[
    {k:"partner-reward",t:"合伙人奖励",s:"todo",d:"查询分享合伙人下属信息及所贡献奖励"},
    {k:"act-black",t:"会员活动黑名单",s:"todo",d:"操作限制会员参与指定活动"},
    {k:"recharge-reward",t:"充值奖励发放记录",s:"todo",d:"查询用户充值返利活动领取情况"},
  ]},
  {g:"资金",items:[
    {k:"bankcard",t:"银行卡查询",s:"done",d:"查询银行卡绑定信息"},
    {k:"withdraw-limit",t:"会员提现限制名单",s:"todo",d:"修改会员每日和总提现上限"},
    {k:"abnormal-fund",t:"异常资金处理",s:"todo",d:"操作回收会员金币和驳回提现"},
  ]},
  {g:"代理",items:[
    {k:"sub-members",t:"下级会员列表",s:"todo",d:"查询代理旗下会员"},
    {k:"rebate-level",t:"会员返佣等级",s:"todo",d:"修改会员层级，查看会员等级"},
    {k:"rebate-yesterday",t:"昨日返佣等级",s:"todo",d:"查询代理汇总信息"},
    {k:"agent-audit",t:"代理审核机制",s:"todo",d:"查询代理层级汇总信息"},
  ]},
  {g:"vip",items:[
    {k:"vip-level",t:"VIP等级",s:"done",d:"查看和编辑 VIP 等级体系（迁移自 SitINR）"},
    {k:"vip-count",t:"VIP人数",s:"done",d:"各 VIP 等级会员人数统计（迁移自 SitINR）"},
    {k:"vip-exp",t:"经验值配置",s:"done",d:"VIP 经验值与升级规则配置（迁移自 SitINR）"},
    {k:"vip-log",t:"VIP操作日志",s:"done",d:"VIP 等级变更操作日志（迁移自 SitINR）"},
    {k:"vip-reward",t:"VIP升级奖励记录",s:"todo",d:"查询会员VIP升级奖励派彩记录"},
  ]},
  {g:"洗码",items:[
    {k:"wash-record",t:"洗码记录",s:"done",d:"查询会员打码/洗码量记录（迁移自 SitINR）"},
    {k:"wash-rule",t:"洗码规则说明",s:"done",d:"洗码量计算规则（迁移自 SitINR）"},
  ]},
];

/* ---------- per-page specs: filters + columns + row generator ---------- */
const merchantFilter={label:"商户",req:true,type:"select",opts:MERCHANTS};
const kwFilter=(label,ph)=>({label,type:"text",ph});
const PAGES={

    cfg(id){ if(!G_CFG[this.type])G_CFG[this.type]={}; if(!G_CFG[this.type][id]){ const i=GMERCHANTS.findIndex(m=>m.id===id); G_CFG[this.type][id]={...this.templates[(i+this.type.length)%this.templates.length].values}; } return G_CFG[this.type][id]; },
    init(){ if(this.state) return; this.state={market:G_MARKETS[0].id, selected:new Set(), mode:"overview"}; },
    marketMerchants(){return GMERCHANTS.filter(m=>m.marketId===this.state.market);},
    marketCur(){return (G_MARKETS.find(m=>m.id===this.state.market)||{}).currency;},
    countryOf(mid){return (G_MARKETS.find(m=>m.id===mid)||{}).country||"";},
    tplLabel(t,mid){return t.name;},
    curOf(id){const m=GMERCHANTS.find(x=>x.id===id);return (G_MARKETS.find(k=>k.id===m.marketId)||{}).currency;},
    eq(a,b){return this.fields.every(f=>String(a[f.key])===String(b[f.key]));},
    tplById(id){return this.templates.find(t=>t.id===id);},
    templatesForMarket(mid){return this.templates.filter(t=>!t.marketId||t.marketId===mid);},
    matchTpl(vals,mid){const t=this.templatesForMarket(mid||this.state.market).find(t=>this.eq(t.values,vals));return t?t.id:"__custom__";},
    fmtV(f,v,cur){if(f.type==="number"){const n=Number(v).toLocaleString();return f.cur?n+" "+cur:n+(f.unit||"");}return v;},
    control(f,v,setter,cur){
      if(f.type==="select") return `<select onchange="${setter}('${f.key}',this.value)">${f.opts.map(o=>`<option ${o===v?"selected":""}>${o}</option>`).join("")}</select>`;
      return `<div class="range"><input type="number" value="${v}" onchange="${setter}('${f.key}',this.value)"><span>${f.cur?cur:(f.unit||"")}</span></div>`;
    },
    formHTML(working,setter,cur,curFn){
      return this.groups.map(g=>`<div class="cfg-group"><div class="cg-head"><h4>${g.group}</h4><span>${g.note}</span></div>
        ${g.items.map(f=>`<div class="cfg-row">
          <div class="cfg-name"><strong>${f.name}${f.risk?'<span class="risk-tag">高风险</span>':''}</strong><span>${f.desc}</span></div>
          <div class="cfg-ctl">${this.control(f,working[f.key],setter,cur)}</div>
          <div class="cfg-cur">${curFn(f)}</div></div>`).join("")}
      </div>`).join("");
    },
    render(){
      this.init();
      if(PERSP.mode==="merchant") return this.renderMerchant();
      if(this.state.mode==="batch") return this.renderBatch();
      if(this.state.mode==="preview") return this.renderPreview();
      return this.renderOverview();
    },
    /* ===== 集团视角 · 使用概览（按模板分组；每模板可预览 + 指定商户挂靠） ===== */
    renderOverview(){
      const n=this.name, s=this.state, mhs=this.marketMerchants();
      const mchip=(m)=>`<span class="mtag" title="点击进入该商户定制配置" onclick="${n}.openMerchant('${m.id}')">${m.name} <code>${m.code}</code></span>`;
      const cards=this.templatesForMarket(s.market).map(t=>{const ms=mhs.filter(m=>this.matchTpl(this.cfg(m.id))===t.id);
        return `<div class="usage-card"><div class="uh"><strong>${this.tplLabel(t)}</strong><span style="display:flex;align-items:center;gap:6px"><span class="badge2 ok">${ms.length} 个商户使用</span><button class="btn sm" onclick="${n}.openTplEditor('${t.id}')">编辑</button><button class="btn sm primary" onclick="${n}.openTplModal('${t.id}')">查看 / 指定商户</button></span></div><div class="usage-mlist">${ms.length?ms.map(mchip).join(""):'<span class="desc">暂无商户使用</span>'}</div></div>`;}).join("");
      const customMs=mhs.filter(m=>this.matchTpl(this.cfg(m.id))==="__custom__");
      const customCard=`<div class="usage-card custom"><div class="uh"><strong>自定义配置（未套用模板）</strong><span class="badge2 warn">${customMs.length} 个商户</span></div><div class="usage-mlist">${customMs.length?customMs.map(mchip).join(""):'<span class="desc">暂无</span>'}</div></div>`;
      document.getElementById("content").innerHTML=`
        <div class="pagehead"><h2>${this.title}</h2><span class="badge2 ok">集团视角 · 使用概览</span><span class="desc">集团级模板，所有市场共用；点「编辑」改模板、「查看/指定商户」预览并挂靠套用、点商户名进入该商户定制配置；右上「新增集团模板」可新增</span></div>
        <div class="card"><div class="scope-row2" style="justify-content:space-between"><div style="display:flex;align-items:center;gap:10px"><label>市场</label>
          <select onchange="${n}.setMarket(this.value)">${G_MARKETS.map(mk=>`<option value="${mk.id}" ${mk.id===s.market?"selected":""}>${mk.country}（${GMERCHANTS.filter(x=>x.marketId===mk.id).length}）</option>`).join("")}</select></div><button class="btn sm primary" onclick="${n}.openTplEditor()">＋ 新增集团模板</button></div></div>
        <div class="usage-grid">${cards}${customCard}</div>`;
    },
    toggle(id){const s=this.state;if(s.selected.has(id))s.selected.delete(id);else s.selected.add(id);if(this.bEdit)this.bEdit.published=false;this.render();},
    selAllMarket(){this.marketMerchants().forEach(m=>this.state.selected.add(m.id));if(this.bEdit)this.bEdit.published=false;this.render();},
    selNone(){this.state.selected=new Set();if(this.bEdit)this.bEdit.published=false;this.render();},
    setMarket(id){this.state.market=id;this.state.selected=new Set();this.state.mode="overview";this.render();},
    /* 集团模板：新增 / 编辑（弹窗展示） */
    teClone(o){return {name:o.name,values:{...o.values}};},
    teEq(a,b){return a.name===b.name && this.fields.every(f=>String(a.values[f.key])===String(b.values[f.key]));},
    tplUsing(tid){return GMERCHANTS.filter(m=>this.matchTpl(this.cfg(m.id),m.marketId)===tid).length;},
    openTplEditor(tid){
      if(tid){const t=this.tplById(tid);const o={name:t.name,values:{...t.values}};this.tplEdit={id:tid,market:this.state.market,w:this.teClone(o),s:this.teClone(o),p:this.teClone(o)};}
      else{const o={name:"",values:{...this.templates[0].values}};this.tplEdit={id:null,market:this.state.market,w:this.teClone(o),s:this.teClone(o),p:this.teClone(o)};}
      this.renderTplEditor();document.getElementById("g-modal").classList.add("show");
    },
    renderTplEditor(){
      const n=this.name,e=this.tplEdit,isNew=!e.id,savedUnpub=!this.teEq(e.s,e.p),using=isNew?0:this.tplUsing(e.id);
      document.getElementById("gmTitle").textContent=isNew?"新增集团模板":"编辑集团模板";
      const baseRow2=isNew
        ? `<div class="cfg-row" style="grid-template-columns:minmax(160px,1fr) 1fr"><div class="cfg-name"><strong>市场</strong><span>新增成功后跳转至该市场板块</span></div><div class="cfg-ctl"><select onchange="${n}.teMarket(this.value)">${G_MARKETS.map(mk=>`<option value="${mk.id}" ${mk.id===e.market?"selected":""}>${mk.country}</option>`).join("")}</select></div></div>`
        : `<div class="cfg-row" style="grid-template-columns:minmax(160px,1fr) 1fr"><div class="cfg-name"><strong>使用情况</strong><span>有商户在用时不可删除</span></div><div class="cfg-ctl"><span class="badge2 ${using?'ok':'gray'}">${using} 个商户在用</span></div></div>`;
      document.getElementById("gmBody").innerHTML=`
        <div class="cfg-group" style="margin:0 0 14px"><div class="cg-head"><h4>模板基础</h4><span>集团级模板 · 所有市场共用</span></div>
          <div class="cfg-row" style="grid-template-columns:minmax(160px,1fr) 1fr"><div class="cfg-name"><strong>模板名称</strong><span>例如：标准模板、高价值模板</span></div><div class="cfg-ctl"><input type="text" value="${e.w.name}" onchange="${n}.teName(this.value)" placeholder="输入模板名称"></div></div>
          ${baseRow2}
        </div>
        ${this.groups.map(g=>`<div class="cfg-group" style="margin:0 0 14px"><div class="cg-head"><h4>${g.group}</h4><span>${g.note}</span></div>
          ${g.items.map(f=>`<div class="cfg-row" style="grid-template-columns:minmax(160px,1fr) 220px"><div class="cfg-name"><strong>${f.name}${f.risk?'<span class="risk-tag">高风险</span>':''}</strong><span>${f.desc}</span></div><div class="cfg-ctl">${this.control(f,e.w.values[f.key],n+".teVal","")}</div></div>`).join("")}
        </div>`).join("")}`;
      const delBtn=isNew?"":`<button class="btn" ${using?'disabled':'style="border-color:#e0524d;color:#e0524d"'} onclick="${n}.teDelete()">🗑 删除模板${using?'（'+using+' 在用）':''}</button>`;
      document.getElementById("gmFoot").innerHTML=`<button class="btn" onclick="UI.gmClose()">取消</button>${delBtn}<span style="flex:1"></span><button class="btn primary" onclick="${n}.teSave()">💾 保存</button><button class="btn primary" ${savedUnpub?'':'disabled'} onclick="${n}.tePublish()">🚀 发布</button>`;
    },
    teName(v){this.tplEdit.w.name=v;},
    teMarket(v){this.tplEdit.market=v;},
    teVal(k,v){const f=this.fields.find(x=>x.key===k);this.tplEdit.w.values[k]=f.type==="number"?Number(v):v;},
    teSave(){const e=this.tplEdit;if(!(e.w.name||"").trim()){UI.toast("请填写模板名称");return;}e.s=this.teClone(e.w);this.renderTplEditor();UI.toast(this.teEq(e.s,e.p)?"已保存（无改动）":"已保存草稿，可发布");},
    tePublish(){
      const e=this.tplEdit;if(this.teEq(e.s,e.p)){UI.toast("请先保存后再发布");return;}
      if(e.id){const using=GMERCHANTS.filter(m=>this.matchTpl(this.cfg(m.id))===e.id);const t=this.tplById(e.id);t.name=e.s.name;t.values={...e.s.values};using.forEach(m=>{G_CFG[this.type][m.id]={...e.s.values};});e.p=this.teClone(e.s);UI.gmClose();this.render();UI.toast("已发布：模板「"+e.s.name+"」更新，"+using.length+" 个在用商户已同步");}
      else{const id="GT"+Math.floor(Math.random()*1e6);this.templates.push({id,name:e.s.name,values:{...e.s.values},marketId:e.market});e.p=this.teClone(e.s);this.state.market=e.market;this.state.selected=new Set();this.state.mode="overview";UI.gmClose();this.render();UI.toast("已新增集团模板「"+e.s.name+"」，已跳转至"+((G_MARKETS.find(m=>m.id===e.market)||{}).country||"")+"市场");}
    },
    teDelete(){const e=this.tplEdit;if(!e.id)return;const using=this.tplUsing(e.id);if(using){UI.toast("该模板有 "+using+" 个商户在用，不能删除");return;}this.templates=this.templates.filter(t=>t.id!==e.id);UI.gmClose();this.render();UI.toast("已删除模板");},
    /* 合并弹窗：模板预览 + 勾选指定商户挂靠 */
    openTplModal(tid){const t=this.tplById(tid)||this.templates[0];this.modal={tid:t.id,sel:new Set(this.marketMerchants().filter(m=>this.matchTpl(this.cfg(m.id))===t.id).map(m=>m.id)),savedSel:null,view:"select"};this.renderModal();document.getElementById("g-modal").classList.add("show");},
    sameSet(a,b){if(!b||a.size!==b.size)return false;for(const x of a)if(!b.has(x))return false;return true;},
    modalAffected(){const t=this.tplById(this.modal.tid),base=this.modal.savedSel||this.modal.sel;return [...base].filter(id=>this.matchTpl(this.cfg(id))!==t.id).map(id=>{const cur=this.matchTpl(this.cfg(id)),m=GMERCHANTS.find(x=>x.id===id);return {id,name:m.name,code:m.code,from:cur==="__custom__"?"自定义配置":this.tplLabel(this.tplById(cur)),to:this.tplLabel(t)};});},
    renderModal(){ if(this.modal.view==="confirm") return this.renderModalConfirm(); this.renderModalSelect(); },
    renderModalSelect(){
      const n=this.name,t=this.tplById(this.modal.tid),cur=this.marketCur(),mhs=this.marketMerchants(),sel=this.modal.sel;
      const unsaved=!this.sameSet(sel,this.modal.savedSel), affected=this.modalAffected().length;
      const hint=unsaved?'● 选择有改动，请先保存':(this.modal.savedSel?(affected?('● 已保存，待发布（'+affected+' 个商户将变更）'):'已保存 · 所选商户均已使用该模板'):'勾选商户后点保存');
      document.getElementById("gmTitle").textContent="模板："+this.tplLabel(t);
      document.getElementById("gmBody").innerHTML=`
        <div class="cfg-group" style="margin:0 0 14px"><div class="cg-head"><h4>模板内容预览</h4><span>只读 · 币种 ${cur}</span></div>
          <table style="width:100%;border-collapse:collapse">${this.groups.map(g=>g.items.map(f=>`<tr><td style="padding:8px 12px;border-bottom:1px solid var(--border);color:#5a6275;width:170px">${f.name}${f.risk?' <span class="badge2 warn" style="font-size:10px">高风险</span>':''}</td><td style="padding:8px 12px;border-bottom:1px solid var(--border);font-weight:600">${this.fmtV(f,t.values[f.key],cur)}</td></tr>`).join("")).join("")}</table>
        </div>
        <div class="cfg-group" style="margin:0"><div class="cg-head"><h4>指定商户挂靠</h4><span>勾选商户套用此模板（已选 ${sel.size} / ${mhs.length}）</span></div>
          <div style="padding:10px 12px;display:flex;gap:8px;align-items:center"><button class="btn sm" onclick="${n}.modalAll()">全选本市场</button><button class="btn sm" onclick="${n}.modalNone()">清空</button><span class="desc" style="margin-left:auto">${hint}</span></div>
          <div class="msel" style="padding:0 12px 12px">${mhs.map(m=>`<label class="mchk ${sel.has(m.id)?"on":""}"><input type="checkbox" ${sel.has(m.id)?"checked":""} onchange="${n}.modalToggle('${m.id}')">${m.name} <code style="color:var(--muted);font-size:11px">${m.code}</code></label>`).join("")}</div>
        </div>`;
      document.getElementById("gmFoot").innerHTML=`<button class="btn" onclick="UI.gmClose()">取消</button><button class="btn ${unsaved?'primary':''}" ${unsaved?'':'disabled'} onclick="${n}.tplSave()">💾 保存</button><button class="btn primary" ${(!unsaved&&this.modal.savedSel&&affected)?'':'disabled'} onclick="${n}.tplPublish()">🚀 发布</button>`;
    },
    modalToggle(id){const x=this.modal.sel;if(x.has(id))x.delete(id);else x.add(id);this.renderModal();},
    modalAll(){this.modal.sel=new Set(this.marketMerchants().map(m=>m.id));this.renderModal();},
    modalNone(){this.modal.sel=new Set();this.renderModal();},
    tplSave(){this.modal.savedSel=new Set(this.modal.sel);this.renderModal();UI.toast("已保存所选商户，可发布");},
    tplPublish(){if(this.modal.savedSel===null||!this.sameSet(this.modal.sel,this.modal.savedSel)){UI.toast("请先保存后再发布");return;}if(!this.modalAffected().length){UI.toast("所选商户均已使用该模板，无需发布");return;}this.modal.view="confirm";this.renderModal();},
    renderModalConfirm(){
      const n=this.name,t=this.tplById(this.modal.tid),aff=this.modalAffected();
      document.getElementById("gmTitle").textContent="确认发布：套用「"+this.tplLabel(t)+"」";
      document.getElementById("gmBody").innerHTML=`
        <div class="note" style="margin:0 0 12px">⚠ 以下 <b>${aff.length}</b> 个商户的 ${this.title} 将由原模板调整为「<b>${this.tplLabel(t)}</b>」，请确认是否操作：</div>
        <div class="table-card" style="box-shadow:none"><div class="table-scroll"><table><thead><tr><th>商户</th><th>站点号</th><th>原模板</th><th></th><th>现模板</th></tr></thead><tbody>
          ${aff.map(a=>`<tr><td><strong>${a.name}</strong></td><td>${a.code}</td><td><span class="badge2 gray">${a.from}</span></td><td style="color:var(--muted)">→</td><td><span class="badge2 ok">${a.to}</span></td></tr>`).join("")}
        </tbody></table></div></div>`;
      document.getElementById("gmFoot").innerHTML=`<button class="btn" onclick="${n}.tplBack()">← 返回修改</button><button class="btn primary" onclick="${n}.tplConfirm()">✅ 确认操作</button>`;
    },
    tplBack(){this.modal.view="select";this.renderModal();},
    tplConfirm(){const t=this.tplById(this.modal.tid),aff=this.modalAffected();if(!G_CFG[this.type])G_CFG[this.type]={};aff.forEach(a=>{G_CFG[this.type][a.id]={...t.values};});UI.gmClose();this.render();UI.toast("已发布："+aff.length+" 个商户套用「"+this.tplLabel(t)+"」");},
    backToGroup(){PERSP.mode="group";PERSP.merchantId=null;if(window.UI&&UI.syncPersp)UI.syncPersp();this.render();},
    /* ===== 模板预览（只读） ===== */
    previewTpl(tid){this.pTid=tid;this.state.mode="preview";this.render();},
    exitPreview(){this.state.mode="overview";this.render();},
    renderPreview(){
      const n=this.name, t=this.tplById(this.pTid)||this.templates[0], cur=this.marketCur();
      document.getElementById("content").innerHTML=`
        <div class="pagehead"><h2>${this.title}</h2><span class="badge2 ok">模板预览</span><span class="desc">${t.name}（只读）</span></div>
        <div class="table-card">
          <div class="table-top"><h3><a class="link" onclick="${n}.exitPreview()">← 返回使用概览</a>　|　模板预览：${t.name}</h3>
            <button class="btn sm primary" onclick="${n}.enterBatch('${t.id}')">📥 指定商户套用此模板</button></div>
          <div class="table-scroll"><table><thead><tr><th>分组</th><th>配置项</th><th>说明</th><th>模板值</th></tr></thead><tbody>
            ${this.groups.map(g=>g.items.map(f=>`<tr><td>${g.group}</td><td><strong>${f.name}</strong>${f.risk?' <span class="badge2 warn" style="font-size:10px">高风险</span>':''}</td><td style="color:var(--muted)">${f.desc}</td><td><strong>${this.fmtV(f,t.values[f.key],cur)}</strong></td></tr>`).join("")).join("")}
          </tbody></table></div>
        </div>`;
    },
    /* ===== 指定商户挂靠 + 统一配置（按模板进入，可多选商户） ===== */
    enterBatch(tid){ const t=this.tplById(tid)||this.templates[0]; this.bTid=t.id; this.state.selected=new Set(this.marketMerchants().filter(m=>this.matchTpl(this.cfg(m.id))===t.id).map(m=>m.id)); this.bEdit={working:{...t.values},saved:{...t.values},tplSel:t.id,published:false}; this.state.mode="batch"; this.render(); },
    exitBatch(){this.state.mode="overview";this.bEdit=null;this.render();},
    batchStatus(f){const ids=[...this.state.selected];if(!ids.length)return "—";const vals=[...new Set(ids.map(id=>String(this.cfg(id)[f.key])))];if(vals.length===1)return this.fmtV(f,this.cfg(ids[0])[f.key],this.marketCur());return `差异（${vals.length} 种取值）`;},
    renderBatch(){
      const n=this.name, e=this.bEdit, cur=this.marketCur(), ids=[...this.state.selected], mhs=this.marketMerchants();
      const unsaved=!this.eq(e.working,e.saved), canPublish=!unsaved && !e.published && ids.length>0;
      const stateText=unsaved?'● 有未保存修改，请先保存':(e.published?'✓ 已发布，无待办':(ids.length?'● 已保存，待发布到所选商户':'请先勾选商户'));

      document.getElementById("content").innerHTML=`
        <div class="pagehead"><h2>${this.title}</h2><span class="badge2 ok">集团视角 · 指定商户挂靠</span><span class="desc">${tplName?("模板："+tplName+" · "):""}勾选商户后统一套用 / 自定义，保存发布</span></div>
        <div class="card"><div class="scope-bar">
          <div class="scope-row2"><label>挂靠商户</label>
            <button class="btn sm" onclick="${n}.selAllMarket()">全选本市场</button>
            <button class="btn sm" onclick="${n}.selNone()">清空</button>
            <span class="scope-count">已选 ${ids.length} / ${mhs.length} 个商户</span></div>
          <div class="msel">${mhs.map(m=>`<label class="mchk ${this.state.selected.has(m.id)?"on":""}"><input type="checkbox" ${this.state.selected.has(m.id)?"checked":""} onchange="${n}.toggle('${m.id}')">${m.name} <code style="color:var(--muted);font-size:11px">${m.code}</code></label>`).join("")}</div>
        </div></div>
        <div class="table-card">
          <div class="table-top"><h3><a class="link" onclick="${n}.exitBatch()">← 返回使用概览</a>　|　${this.panelTitle}</h3>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="desc">套用模板</span>
              <select onchange="${n}.bPickTpl(this.value)" style="width:auto;min-width:150px">${this.templatesForMarket(this.state.market).map(t=>`<option value="${t.id}" ${t.id===e.tplSel?"selected":""}>${this.tplLabel(t)}</option>`).join("")}<option value="__custom__" ${e.tplSel==="__custom__"?"selected":""}>自定义模板</option></select>
              <button class="btn sm primary" onclick="${n}.bApplyTpl()">📥 套用</button></div>
          </div>
          <div style="padding:12px 16px">${this.formHTML(e.working,`${n}.bSetVal`,cur,(f)=>`所选商户现状：<b>${this.batchStatus(f)}</b>`)}</div>
          <div class="filter-actions" style="padding:13px 16px">
            <span class="desc" style="margin-right:auto">${stateText}　·　发布将统一写入所选 ${ids.length} 个商户</span>
            <button class="btn ${unsaved?"primary":""}" ${unsaved?"":"disabled"} onclick="${n}.bSave()">💾 保存</button>
            <button class="btn primary" ${canPublish?"":"disabled"} onclick="${n}.bPublish()">🚀 发布到所选商户</button>
          </div>
        </div>`;

        </div>

    if(f.type==="select") return `<select onchange="${n}.setVal('${f.key}',this.value)">${f.opts.map(o=>`<option ${o===v?"selected":""}>${o}</option>`).join("")}</select>`;
    return `<div class="range"><input type="number" value="${v}" onchange="${n}.setVal('${f.key}',this.value)"><span>${f.cur?this.marketCur():(f.unit||"")}</span></div>`;
  },
  setMarket(id){this.state.market=id;this.state.selected=new Set(this.marketMerchants().map(m=>m.id));if(this.edit)this.edit.published=true;this.render();},
  selAll(){this.state.selected=new Set(this.marketMerchants().map(m=>m.id));if(this.edit)this.edit.published=false;this.render();},
  selNone(){this.state.selected=new Set();if(this.edit)this.edit.published=false;this.render();},
  toggle(id){const s=this.state;if(s.selected.has(id))s.selected.delete(id);else s.selected.add(id);if(this.edit)this.edit.published=false;this.render();},
  open(id){const base=this.templates[0];this.state.editing=id;this.edit={tplSel:base.id,working:{...base.values},saved:{...base.values},published:true};this.render();},
  back(){this.state.editing=null;this.edit=null;this.render();},
  pickTpl(id){this.edit.tplSel=id;this.render();},
  applyTpl(){if(this.edit.tplSel==="__custom__"){UI.toast("请先选择一个市场模板再套用");return;}const t=this.tplById(this.edit.tplSel);this.edit.working={...t.values};this.render();UI.toast("已套用 "+t.name+"，可再修改后保存");},
  setVal(k,v){const f=this.fields.find(x=>x.key===k);this.edit.working[k]=f.type==="number"?Number(v):v;this.edit.tplSel=this.matchTpl(this.edit.working);this.render();},
  revert(){this.edit.working={...this.edit.saved};this.edit.tplSel=this.matchTpl(this.edit.saved);this.render();UI.toast("已还原到最近保存");},
  save(){if(this.eq(this.edit.working,this.edit.saved)){UI.toast("没有需要保存的修改");return;}this.edit.saved={...this.edit.working};this.edit.published=false;this.render();UI.toast("已保存草稿，可发布到所选商户");},

    const aid=this.state.editing; this.selectedList().forEach(id=>{this.actCfg(id,aid);G_ACT[id][aid]={...this.edit.saved};});
    this.edit.published=true;this.render();UI.toast("活动「"+this.actById(aid).name+"」已发布到 "+this.state.selected.size+" 个商户"); }
};

/* ===== 系统管理 · 商户市场挂靠（集团最高权限：调整商户归属市场） ===== */
const MarketAffil={
  pending:{}, saved:{},
  curMarket(m){return this.pending[m.id]!==undefined?this.pending[m.id]:m.marketId;},
  sameMap(a,b){const ka=Object.keys(a),kb=Object.keys(b);return ka.length===kb.length&&ka.every(k=>a[k]===b[k]);},
  rowStatus(m){const eff=this.curMarket(m);if(eff===m.marketId)return ["已挂靠","gray"];if(this.saved[m.id]===eff)return ["待发布","warn"];return ["待保存","bad"];},
  pendingCount(){return GMERCHANTS.filter(m=>this.curMarket(m)!==m.marketId).length;},
  render(){
    const unsaved=!this.sameMap(this.pending,this.saved);
    const savedPending=Object.keys(this.saved).some(id=>{const m=GMERCHANTS.find(x=>x.id===id);return m && this.saved[id]!==m.marketId;});
    const canPublish=savedPending && !unsaved;
    const n=this.pendingCount();
    const stateText=unsaved?`● ${n} 个挂靠改动未保存，请先保存`:savedPending?`● ${n} 个挂靠待发布`:'✓ 无待办';
    document.getElementById("content").innerHTML=`
      <div class="pagehead"><h2>商户市场挂靠</h2><span class="badge2 ok">系统管理</span><span class="desc">为商户指定归属市场；改动需保存后发布</span></div>
      <div class="note">⚙ 集团权限：调整商户的归属市场，挂靠决定该商户可用的市场模板。<strong>改动先进草稿，必须保存后才能发布。</strong>本页仅做挂靠，不含其它配置。</div>
      <div class="table-card">
        <div class="table-top"><h3>商户挂靠（${GMERCHANTS.length}）</h3><span class="desc">修改下拉即调整归属市场</span></div>
        <div class="table-scroll"><table><thead><tr><th>商户</th><th>站点号</th><th>归属市场</th><th>币种</th><th>状态</th></tr></thead><tbody>
          ${GMERCHANTS.map(m=>{const eff=this.curMarket(m);const mk=G_MARKETS.find(x=>x.id===eff);const rs=this.rowStatus(m);return `<tr>
            <td><strong>${m.name}</strong></td><td>${m.code}</td>
            <td><select onchange="MarketAffil.change('${m.id}',this.value)">${G_MARKETS.map(k=>`<option value="${k.id}" ${k.id===eff?"selected":""}>${k.country}</option>`).join("")}</select></td>
            <td><span class="affil-tag">${mk.currency}</span></td>
            <td><span class="badge2 ${rs[1]}">${rs[0]}</span></td>
          </tr>`;}).join("")}
        </tbody></table></div>
        <div class="filter-actions" style="padding:13px 16px">
          <span class="desc" style="margin-right:auto">${stateText}</span>
          <button class="btn" onclick="MarketAffil.discard()">↻ 放弃改动</button>
          <button class="btn ${unsaved?"primary":""}" ${unsaved?"":"disabled"} onclick="MarketAffil.save()">💾 保存</button>
          <button class="btn primary" ${canPublish?"":"disabled"} onclick="MarketAffil.publish()">🚀 发布</button>
        </div>
      </div>`;
  },
  change(id,marketId){const m=GMERCHANTS.find(x=>x.id===id);if(marketId===m.marketId)delete this.pending[id];else this.pending[id]=marketId;this.render();},
  discard(){this.pending={};this.saved={};this.render();UI.toast("已放弃挂靠改动");},
  save(){if(this.sameMap(this.pending,this.saved)){UI.toast("没有需要保存的改动");return;}this.saved={...this.pending};this.render();UI.toast("已保存挂靠草稿，可发布");},
  publish(){
    if(!this.sameMap(this.pending,this.saved)){UI.toast("请先保存改动后再发布");return;}
    const ids=Object.keys(this.saved).filter(id=>{const m=GMERCHANTS.find(x=>x.id===id);return m&&this.saved[id]!==m.marketId;});
    if(!ids.length){UI.toast("没有待发布的挂靠改动");return;}
    ids.forEach(id=>{GMERCHANTS.find(x=>x.id===id).marketId=this.saved[id];});
    this.pending={};this.saved={};this.render();UI.toast("已发布 "+ids.length+" 个商户的市场挂靠");
  }
};

/* ---------- generic page renderer ---------- */
const Generic={
  cache:{},page:1,size:10,key:null,
  render(key){
    const spec=PAGES[key],meta=UI.metaOf(key);
    this.key=key;this.page=1;
    const c=document.getElementById("content");
    if(spec.plan){
      c.innerHTML=`<div class="pagehead"><h2>${meta.t}</h2><span class="badge2 gray">规划中</span><span class="desc">${meta.d}</span></div>
        <div class="card"><div class="plan-box"><div class="big">🚧</div>该功能在脑图中标记为「待定」，需求待确认后排期。</div></div>`;
      return;
    }
    if(!this.cache[key]){const rows=[],n=spec.rows||(40+rnd(120));for(let i=0;i<n;i++)rows.push(spec.gen(i));this.cache[key]=rows;}
    const stMap={done:["已完成","ok"],todo:["待迁移","warn"],plan:["规划中","gray"]};
    const st=stMap[meta.s];
    c.innerHTML=`
      <div class="pagehead"><h2>${meta.t}</h2><span class="badge2 ${st[1]}">${st[0]}</span><span class="desc">${meta.d}</span></div>
      ${spec.note?`<div class="note">⚠ ${spec.note}</div>`:""}
      <div class="card">${UI.filtersHTML(spec.filters)}
        <div class="filter-actions"><button class="btn primary" onclick="Generic.search()">🔍 搜索</button>
          <button class="btn" onclick="Generic.reset()">↻ 重置</button></div></div>
      <div class="table-card">
        <div class="table-top"><h3>${meta.t}</h3><button class="btn sm" onclick="Generic.exportCsv()">导出</button></div>
        <div class="table-scroll"><table><thead><tr>${spec.cols.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
          <tbody id="gtbody"></tbody></table></div>
        <div class="pager" id="gpager"></div></div>`;
    this.view=this.cache[key];this.renderTable();
  },
  search(){
    const spec=PAGES[this.key];
    const m=document.getElementById("flt-0")?document.getElementById("flt-0").value.trim():"";
    let kw="";spec.filters.forEach((f,i)=>{if(f.type==="text"&&!kw){const el=document.getElementById("flt-"+i);if(el&&el.value.trim())kw=el.value.trim().toLowerCase();}});
    this.view=this.cache[this.key].filter(r=>{
      const text=r.map(c=>String(c.t).replace(/<[^>]+>/g,"")).join(" ").toLowerCase();
      if(m && !text.includes(m.toLowerCase())) return false;
      if(kw && !text.includes(kw)) return false;
      return true;});
    this.page=1;this.renderTable();UI.toast("查询到 "+this.view.length+" 条");
  },
  reset(){const spec=PAGES[this.key];spec.filters.forEach((f,i)=>{const el=document.getElementById("flt-"+i);if(el)el.value="";});this.view=this.cache[this.key];this.page=1;this.renderTable();},
  renderTable(){
    const tot=this.view.length,pages=Math.max(1,Math.ceil(tot/this.size));
    if(this.page>pages)this.page=pages;
    const rows=this.view.slice((this.page-1)*this.size,this.page*this.size);
    document.getElementById("gtbody").innerHTML= rows.length? rows.map(r=>"<tr>"+r.map(c=>`<td class="${c.c}">${c.t}</td>`).join("")+"</tr>").join("")
      : `<tr><td colspan="${PAGES[this.key].cols.length}" class="empty">暂无数据</td></tr>`;
    UI.pager("gpager",tot,this.page,pages,(p)=>{Generic.page=p;Generic.renderTable();},this.size,(s)=>{Generic.size=s;Generic.page=1;Generic.renderTable();});
  },
  exportCsv(){const spec=PAGES[this.key];const rows=this.view.map(r=>r.map(c=>String(c.t).replace(/<[^>]+>/g,"").trim()));UI.downloadCsv(this.key+".csv",spec.cols,rows);}
};

/* ---------- UI helpers / router ---------- */
const UI={
  current:"member-list",
  metaOf(key){for(const mk in MODULES)for(const g of MODULES[mk].menu)for(const it of g.items)if(it.k===key)return it;},
  moduleOf(key){for(const mk in MODULES)for(const g of MODULES[mk].menu)for(const it of g.items)if(it.k===key)return mk;return "member";},
  filtersHTML(filters){
    return `<div class="filters">`+filters.map((f,i)=>{
      let ctl;
      if(f.type==="select") ctl=`<select id="flt-${i}"><option value="">请选择${f.label}</option>${f.opts.map(o=>`<option>${o}</option>`).join("")}</select>`;
      else if(f.type==="daterange") ctl=`<div class="range"><input type="date"><span>→</span><input type="date"></div>`;
      else ctl=`<input id="flt-${i}" placeholder="${f.ph||f.label}">`;
      return `<div class="field"${f.type==="daterange"?' style="grid-column:span 2"':''}><label>${f.req?'<span class="req">*</span>':''}${f.label}</label><div class="ctl">${ctl}</div></div>`;
    }).join("")+`</div>`;
  },
  pager(elId,tot,page,pages,go,size,setSize){
    let h=`<span>共 ${tot} 条</span><div class="pages"><button onclick="(${go})(${page-1})" ${page<=1?'disabled':''}>‹</button>`;
    const win=[];for(let p=1;p<=pages;p++){if(p===1||p===pages||Math.abs(p-page)<=2)win.push(p);else if(win[win.length-1]!=="…")win.push("…");}
    win.forEach(p=>h+= p==="…"?`<button disabled>…</button>`:`<button class="${p===page?'active':''}" onclick="(${go})(${p})">${p}</button>`);
    h+=`<button onclick="(${go})(${page+1})" ${page>=pages?'disabled':''}>›</button></div>
      <select onchange="(${setSize})(+this.value)">${[10,20,50].map(s=>`<option ${s===size?'selected':''}>${s}</option>`).join("")}</select>
      <span>条/页</span>`;
    document.getElementById(elId).innerHTML=h;
  },
  downloadCsv(name,head,rows){
    const csv="﻿"+[head,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=name;a.click();UI.toast("已导出 "+rows.length+" 条");
  },
  tabs:["member-list"],
  stLabel(s){return s==="done"?"完成":s==="plan"?"待定":"迁移";},
  menuModule:"member",
  buildMenu(moduleKey){
    this.menuModule=moduleKey;
    let menu=MODULES[moduleKey].menu;
    // 视角过滤：按 scope 字段隐藏不属于当前视角的菜单项
    if(moduleKey==="sys"){
      const mode=PERSP.mode;
      menu=menu.map(g=>({g:g.g,items:g.items.filter(it=>!it.scope||it.scope===mode)})).filter(g=>g.items.length);
    }
    document.getElementById("megamenu").innerHTML=`<div class="cols">`+menu.map(g=>`
      <div class="col"><h4>${g.g}</h4>${g.items.map(it=>
        `<a data-k="${it.k}" onclick="UI.goto('${it.k}')">${it.t}${it.s==="plan"?'<span class="st plan">待定</span>':""}</a>`).join("")}</div>`).join("")+`</div>`;
    this.renderActiveMenu();
  },
  toggleModuleMenu(moduleKey,e){
    if(e)e.stopPropagation();
    const mm=document.getElementById("megamenu");
    if(mm.classList.contains("show") && this.menuModule===moduleKey){ this.closeMenu(); return; }
    this.buildMenu(moduleKey);
    mm.classList.add("show");
  },
  closeMenu(){ document.getElementById("megamenu").classList.remove("show"); },
  goto(key){
    this.current=key;
    if(!this.tabs.includes(key)) this.tabs.push(key);
    this.closeMenu();
    this.renderTabs();
    this.renderActiveNav();
    this.renderActiveMenu();
    if(key==="member-list") MemberList.render(); else if(PAGE_OBJECTS[key]) PAGE_OBJECTS[key].render(); else Generic.render(key);
    document.getElementById("content").scrollTop=0;
  },
  renderActiveNav(){
    const mod=this.moduleOf(this.current);
    for(const mk in MODULES){const el=document.getElementById(MODULES[mk].navId);if(el)el.classList.toggle("active",mk===mod);}
  },
  buildPersp(){const el=document.getElementById("perspSel");if(!el)return;const opts=GMERCHANTS.map(m=>`<option value="m:${m.id}">${m.name}（${m.code}）</option>`).join("");el.innerHTML=`<option value="group">集团视角（全部商户）</option><optgroup label="商户视角">${opts}</optgroup>`;this.syncPersp();},
  syncPersp(){const el=document.getElementById("perspSel");if(!el)return;el.value=PERSP.mode==="merchant"?("m:"+PERSP.merchantId):"group";},
  switchPersp(val){if(val==="group"){PERSP.mode="group";PERSP.merchantId=null;}else{PERSP.mode="merchant";PERSP.merchantId=val.slice(2);}this.syncPersp();const k=this.current;if(k==="member-list")MemberList.render();else if(PAGE_OBJECTS[k])PAGE_OBJECTS[k].render();else Generic.render(k);},
  renderActiveMenu(){ document.querySelectorAll("#megamenu a").forEach(a=>a.classList.toggle("active",a.dataset.k===this.current)); },
  renderTabs(){
    document.getElementById("tabbar").innerHTML=this.tabs.map(k=>{const m=this.metaOf(k);
      return `<div class="tab ${k===this.current?'active':''}" onclick="UI.goto('${k}')">${m.t}<span class="x" onclick="event.stopPropagation();UI.closeTab('${k}')">×</span></div>`;}).join("");
  },
  closeTab(key){
    if(this.tabs.length<=1) return;
    const i=this.tabs.indexOf(key); this.tabs.splice(i,1);
    if(this.current===key) this.goto(this.tabs[Math.max(0,i-1)]);
    else this.renderTabs();
  },
  open(){document.getElementById("m-detail").classList.add("show");},
  close(){document.getElementById("m-detail").classList.remove("show");},
  gmClose(){document.getElementById("g-modal").classList.remove("show");},
  toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(this._t);this._t=setTimeout(()=>t.classList.remove("show"),1800);},
  start(){
    this.buildPersp();
    this.buildMenu("member");
    this.renderTabs();
    this.renderActiveNav();
    this.renderActiveMenu();
    MemberList.render();
    document.addEventListener("click",(e)=>{
      const mm=document.getElementById("megamenu");
      const onNav=["nav-member","nav-ops","nav-config","nav-sys"].some(id=>{const el=document.getElementById(id);return el&&el.contains(e.target);});
      if(mm.classList.contains("show") && !mm.contains(e.target) && !onNav) this.closeMenu();
    });
    setInterval(()=>{const d=new Date();const p=(n)=>String(n).padStart(2,"0");
      document.getElementById("clk").textContent=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;},1000);
  }
};
UI.start();
</script>
</body>
</html>
