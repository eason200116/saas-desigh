<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>VIP 配置中心 - 市场模板与商户分配原型</title>
    <style>
      :root {
        --bg: #f5f7f7;
        --surface: #ffffff;
        --surface-soft: #f0f4f3;
        --surface-strong: #e7eeec;
        --line: #d7e0dd;
        --line-strong: #aebfba;
        --text: #1f2927;
        --muted: #65736f;
        --faint: #87948f;
        --teal: #11756f;
        --teal-dark: #0d5652;
        --blue: #2d6f9f;
        --amber: #9a6519;
        --red: #a84235;
        --green: #27704a;
        --shadow: 0 16px 42px rgba(31, 42, 39, 0.08);
        --radius: 8px;
        --font-sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        line-height: 1.45;
        margin: 0;
        -webkit-font-smoothing: antialiased;
      }

      button, input, select { font: inherit; }
      button { cursor: pointer; }
      a { color: inherit; text-decoration: none; }

      .app {
        display: grid;
        grid-template-columns: 232px minmax(680px, 1fr) 320px;
        min-width: 1280px;
        min-height: 100vh;
      }

      .sidebar {
        background: #fbfcfc;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        padding: 18px 14px;
      }

      .brand { align-items: center; display: flex; gap: 10px; padding: 6px 6px 18px; }
      .brand-symbol {
        align-items: center; background: var(--teal); border-radius: 8px; color: #fff;
        display: inline-flex; height: 34px; justify-content: center; width: 34px;
      }
      .brand strong { display: block; font-size: 15px; line-height: 1.2; }
      .brand span { color: var(--muted); display: block; font-size: 12px; margin-top: 3px; }

      .nav-label { color: var(--faint); font-size: 12px; font-weight: 700; margin: 16px 8px 8px; }
      .nav { display: grid; gap: 4px; }
      .nav a, .nav button {
        align-items: center; background: transparent; border: 0; border-radius: 7px;
        color: #33403d; display: grid; font-size: 13px; gap: 9px;
        grid-template-columns: 18px 1fr auto; min-height: 36px; padding: 8px 9px; text-align: left;
      }
      .nav a.active, .nav button.active { background: #e8f3f1; color: var(--teal-dark); font-weight: 800; }
      .nav a.disabled, .nav button.disabled { color: #a2aaa7; }
      .nav .count { color: var(--faint); font-size: 11px; }

      .main { min-width: 0; padding: 20px 22px 32px; }

      .topbar { align-items: start; display: flex; gap: 16px; justify-content: space-between; margin-bottom: 16px; }
      h1 { color: #182522; font-size: 24px; line-height: 1.2; margin: 0; }
      .subtitle { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
      .top-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }

      .button {
        align-items: center; border: 1px solid var(--line); border-radius: 7px; background: var(--surface);
        color: #263431; display: inline-flex; font-size: 13px; font-weight: 700; gap: 8px;
        min-height: 34px; padding: 7px 10px;
      }
      .button.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
      .button.warn { background: #fff7e8; border-color: #ebd5ab; color: #5a3a10; }
      .button:disabled { cursor: not-allowed; opacity: 0.48; }
      .icon-button {
        align-items: center; border: 1px solid var(--line); border-radius: 7px; background: var(--surface);
        color: #35423f; display: inline-flex; justify-content: center; min-height: 34px; width: 36px;
      }

      .scope-panel {
        background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
        box-shadow: var(--shadow); margin-bottom: 16px;
      }
      .scope-row { align-items: center; display: grid; gap: 14px; grid-template-columns: 1fr auto; padding: 14px; }
      .segmented {
        background: var(--surface-soft); border: 1px solid var(--line); border-radius: 7px;
        display: inline-grid; gap: 4px; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; width: min(360px, 100%);
      }
      .segmented button {
        background: transparent; border: 0; border-radius: 5px; color: #465350;
        font-size: 13px; font-weight: 800; min-height: 30px; padding: 6px 9px;
      }
      .segmented button.active { background: var(--surface); box-shadow: 0 1px 4px rgba(31, 42, 39, 0.08); color: var(--teal-dark); }
      .scope-meta { align-items: center; color: var(--muted); display: flex; flex-wrap: wrap; font-size: 12px; gap: 8px; justify-content: flex-end; }
      .chip {
        align-items: center; background: var(--surface-soft); border: 1px solid var(--line); border-radius: 999px;
        color: #3c4845; display: inline-flex; font-size: 12px; font-weight: 700; gap: 6px; min-height: 26px; padding: 4px 9px;
      }
      .chip.warning { background: #fff7e8; border-color: #ead3a7; color: #694512; }
      .scope-hint { border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; padding: 11px 14px; }

      .status { border-radius: 999px; font-size: 11px; font-weight: 800; padding: 2px 6px; }
      .status.live { background: #e8f5ed; color: var(--green); }
      .status.test { background: #eef3ff; color: var(--blue); }
      .status.pause { background: #fff2e1; color: var(--amber); }
      .currency-tag { background: #eef3f2; border: 1px solid var(--line); border-radius: 999px; color: #3c4845; font-size: 11px; font-weight: 800; padding: 2px 6px; }

      /* 市场卡片 */
      .market-grid { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .market-card {
        background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
        box-shadow: var(--shadow); display: grid; gap: 12px; padding: 14px;
      }
      .market-card-head { align-items: center; display: flex; gap: 10px; justify-content: space-between; }
      .market-card-head strong { align-items: center; color: #182522; display: flex; font-size: 15px; gap: 8px; }
      .market-meta { color: var(--muted); font-size: 12px; margin-top: -4px; }
      .section-label { align-items: center; color: var(--faint); display: flex; font-size: 12px; font-weight: 800; justify-content: space-between; }
      .tpl-chip-list, .merchant-chip-list { display: flex; flex-wrap: wrap; gap: 8px; }
      .tpl-chip {
        align-items: center; background: #fbfcfc; border: 1px solid var(--line); border-radius: 7px;
        color: #2e3b38; cursor: pointer; display: inline-flex; font-size: 12px; font-weight: 700; gap: 7px; padding: 7px 10px;
      }
      .tpl-chip:hover { border-color: #a7cdc8; box-shadow: inset 0 0 0 1px #cbe4df; }
      .tpl-chip .tpl-tag { background: #e8f3f1; border-radius: 999px; color: var(--teal-dark); font-size: 10px; font-weight: 800; padding: 2px 6px; }
      .tpl-chip .tpl-uses { color: var(--faint); font-size: 11px; font-weight: 700; }
      .add-tpl {
        align-items: center; background: var(--surface); border: 1px dashed var(--line-strong); border-radius: 7px;
        color: var(--teal-dark); display: inline-flex; font-size: 12px; font-weight: 800; gap: 6px; padding: 7px 10px;
      }
      .add-tpl:hover { background: #f1f7f5; }
      .market-merchants { border-top: 1px dashed var(--line); padding-top: 10px; display: grid; gap: 8px; }
      .merchant-chip {
        align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
        color: #45524f; cursor: pointer; display: inline-flex; font-size: 11px; font-weight: 700; gap: 6px; padding: 4px 9px;
      }
      .merchant-chip:hover { border-color: #a7cdc8; }
      .merchant-chip code { color: var(--faint); font-size: 10px; }
      .merchant-chip.unassigned { background: #fff7e8; border-color: #ead3a7; color: #80510e; }

      /* 指定商户分配 */
      .assign-group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; }
      .assign-head { align-items: center; background: #fbfcfc; border-bottom: 1px solid var(--line); display: flex; gap: 12px; justify-content: space-between; padding: 13px 15px; }
      .assign-head strong { color: #182522; font-size: 15px; }
      .assign-head span { color: var(--muted); font-size: 12px; }
      .assign-table { border-collapse: collapse; width: 100%; }
      .assign-table th, .assign-table td { border-bottom: 1px solid var(--line); font-size: 13px; padding: 11px 14px; text-align: left; vertical-align: middle; }
      .assign-table th { background: var(--surface-soft); color: #2e3b38; font-size: 12px; font-weight: 800; }
      .assign-table tr:last-child td { border-bottom: 0; }
      .assign-table select { min-width: 200px; }
      .assign-table td.changed { background: #eef7f5; }
      .assign-table .row-note { color: var(--teal-dark); font-size: 11px; font-weight: 800; margin-left: 8px; }

      /* 市场总览（紧凑卡） + 下钻 + 分页 */
      .market-card-overview { cursor: pointer; }
      .market-card-overview:hover { border-color: var(--line-strong); box-shadow: 0 6px 18px rgba(31, 42, 39, 0.10); }
      .overview-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; border-top: 1px dashed var(--line); border-bottom: 1px dashed var(--line); padding: 10px 0; }
      .ov-stat { text-align: center; }
      .ov-stat strong { display: block; font-size: 20px; color: var(--teal-dark); }
      .ov-stat span { font-size: 11px; color: var(--muted); }
      .market-open-hint { align-items: center; color: var(--teal-dark); display: inline-flex; font-size: 11px; font-weight: 700; gap: 5px; }
      .detail-head { align-items: center; display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
      .detail-head strong { color: #182522; font-size: 16px; }
      .pager2 { align-items: center; border-top: 1px solid var(--line); color: var(--muted); display: flex; font-size: 12px; justify-content: space-between; padding: 11px 15px; }
      .pg-list { display: flex; gap: 8px; }
      .pg { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; color: #2d3936; cursor: pointer; font-size: 12px; font-weight: 700; padding: 6px 12px; }
      .pg:hover { border-color: var(--line-strong); }
      .pg:disabled { cursor: not-allowed; opacity: 0.45; }

      select, input[type="number"], input[type="text"] {
        background: var(--surface); border: 1px solid var(--line-strong); border-radius: 7px;
        color: var(--text); min-height: 36px; padding: 7px 9px; width: 100%;
      }

      /* 右侧概览 */
      .aside { background: #fbfcfc; border-left: 1px solid var(--line); min-height: 100vh; padding: 20px 16px; }
      .summary-panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; position: sticky; top: 16px; }
      .summary-head { border-bottom: 1px solid var(--line); padding: 15px; }
      .summary-head h2 { font-size: 16px; margin: 0; }
      .summary-head p { color: var(--muted); font-size: 12px; margin: 5px 0 0; }
      .stats { display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 12px 15px; }
      .stat { background: var(--surface-soft); border: 1px solid var(--line); border-radius: 7px; padding: 10px; }
      .stat strong { display: block; font-size: 20px; line-height: 1; }
      .stat span { color: var(--muted); display: block; font-size: 12px; margin-top: 6px; }
      .changes { border-top: 1px solid var(--line); max-height: 320px; overflow: auto; padding: 8px 0; }
      .change-item { border-bottom: 1px solid var(--line); padding: 10px 15px; }
      .change-item:last-child { border-bottom: 0; }
      .change-title { align-items: center; display: flex; font-size: 13px; font-weight: 800; gap: 7px; justify-content: space-between; }
      .change-meta { color: var(--muted); font-size: 12px; margin-top: 5px; }
      .empty { color: var(--muted); font-size: 13px; padding: 18px 15px; }
      .summary-actions { border-top: 1px solid var(--line); display: grid; gap: 8px; padding: 14px 15px 15px; }

      /* 弹窗 */
      .modal-backdrop {
        align-items: center; background: rgba(13, 24, 22, 0.42); display: none; inset: 0;
        justify-content: center; padding: 24px; position: fixed; z-index: 20;
      }
      .modal-backdrop.show { display: flex; }
      .modal { background: var(--surface); border-radius: 8px; box-shadow: 0 24px 70px rgba(10, 20, 18, 0.25); max-height: min(760px, 92vh); max-width: 760px; overflow: hidden; width: 100%; }
      .modal-head { align-items: center; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; padding: 16px 18px; }
      .modal-head h2 { font-size: 18px; margin: 0; }
      .modal-head .modal-sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
      .modal-body { max-height: 560px; overflow: auto; padding: 16px 18px; }
      .modal-foot { align-items: center; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; padding: 14px 18px; }

      .config-group { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
      .config-group:last-child { margin-bottom: 0; }
      .group-head { align-items: center; background: #fbfcfc; border-bottom: 1px solid var(--line); display: flex; gap: 12px; justify-content: space-between; padding: 11px 14px; }
      .group-head h3 { color: #182522; font-size: 14px; margin: 0; }
      .group-head span { color: var(--muted); font-size: 12px; }
      .mfield { align-items: center; border-bottom: 1px solid var(--line); display: grid; gap: 14px; grid-template-columns: 1fr 220px; padding: 11px 14px; }
      .mfield:last-child { border-bottom: 0; }
      .mfield .m-name strong { color: #1f2927; display: block; font-size: 13px; }
      .mfield .m-name span { color: var(--muted); display: block; font-size: 12px; margin-top: 3px; }
      .mfield .m-name .risk-tag { background: #fff1db; border-radius: 999px; color: #80510e; font-size: 10px; font-weight: 800; margin-left: 6px; padding: 1px 6px; }
      .num-wrap { align-items: center; display: flex; gap: 6px; }
      .num-wrap .suffix { color: var(--muted); font-size: 12px; font-weight: 800; white-space: nowrap; }

      .view-note { background: #eef7f5; border: 1px solid #cbe4df; border-radius: 7px; color: #204a45; font-size: 12px; margin-bottom: 12px; padding: 10px 11px; }
      .view-note.warn { background: #fff7e8; border-color: #ead3a7; color: #5b3a10; }
      .view-table { border-collapse: collapse; width: 100%; }
      .view-table th, .view-table td { border-bottom: 1px solid var(--line); font-size: 13px; padding: 9px 11px; text-align: left; }
      .view-table th { background: var(--surface-soft); color: #2e3b38; font-weight: 800; }
      .view-table tr:last-child td { border-bottom: 0; }

      .toast {
        background: #19302c; border-radius: 7px; bottom: 22px; box-shadow: var(--shadow); color: #fff;
        display: none; font-size: 13px; font-weight: 800; left: 50%; padding: 12px 16px; position: fixed;
        transform: translateX(-50%); z-index: 30;
      }
      .toast.show { display: block; }
      svg { flex: none; }

      @media (max-width: 1180px) {
        .app { grid-template-columns: 210px minmax(0, 1fr); }
        .aside { border-left: 0; grid-column: 2; min-height: auto; padding-top: 0; }
        .summary-panel { position: static; }
        .market-grid { grid-template-columns: minmax(0, 1fr); }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-symbol"><i data-lucide="settings-2" size="18"></i></span>
          <div>
            <strong>配置中心</strong>
            <span>商户后台</span>
          </div>
        </div>

        <div class="nav-label">配置模块</div>
        <nav class="nav" aria-label="配置模块">
          <button class="active" type="button">
            <i data-lucide="crown" size="16"></i><span>VIP 规则</span><span class="count">14</span>
          </button>
          <a href="risk-config-center.html">
            <i data-lucide="shield-check" size="16"></i><span>风控规则</span><span class="count">24</span>
          </a>
          <button type="button"><i data-lucide="badge-percent" size="16"></i><span>优惠活动</span><span class="count">18</span></button>
          <button type="button"><i data-lucide="radio-tower" size="16"></i><span>渠道模板</span><span class="count">9</span></button>
          <button type="button"><i data-lucide="wallet-cards" size="16"></i><span>支付策略</span><span class="count">7</span></button>
          <button type="button"><i data-lucide="messages-square" size="16"></i><span>客服话术</span><span class="count">16</span></button>
          <button class="disabled" type="button"><i data-lucide="bar-chart-3" size="16"></i><span>报表口径</span><span class="count">后续</span></button>
        </nav>

        <div class="nav-label">发布记录</div>
        <nav class="nav" aria-label="发布记录">
          <button type="button"><i data-lucide="history" size="16"></i><span>版本记录</span><span class="count">42</span></button>
          <button type="button"><i data-lucide="rotate-ccw" size="16"></i><span>回滚单</span><span class="count">3</span></button>
        </nav>
      </aside>

      <main class="main">
        <div class="topbar">
          <div>
            <h1>VIP 配置中心</h1>
            <p class="subtitle">市场模板维护各市场 VIP 规则；商户从所属市场的模板中选择生效模板。</p>
          </div>
          <div class="top-actions">
            <span class="chip"><i data-lucide="shield-check" size="13"></i>市场仅提供模板，不修改商户配置</span>
          </div>
        </div>

        <section class="scope-panel">
          <div class="scope-row">
            <div class="segmented" role="tablist" aria-label="作用范围">
              <button class="scope-tab active" data-tab="market" type="button">市场模板</button>
              <button class="scope-tab" data-tab="assign" type="button">商户配置</button>
            </div>
            <div class="scope-meta">
              <span class="chip"><i data-lucide="globe-2" size="13"></i><span id="metaMarkets">6 个市场</span></span>
              <span class="chip"><i data-lucide="layers-3" size="13"></i><span id="metaTemplates">14 个模板</span></span>
              <span class="chip"><i data-lucide="building-2" size="13"></i><span id="metaMerchants">11 个商户</span></span>
            </div>
          </div>
          <div class="scope-hint" id="scopeHint"></div>
        </section>

        <section id="content"></section>
      </main>

      <aside class="aside">
        <section class="summary-panel">
          <div class="summary-head">
            <h2 id="summaryTitle">配置概览</h2>
            <p id="summarySubtitle">市场模板 · 商户分配总览</p>
          </div>
          <div class="stats">
            <div class="stat"><strong id="statMarkets">6</strong><span>市场</span></div>
            <div class="stat"><strong id="statTemplates">14</strong><span>模板</span></div>
            <div class="stat"><strong id="statMerchants">11</strong><span>商户</span></div>
            <div class="stat"><strong id="statUnassigned">1</strong><span>自定义配置</span></div>
          </div>
          <div class="scope-hint" style="border-top:1px solid var(--line)">市场只读查看商户配置与所用模板，不修改商户侧配置。商户是否套用模板由商户后台自行决定。</div>
        </section>
      </aside>
    </div>

    <div class="modal-backdrop" id="modal" role="dialog" aria-modal="true">
      <div class="modal">
        <div class="modal-head">
          <div>
            <h2 id="modalTitle">模板编辑</h2>
            <div class="modal-sub" id="modalSub"></div>
          </div>
          <button class="icon-button" type="button" data-close-modal aria-label="关闭"><i data-lucide="x" size="17"></i></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-foot" id="modalFoot"></div>
      </div>
    </div>

    <div class="toast" id="toast">操作成功</div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>
      const markets = [
        { id: "IN", country: "印度", currency: "INR", language: "印地语 / 英语", timezone: "UTC+5:30" },
        { id: "PK", country: "巴基斯坦", currency: "PKR", language: "乌尔都语 / 英语", timezone: "UTC+5" },
        { id: "BR", country: "巴西", currency: "BRL", language: "葡萄牙语", timezone: "UTC-3" },
        { id: "VN", country: "越南", currency: "VND", language: "越南语", timezone: "UTC+7" },
        { id: "MY", country: "马来西亚", currency: "MYR", language: "马来语 / 英语", timezone: "UTC+8" },
        { id: "MM", country: "缅甸", currency: "MMK", language: "缅甸语", timezone: "UTC+6:30" }
      ];

      let templates = [
        { id: "IN-1", marketId: "IN", name: "印度标准模板", values: { vipPlan: "标准 10 级", calcCycle: "自然月", upgradeMetric: "有效投注", keepCycle: "30 天", rebateCycle: "每日", birthdayBonus: 500, withdrawTimes: 5, withdrawLimit: 100000, highRiskReview: "开启" } },
        { id: "IN-2", marketId: "IN", name: "印度高价值模板", values: { vipPlan: "高价值 12 级", calcCycle: "自然月", upgradeMetric: "充值 + 有效投注", keepCycle: "60 天", rebateCycle: "每日", birthdayBonus: 1000, withdrawTimes: 8, withdrawLimit: 200000, highRiskReview: "开启" } },

        { id: "br4001", name: "br-main", code: "4001", marketId: "BR", templateId: "BR-1", status: "live" },
        { id: "br4002", name: "br-vip", code: "4002", marketId: "BR", templateId: "BR-2", status: "live" },
        { id: "vn5001", name: "vn-main", code: "5001", marketId: "VN", templateId: "VN-1", status: "live" },

      // 模拟「市场旗下几十至上百个站点」：程序化补充大量商户
      (function seedMerchants() {
        const counts = { IN: 96, PK: 24, BR: 31, VN: 17, MY: 42, MM: 6 };
        const base = { IN: 2100, PK: 3100, BR: 4100, VN: 5100, MY: 6100, MM: 7100 };
        markets.forEach((mk) => {
          const tpls = templates.filter((t) => t.marketId === mk.id);
          let n = merchants.filter((m) => m.marketId === mk.id).length;
          let code = base[mk.id];
          while (n < counts[mk.id]) {
            const useTpl = Math.random() < 0.82 && tpls.length;
            const st = Math.random() < 0.82 ? "live" : (Math.random() < 0.5 ? "test" : "pause");
            merchants.push({ id: mk.id.toLowerCase() + code, name: mk.id.toLowerCase() + "-" + code, code: String(code), marketId: mk.id, templateId: useTpl ? tpls[Math.floor(Math.random() * tpls.length)].id : null, status: st });
            code++; n++;
          }
        });
      })();

      const fields = [
        {

      const statusLabel = { live: "运营中", test: "测试", pause: "暂停" };

      const state = { tab: "market", marketDetail: null, mQuery: "", mPage: 1, aMarket: "", aQuery: "", aPage: 1, modal: null };
      const PAGE_SIZE = 12;

      const $ = (id) => document.getElementById(id);
      const marketById = (id) => markets.find((m) => m.id === id);
      const templateById = (id) => templates.find((t) => t.id === id);
      const templatesOfMarket = (id) => templates.filter((t) => t.marketId === id);
      const merchantsOfMarket = (id) => merchants.filter((m) => m.marketId === id);
      const getField = (key) => fields.flatMap((g) => g.items).find((f) => f.key === key);

      function effectiveTemplateId(merchant) {
        return merchant.templateId;
      }
      function templateUseCount(templateId) {
        return merchants.filter((m) => effectiveTemplateId(m) === templateId).length;
      }

      function fmt(key, value, currency) {
        const f = getField(key);
        if (!f) return value;
        if (f.type === "number") {
          const n = Number(value).toLocaleString();
          return f.currencySensitive && currency ? `${n} ${currency}` : `${n}${f.unit || ""}`;
        }
        return value;
      }

      function showToast(text) {
        const toast = $("toast");
        toast.textContent = text;
        toast.classList.add("show");
        window.setTimeout(() => toast.classList.remove("show"), 2200);
      }

      /* ---------- 市场模板 Tab ---------- */
      function renderMarketTab() {
        return state.marketDetail ? renderMarketDetail(state.marketDetail) : renderMarketOverview();

      // 一级：市场总览（紧凑卡，只显示统计 + 模板预览，应对上百商户不平铺）

            ${markets.map((market) => {

      // 二级：单市场详情（模板管理 + 商户搜索分页，应对上百站点）
      function renderMarketDetail(marketId) {
        const market = marketById(marketId);

        const rows = filtered.slice((state.mPage - 1) * PAGE_SIZE, state.mPage * PAGE_SIZE);

          </div>

            </div>
            <table class="assign-table">
              <thead><tr><th style="width:240px">商户</th><th style="width:90px">状态</th><th>当前使用模板（商户自行决定，市场只读）</th><th style="width:80px">操作</th></tr></thead>
              <tbody>
                ${rows.length ? rows.map((m) => {
                  const tpl = m.templateId ? templateById(m.templateId) : null;
                  return `<tr>
                    <td><strong>${m.name}</strong> <code style="color:var(--faint);font-size:11px">${m.code}</code></td>
                    <td><span class="status ${m.status}">${statusLabel[m.status]}</span></td>
                    <td>${tpl ? `<span class="tpl-tag">${tpl.name}</span> <span class="market-meta">${tpl.values.vipPlan}</span>` : '<span class="status pause">商户自定义配置</span>'}</td>
                    <td><button class="small-button" type="button" data-view-merchant="${m.id}"><i data-lucide="eye" size="13"></i>查看</button></td>
                  </tr>`;
                }).join("") : '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:30px">无匹配商户</td></tr>'}
              </tbody>
            </table>
            ${renderPager(total, pages, state.mPage, "m")}
          </div>
        `;
      }

      function renderPager(total, pages, page, scope) {
        if (total === 0) return "";
        return `<div class="pager2"><span>共 ${total} 个 · 第 ${page}/${pages} 页</span><div class="pg-list">
          <button class="pg" type="button" data-page="${scope}:${Math.max(1, page - 1)}" ${page <= 1 ? "disabled" : ""}>‹ 上一页</button>
          <button class="pg" type="button" data-page="${scope}:${Math.min(pages, page + 1)}" ${page >= pages ? "disabled" : ""}>下一页 ›</button>
        </div></div>`;
      }

      /* ---------- 商户配置 Tab（只读：市场筛选 + 搜索 + 分页，应对上百商户） ---------- */
      function renderAssignTab() {
        let list = merchants.slice();

      /* ---------- 弹窗：模板编辑 / 新增 ---------- */
      function openTemplateEditor(template, market, isNew) {
        state.modal = { type: "template", templateId: isNew ? null : template.id, marketId: market.id };
        $("modalTitle").textContent = isNew ? `新增模板 · ${market.country} 市场` : `编辑模板 · ${template.name}`;
        $("modalSub").textContent = `${market.country} ${market.currency} · ${market.language} · ${market.timezone}`;
        const values = isNew ? defaultValuesForMarket(market) : template.values;
        const nameValue = isNew ? "" : template.name;
        $("modalBody").innerHTML = `
          <div class="config-group">
            <div class="group-head"><h3>模板基础</h3><span>展示在市场卡片与商户分配下拉</span></div>
            <div class="mfield">
              <div class="m-name"><strong>模板名称</strong><span>例如：${market.country}标准、${market.country}高价值</span></div>
              <input type="text" data-k="__name" value="${nameValue}" placeholder="${market.country}模板名称" />
            </div>
          </div>
          ${fields.map((g) => `
            <div class="config-group">
              <div class="group-head"><h3>${g.group}</h3><span>${g.note}</span></div>
              ${g.items.map((f) => `
                <div class="mfield">
                  <div class="m-name"><strong>${f.name}${f.risk ? '<span class="risk-tag">高风险</span>' : ""}</strong><span>${f.desc}</span></div>
                  ${renderControl(f, values[f.key], market.currency)}
                </div>
              `).join("")}
            </div>
          `).join("")}
        `;
        $("modalFoot").innerHTML = `
          <button class="button" type="button" data-close-modal>取消</button>
          <button class="button primary" type="button" data-save-template>
            <i data-lucide="check" size="15"></i>${isNew ? "创建模板" : "保存模板"}
          </button>
        `;
        openModal();
      }

      function renderControl(field, value, currency) {
        if (field.type === "select") {
          return `<select data-k="${field.key}">${field.options.map((o) => `<option value="${o}" ${value === o ? "selected" : ""}>${o}</option>`).join("")}</select>`;
        }
        const suffix = field.currencySensitive ? currency : (field.unit || "");
        return `
          <div class="num-wrap">
            <input type="number" data-k="${field.key}" min="${field.min}" max="${field.max}" value="${value}" />
            ${suffix ? `<span class="suffix">${suffix}</span>` : ""}
          </div>
        `;
      }

      function defaultValuesForMarket(market) {
        const base = templatesOfMarket(market.id)[0];
        if (base) return { ...base.values };
        return { vipPlan: "标准 10 级", calcCycle: "自然月", upgradeMetric: "有效投注", keepCycle: "30 天", rebateCycle: "每日", birthdayBonus: 0, withdrawTimes: 5, withdrawLimit: 1000, highRiskReview: "开启" };
      }

      function saveTemplate() {
        const name = (document.querySelector('[data-k="__name"]').value || "").trim();
        if (!name) { showToast("请填写模板名称"); return; }
        const values = {};
        fields.flatMap((g) => g.items).forEach((f) => {
          const el = document.querySelector(`[data-k="${f.key}"]`);
          values[f.key] = f.type === "number" ? Number(el.value) : el.value;
        });
        if (state.modal.templateId) {
          const t = templateById(state.modal.templateId);
          t.name = name; t.values = values;
          showToast(`已保存模板「${name}」`);
        } else {
          const marketId = state.modal.marketId;
          const seq = templatesOfMarket(marketId).length + 1;
          templates.push({ id: `${marketId}-${seq}`, marketId, name, values });
          showToast(`已新增模板「${name}」`);
        }
        closeModal();
        render();
      }

      /* ---------- 弹窗：商户配置查看 ---------- */
      function openMerchantView(merchant) {
        const market = marketById(merchant.marketId);
        const tid = effectiveTemplateId(merchant);
        const tpl = tid ? templateById(tid) : null;
        state.modal = { type: "merchant" };
        $("modalTitle").textContent = `商户配置 · ${merchant.name}`;
        $("modalSub").textContent = `站点 ${merchant.code} · ${market.country} ${market.currency} · ${statusLabel[merchant.status]}`;
        $("modalBody").innerHTML = `
          ${tpl
            ? `<div class="view-note">当前使用模板：<strong>${tpl.name}</strong>（${market.country} 市场 / ${tpl.values.vipPlan}）。该模板由商户在商户后台自行套用，市场侧只读查看，不可修改。</div>`
            : `<div class="view-note warn">该商户使用<strong>商户自定义配置</strong>（未套用市场模板）。市场仅提供模板、可查看商户配置情况，但不修改商户侧配置。</div>`}
          ${tpl ? `
            <table class="view-table">
              <thead><tr><th>配置项</th><th>生效值</th><th>分组</th></tr></thead>
              <tbody>
                ${fields.flatMap((g) => g.items.map((f) => `
                  <tr><td>${f.name}</td><td><strong>${fmt(f.key, tpl.values[f.key], market.currency)}</strong></td><td>${g.group}</td></tr>
                `)).join("")}
              </tbody>
            </table>
          ` : ""}
        `;
        $("modalFoot").innerHTML = `
          <button class="button" type="button" data-close-modal>关闭</button>
        `;
        openModal();
      }

      function openModal() { $("modal").classList.add("show"); if (window.lucide) window.lucide.createIcons(); }
      function closeModal() { $("modal").classList.remove("show"); state.modal = null; }

      /* ---------- 概览 ---------- */
      function renderSummary() {
        const custom = merchants.filter((m) => !m.templateId).length;
        $("statMarkets").textContent = markets.length;
        $("statTemplates").textContent = templates.length;
        $("statMerchants").textContent = merchants.length;
        $("statUnassigned").textContent = custom;
        $("metaMarkets").textContent = `${markets.length} 个市场`;
        $("metaTemplates").textContent = `${templates.length} 个模板`;
        $("metaMerchants").textContent = `${merchants.length} 个商户`;
        if (state.tab === "market") {
          $("summaryTitle").textContent = "配置概览";
          $("summarySubtitle").textContent = "市场模板 · 商户使用总览";
        } else {
          $("summaryTitle").textContent = "商户配置一览";
          $("summarySubtitle").textContent = "查看各商户当前使用的模板";
        }
      }

      function renderHint() {
        $("scopeHint").innerHTML = state.tab === "market"
          ? (state.marketDetail
              ? '市场详情：上方<strong>管理该市场模板</strong>（点击编辑 / 新增），下方<strong>搜索分页查看旗下商户</strong>所用模板。市场只读查看，不修改商户配置。'
              : '市场总览：每张卡片汇总该市场的<strong>模板数 / 商户数 / 套用占比</strong>；旗下商户可达上百个，<strong>点击卡片进入市场详情</strong>再管理模板与查看商户。')
          : '商户配置：跨市场<strong>只读查看</strong>，支持<strong>市场筛选 + 搜索 + 分页</strong>，应对上百商户。市场仅提供模板、可查看商户配置，<strong>不修改商户侧配置</strong>。';
      }

      function render() {
        document.querySelectorAll(".scope-tab").forEach((b) => b.classList.toggle("active", b.dataset.tab === state.tab));
        $("content").innerHTML = state.tab === "market" ? renderMarketTab() : renderAssignTab();
        renderHint();
        renderSummary();
        if (window.lucide) window.lucide.createIcons();
      }

      /* ---------- 事件 ---------- */
      document.addEventListener("click", (event) => {
        const tab = event.target.closest(".scope-tab");
        if (tab) { state.tab = tab.dataset.tab; state.marketDetail = null; render(); return; }

        const openMk = event.target.closest("[data-market-open]");
        if (openMk) { state.marketDetail = openMk.dataset.marketOpen; state.mQuery = ""; state.mPage = 1; render(); return; }

        if (event.target.closest("[data-market-back]")) { state.marketDetail = null; render(); return; }

        const pg = event.target.closest("[data-page]");
        if (pg) { const [scope, p] = pg.dataset.page.split(":"); if (scope === "m") state.mPage = +p; else state.aPage = +p; render(); return; }

        const editTpl = event.target.closest("[data-edit-template]");
        if (editTpl) { const t = templateById(editTpl.dataset.editTemplate); openTemplateEditor(t, marketById(t.marketId), false); return; }

        const newTpl = event.target.closest("[data-new-template]");
        if (newTpl) { const market = marketById(newTpl.dataset.newTemplate); openTemplateEditor(null, market, true); return; }

        const viewM = event.target.closest("[data-view-merchant]");
        if (viewM) { openMerchantView(merchants.find((m) => m.id === viewM.dataset.viewMerchant)); return; }

        if (event.target.closest("[data-save-template]")) { saveTemplate(); return; }
        if (event.target.closest("[data-close-modal]")) { closeModal(); return; }
      });

      // 搜索 / 市场筛选（实时，重渲染后恢复输入焦点）
      document.addEventListener("input", (event) => {
        if (event.target.id === "mSearch") { state.mQuery = event.target.value; state.mPage = 1; render(); refocus("mSearch"); }
        else if (event.target.id === "aSearch") { state.aQuery = event.target.value; state.aPage = 1; render(); refocus("aSearch"); }
      });
      document.addEventListener("change", (event) => {
        if (event.target.id === "aMarket") { state.aMarket = event.target.value; state.aPage = 1; render(); }
      });
      function refocus(id) { const el = $(id); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }

      $("modal").addEventListener("click", (event) => { if (event.target.id === "modal") closeModal(); });

      render();
    </script>
  </body>
</html>
