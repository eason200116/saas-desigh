<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V1 全功能点清单（分类）</title>
<style>
:root{--brand:#0960bd;--green:#2e7d5b;--orange:#e65100;--purple:#7b1fa2;--border:#e2e6ea;--muted:#7a8494;--text:#1f2927;--bg:#f6f8fb}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
.header{background:linear-gradient(135deg,#1a3a2a,#2e7d5b);color:#fff;padding:28px 32px}
.header h1{font-size:24px;margin-bottom:6px}
.header p{opacity:.85;font-size:13px}
.stats{display:flex;gap:14px;margin-top:16px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.12);border-radius:10px;padding:10px 18px}
.stat b{font-size:24px;display:block}
.stat small{opacity:.75;font-size:11px}
.toolbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--border);padding:10px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.toolbar input{flex:1;min-width:200px;height:36px;border:1px solid var(--border);border-radius:6px;padding:0 12px;font-size:14px}
.toolbar .count{color:var(--muted);font-size:13px}
.legend{display:flex;gap:16px;padding:10px 24px;background:#fff;border-bottom:1px solid var(--border);font-size:12px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:4px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px}
.t-admin{background:#e3f2fd;color:#1565c0}
.t-api{background:#e8f5e9;color:#2e7d32}
.t-db{background:#f3e5f5;color:#7b1fa2}
.container{max-width:1400px;margin:0 auto;padding:16px 24px}
.domain{background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden}
.domain-head{display:flex;align-items:center;padding:14px 18px;background:#fafbfc;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;gap:10px}
.domain-head:hover{background:#f0f4f2}
.domain-head .arr{width:18px;font-size:12px;color:var(--muted);transition:.2s}
.domain-head.col .arr{transform:rotate(-90deg)}
.domain-head h2{font-size:16px;margin:0;flex:1}
.domain-head .dcount{font-size:12px;color:var(--muted)}
.domain-head.col + .domain-body{display:none}
.domain-body{padding:0}
.sub{border-bottom:1px solid #f0f2f5}
.sub:last-child{border-bottom:0}
.sub-head{padding:10px 18px;font-weight:700;font-size:14px;color:var(--brand);background:#f9fbfd}
.layer{padding:8px 18px 8px 32px;display:flex;gap:10px;border-top:1px solid #f5f7fa}
.layer-label{flex:none;width:64px;padding-top:2px}
.layer-items{flex:1;font-size:13px;color:#374151;line-height:1.9}
.layer-items b{color:#1a2332}
.layer-items .item{display:inline}
@media(max-width:768px){.layer{flex-direction:column;gap:4px}.layer-label{width:auto}}
</style>
</head>
<body>

<div class="header">
  <h1>V1 全功能点清单（按业务域分类）</h1>
  <p>检索 Ar_V1_Admin（后台）+ ar_v1_lotteryapi（会员端API/Service）+ Ar_V1_DataBase（数据库）整合</p>
  <div class="stats">
    <div class="stat"><b>600+</b><small>后台 Action</small></div>
    <div class="stat"><b>200+</b><small>会员端 API</small></div>
    <div class="stat"><b>121</b><small>Service 服务</small></div>
    <div class="stat"><b>500+</b><small>数据表</small></div>
    <div class="stat"><b>11</b><small>业务域</small></div>
  </div>
</div>

<div class="legend">
  <span><span class="tag t-admin">后台</span> Ar_V1_Admin 管理后台功能</span>
  <span><span class="tag t-api">会员端</span> 会员 App/H5 接口</span>
  <span><span class="tag t-db">数据</span> 数据库表</span>
  <span style="margin-left:auto;color:var(--muted)">点击业务域标题可折叠</span>
</div>

<div class="toolbar">
  <input id="q" placeholder="搜索功能点/表名…" oninput="F()">
  <span class="count" id="rc"></span>
</div>

<div class="container" id="root"></div>

function render(){
  var root=document.getElementById('root');
  var h='';
  DATA.forEach(function(d,i){
    var subCount=d.subs.length;
    h+='<div class="domain" data-domain><div class="domain-head" onclick="this.classList.toggle(\'col\')"><span class="arr">▼</span><h2>'+d.domain+'</h2><span class="dcount">'+subCount+' 个子类</span></div><div class="domain-body">';
    d.subs.forEach(function(s){
      h+='<div class="sub"><div class="sub-head">'+s.name+'</div>';
      if(s.admin&&s.admin!=='—')h+='<div class="layer"><span class="layer-label"><span class="tag t-admin">后台</span></span><div class="layer-items">'+s.admin+'</div></div>';
      if(s.api&&s.api!=='—')h+='<div class="layer"><span class="layer-label"><span class="tag t-api">会员端</span></span><div class="layer-items">'+s.api+'</div></div>';
      if(s.db&&s.db!=='—')h+='<div class="layer"><span class="layer-label"><span class="tag t-db">数据</span></span><div class="layer-items">'+s.db+'</div></div>';
      h+='</div>';
    });
    h+='</div></div>';
  });
  root.innerHTML=h;
  updateCount();
}
function updateCount(){
  var subs=document.querySelectorAll('.sub:not([style*="display: none"])').length;
  document.getElementById('rc').textContent=DATA.length+' 个业务域 · '+document.querySelectorAll('.sub').length+' 个子分类';
}
function F(){
  var q=document.getElementById('q').value.toLowerCase();
  document.querySelectorAll('.domain').forEach(function(dom){
    var anyVisible=false;
    dom.querySelectorAll('.sub').forEach(function(sub){
      var match=!q||sub.textContent.toLowerCase().includes(q);
      sub.style.display=match?'':'none';
      if(match)anyVisible=true;
    });
    dom.style.display=anyVisible?'':'none';
    if(q&&anyVisible)dom.querySelector('.domain-head').classList.remove('col');
  });
}
render();
</script>
</body>
</html>
