  <script>
  // 主题改色：青绿(teal #009688) → 蓝色(#2563eb)。统一顶部导航与所有选中态控件。
  (function () {
    var PRIMARY = '#2563eb';      // 主色蓝（顶部导航 + 主按钮 + 选中态）
    var PRIMARY_HOVER = '#3b82f6';// hover 浅蓝
    function fix(str) {
      if (!str) return str;
      return str
        .replace(/#009688/gi, PRIMARY)
        .replace(/#1eb4a6/gi, PRIMARY_HOVER)
        .replace(/rgba\(\s*0\s*,\s*150\s*,\s*136/gi, 'rgba(37, 99, 235')
        .replace(/rgb\(\s*0\s*,\s*150\s*,\s*136\s*\)/gi, 'rgb(37, 99, 235)')
        .replace(/rgba\(\s*30\s*,\s*180\s*,\s*166/gi, 'rgba(59, 130, 246')
        .replace(/rgb\(\s*30\s*,\s*180\s*,\s*166\s*\)/gi, 'rgb(59, 130, 246)');
    }
    function fixStyleEl(el) {
      var c = el.textContent;
      if (c && (c.indexOf('009688') > -1 || c.indexOf('1eb4a6') > -1 || c.indexOf('150, 136') > -1 || c.indexOf('150,136') > -1)) {
        el.textContent = fix(c);
      }
    }
    function fixInline(el) {
      if (!el.getAttribute) return;
      var s = el.getAttribute('style');
      if (s && (s.indexOf('009688') > -1 || s.indexOf('1eb4a6') > -1 || s.indexOf('150, 136') > -1 || s.indexOf('150,136') > -1)) {
        el.setAttribute('style', fix(s));
      }
    }
    function sweep() {
      var styles = document.querySelectorAll('style');
      for (var i = 0; i < styles.length; i++) fixStyleEl(styles[i]);
      var styled = document.querySelectorAll('[style]');
      for (var j = 0; j < styled.length; j++) fixInline(styled[j]);
    }
    var mo = new MutationObserver(function (muts) {
      for (var i = 0; i < muts.length; i++) {
        var m = muts[i];
        for (var a = 0; a < m.addedNodes.length; a++) {
          var n = m.addedNodes[a];
          if (n.nodeType !== 1) continue;
          if (n.tagName === 'STYLE') fixStyleEl(n);
          else {
            fixInline(n);
            if (n.querySelectorAll) {
              var sub = n.querySelectorAll('style,[style]');
              for (var s = 0; s < sub.length; s++) {
                if (sub[s].tagName === 'STYLE') fixStyleEl(sub[s]); else fixInline(sub[s]);
              }
            }
          }
        }
        if (m.type === 'attributes' && m.attributeName === 'style') fixInline(m.target);
        if (m.type === 'characterData' && m.target.parentElement && m.target.parentElement.tagName === 'STYLE') fixStyleEl(m.target.parentElement);
      }
    });
    function start() {
      sweep();
      mo.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['style'], characterData: true });
    }
    if (document.body) start();
    else document.addEventListener('DOMContentLoaded', start);
  })();
  </script>
  <script>
  // 顶部导航分组下拉 → 多列全展开（mega menu）
  (function () {
    function injectCss() {
      if (document.getElementById('ar-mega-css')) return;
      var st = document.createElement('style'); st.id = 'ar-mega-css';
      st.textContent =
        '.ar-mega{display:flex!important;flex-wrap:wrap;align-items:flex-start;gap:0;max-width:94vw;padding:14px 10px}'
        + '.ar-mega>.ar-mega-col{display:flex;flex-direction:column;min-width:200px;padding:0 16px}'
        + '.ar-mega>.ar-mega-col+.ar-mega-col{border-left:1px solid #eef2f7}'
        + '.ar-mega .n-dropdown-option{border-radius:8px;margin:1px 0}'
        + '.ar-mega .n-dropdown-option-body{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px!important;border-radius:8px;font-size:13.5px;color:#1f2937;transition:background .12s,color .12s}'
        + '.ar-mega .n-dropdown-option-body--group{font-weight:700;color:#1d4ed8!important;opacity:1!important;height:auto;font-size:13px;letter-spacing:.5px;padding:2px 10px 8px!important;margin-bottom:4px;border-bottom:1px solid #eef2f7;border-radius:0}'
        + '.ar-mega .n-dropdown-option:hover .n-dropdown-option-body:not(.n-dropdown-option-body--group){background:#eff5ff!important;color:#1d4ed8!important}'
        + '.ar-mega .n-dropdown-option:hover .n-dropdown-option-body__label{color:#1d4ed8!important}'
        + '.ar-mega .ar-tag{margin-left:auto;flex:none;font-size:10px;font-weight:700;line-height:1;border-radius:6px;padding:3px 7px;letter-spacing:0;opacity:1}'
        + '.ar-mega .ar-tag-new{background:#fff1e6;color:#e8820a}'
        + '.ar-mega .ar-tag-old{background:#f1f5f9;color:#9aa4b2}'
        + '.v-binder-follower-content:has(.ar-mega){position:fixed!important;left:50%!important;top:58px!important;right:auto!important;bottom:auto!important;transform:translateX(-50%)!important}'
        + '.v-binder-follower-content:has(.ar-mega) .n-dropdown{max-width:94vw}'
        + '.v-binder-follower-content:has(.ar-mega){padding-top:18px!important;margin-top:-18px!important}'
        + '.v-binder-follower-content:has(.ar-mega)::before{content:"";position:absolute;left:0;right:0;top:0;height:20px;background:transparent}';
      document.head.appendChild(st);
    }
    // 原有功能（有真实页面）的入口；其余视为本次新加
    var EXISTING = {'下级会员列表':1,'在线人数':1,'会员层级':1,'会员银行卡管理':1,'系统用户管理':1,'系统角色管理':1,'白名单IP':1,'平台日志':1,'中台日志':1,'资金账变':1,'充值订单管理':1,'充值类型管理':1,'人工充值':1,'人工充值审核列表':1,'人工充值审核记录':1,'提现订单管理':1,'提现类型管理':1,'本地收款账号管理':1,'支代付三方管理':1,'银行字典':1,'三方游戏记录':1,'数据统计':1,'支代付通道预警':1};
    function build(menu) {
      if (menu.__armega) return;
      var first = menu.querySelector('.n-dropdown-option');
      if (!first) return;
      var holder = first.parentElement;
      var arr = [].slice.call(holder.children).filter(function (c) { return c.classList && c.classList.contains('n-dropdown-option'); });
      if (!arr.length) return;
      // 仅对“全分组”菜单生效（首项是分组标题）；财务等混合菜单跳过
      if (!arr[0].querySelector('.n-dropdown-option-body--group')) return;
      menu.__armega = true;
      injectCss();
      var cols = [], cur = null;
      var RENAME = { '用户分组': '分组管理', '相同IP': '同IP/设备检测', 'VIP等级': 'VIP等级配置' };
      var GRENAME = { '等级配置': 'VIP相关配置' };
      var HIDE = { '代理审核机制': 1, 'VIP经验配置': 1, '风控名单': 1, '对打查询': 1, '互刷名单': 1, '分组表单': 1, '合伙人奖励': 1, '充值奖励发放记录': 1, '邀请奖励领取记录': 1, '连续签到记录': 1, '会员提现限制名单': 1, '刷通道用户清单': 1, '刷通道会员清单': 1, '充值等级': 1, '登录日志列表': 1, '登录日志(代理)': 1, '登录日志（代理）': 1, '活动任务': 1, '任务活动': 1, '任务活动配置': 1, '任务订单': 1, 'KW认证': 1, 'CPF认证': 1, '会员洗码管理': 1, '洗码记录': 1, '洗码规则说明': 1, '会员活动黑名单': 1, '签到配置': 1, '代理关系导入': 1, '代理关系': 1, '代理关系(D/C/M/A)': 1 };
      var hideGrp = false;
      arr.forEach(function (o) {
        var groupTitle = o.querySelector('.n-dropdown-option-body--group');
        var labEl = groupTitle || o.querySelector('.n-dropdown-option-body__label');
        var _lt = labEl ? labEl.textContent.trim() : '';
        if (groupTitle) hideGrp = !!HIDE[_lt];               // 进入分组：该组是否整组隐藏
        if (groupTitle && GRENAME[_lt]) { groupTitle.textContent = GRENAME[_lt]; }  // 分组标题改名
        if ((labEl && HIDE[_lt]) || (!groupTitle && hideGrp)) { o.remove(); return; }  // 命中 HIDE 的项/组标题，或隐藏组下的所有项
        if (labEl && !groupTitle && RENAME[_lt]) { labEl.textContent = RENAME[_lt]; _lt = RENAME[_lt]; }  // 菜单项改名
        if (groupTitle || !cur) { cur = document.createElement('div'); cur.className = 'ar-mega-col'; cols.push(cur); }
        if (!groupTitle) {
          var body = o.querySelector('.n-dropdown-option-body');
          var labelEl = o.querySelector('.n-dropdown-option-body__label');
          var name = labelEl ? labelEl.textContent.trim() : '';
          if (body && !body.querySelector('.ar-tag')) {
            var isOld = !!EXISTING[name];
            var tag = document.createElement('span');
            tag.className = 'ar-tag ' + (isOld ? 'ar-tag-old' : 'ar-tag-new');
            tag.textContent = isOld ? '原' : '新';
            body.appendChild(tag);
          }
        }
        cur.appendChild(o);
      });
      cols.forEach(function (c) { holder.appendChild(c); });
      (function () {
        var SIG = { '连续签到记录': 1, '充值奖励发放记录': 1, '昨日返佣等级': 1, '站内消息': 1 };
        var isOps = arr.some(function (o) { var l = o.querySelector('.n-dropdown-option-body__label'); return l && SIG[l.textContent.trim()]; });
        if (!isOps || holder.querySelector('.ar-add-col')) return;
        var grpTpl = null, itTpl = null;
        arr.forEach(function (o) { if (o.querySelector('.n-dropdown-option-body--group')) { grpTpl = grpTpl || o; } else { itTpl = itTpl || o; } });
        if (!grpTpl || !itTpl) return;
        // 运营管理整组重排：清掉打包原列，按 运营配置 / 推广配置 / 运营数据 等组重建（所有项按 label 路由 SPECS）
        [].slice.call(holder.querySelectorAll('.ar-mega-col')).forEach(function (c) { c.remove(); });
        var ADD = [
          ['运营配置', ['站内消息', '公告消息', '轮播图管理']],
          ['推广配置', ['渠道管理']],
          ['运营数据', ['VIP升级奖励记录', 'VIP人数', 'VIP操作日志']],
          ['返佣 · 等级', ['会员返佣等级', '代理审核机制']]
        ];
        ADD.forEach(function (G) {
          var col = document.createElement('div'); col.className = 'ar-mega-col ar-add-col';
          var gh = grpTpl.cloneNode(true); var ght = gh.querySelector('.n-dropdown-option-body--group'); if (ght) ght.textContent = G[0]; col.appendChild(gh);
          G[1].forEach(function (nm) {
            var it = itTpl.cloneNode(true);
            var lab = it.querySelector('.n-dropdown-option-body__label'); if (lab) lab.textContent = nm;
            var ot = it.querySelector('.ar-tag'); if (ot) ot.remove();
            var bd = it.querySelector('.n-dropdown-option-body'); if (bd) { var tg = document.createElement('span'); tg.className = 'ar-tag ar-tag-new'; tg.textContent = '新'; bd.appendChild(tg); }
            col.appendChild(it);
          });
          holder.appendChild(col);
        });
      })();
      (function () {
        var RSIG = { '数据统计': 1, '支代付通道预警': 1 };
        var isRep = arr.some(function (o) { var l = o.querySelector('.n-dropdown-option-body__label'); return l && RSIG[l.textContent.trim()]; });
        if (!isRep || holder.querySelector('.ar-add-col')) return;
        var grpTpl = null, itTpl = null;
        arr.forEach(function (o) { if (o.querySelector('.n-dropdown-option-body--group')) { grpTpl = grpTpl || o; } else { itTpl = itTpl || o; } });
        if (!grpTpl || !itTpl) return;
        [].slice.call(holder.querySelectorAll('.ar-mega-col')).forEach(function (c) { c.remove(); });
        var RADD = [
          ['数据报表', ['数据统计', '支代付通道预警']],
          ['代理报表', ['代理报表', '昨日返佣等级']]
        ];
        RADD.forEach(function (G) {
          var col = document.createElement('div'); col.className = 'ar-mega-col ar-add-col';
          var gh = grpTpl.cloneNode(true); var ght = gh.querySelector('.n-dropdown-option-body--group'); if (ght) ght.textContent = G[0]; col.appendChild(gh);
          G[1].forEach(function (nm) {
            var it = itTpl.cloneNode(true);
            var lab = it.querySelector('.n-dropdown-option-body__label'); if (lab) lab.textContent = nm;
            var ot = it.querySelector('.ar-tag'); if (ot) ot.remove();
            var isNew = nm === '代理报表' || nm === '昨日返佣等级';
            var bd = it.querySelector('.n-dropdown-option-body'); if (bd) { var tg = document.createElement('span'); tg.className = 'ar-tag ' + (isNew ? 'ar-tag-new' : 'ar-tag-old'); tg.textContent = isNew ? '新' : '原'; bd.appendChild(tg); }
            col.appendChild(it);
          });
          holder.appendChild(col);
        });
      })();
      // 「会员返佣等级」已迁移至「运营管理 / 返佣 · 等级」（见上方运营管理 ADD 重排）
      holder.classList.add('ar-mega');
    }
    var mo = new MutationObserver(function (muts) {
      for (var i = 0; i < muts.length; i++) {
        var m = muts[i];
        for (var a = 0; a < m.addedNodes.length; a++) {
          var n = m.addedNodes[a]; if (n.nodeType !== 1) continue;
          var menus = [];
          if (n.classList && n.classList.contains('n-dropdown-menu')) menus.push(n);
          if (n.querySelectorAll) { var q = n.querySelectorAll('.n-dropdown-menu'); for (var k = 0; k < q.length; k++) menus.push(q[k]); }
          menus.forEach(function (menu) { requestAnimationFrame(function () { build(menu); }); });
        }
      }
    });
    function start() { mo.observe(document.documentElement, { childList: true, subtree: true }); }
    if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);
  })();
  </script>

PWA）</li><li style="margin:2px 0">原生 / 壳包：<b>新增渠道包</b>，上传安装包，渠道码写入</li><li style="margin:2px 0">PWA：走 <b>PWA 管理</b> → 域名(内外链) → 页面配置 → 推送配置 → 发布</li><li style="margin:2px 0">原生包按需配 仿谷歌 / 仿苹果商店；H5 / PWA 无需打包</li></ol><div style="display:flex;gap:8px;flex-wrap:wrap"><div style="flex:1;min-width:240px;font-size:12px;color:#047857;background:#f6fefb;border:1px solid #a7f3d0;border-radius:6px;padding:5px 10px">✅ <b>检查点</b>：包可安装 / PWA 可添加到主屏、渠道码正确、页面与推送配置生效</div><div style="font-size:12px;color:#06b6d4;background:#06b6d414;border:1px solid #06b6d455;border-radius:6px;padding:5px 10px;white-space:nowrap">📤 产出：带渠道码的安装包 / PWA / H5</div></div></div></div><div style="display:flex;gap:0"><div style="flex:0 0 40px;display:flex;flex-direction:column;align-items:center"><div style="width:32px;height:32px;line-height:32px;border-radius:50%;background:#f59e0b;color:#fff;font-weight:700;text-align:center;font-size:14px">3</div><div style="width:2px;flex:1;background:#f59e0b;opacity:.25;min-height:24px;margin-top:2px"></div></div><div style="flex:1;border:1px solid #e8ebf0;border-left:3px solid #f59e0b;border-radius:8px;padding:10px 14px;margin-bottom:12px;background:#fcfcfd"><div style="font-weight:700;color:#1f2937;font-size:14px;margin-bottom:2px">🔗 渠道绑定<span style="display:inline-block;font-size:10.5px;color:#fff;background:#3b82f6;border-radius:10px;padding:1px 9px;margin-left:6px;vertical-align:middle">运营 / 产品</span> <span style="font-size:11px;color:#94a3b8;font-weight:400">（渠道管理）</span></div><ol style="margin:6px 0 8px;padding-left:18px;color:#475569;font-size:12.5px;line-height:1.85"><li style="margin:2px 0">新建渠道，绑定<b>落地指向</b>（域名 / 包 / PWA / 商店页）</li><li style="margin:2px 0"><b>关联埋点</b>（选定投放平台）</li><li style="margin:2px 0">生成带渠道码的推广链接</li></ol><div style="display:flex;gap:8px;flex-wrap:wrap"><div style="flex:1;min-width:240px;font-size:12px;color:#047857;background:#f6fefb;border:1px solid #a7f3d0;border-radius:6px;padding:5px 10px">✅ <b>检查点</b>：链接可正常打开、渠道码随链接携带、归因来源写入测试通过</div><div style="font-size:12px;color:#f59e0b;background:#f59e0b14;border:1px solid #f59e0b55;border-radius:6px;padding:5px 10px;white-space:nowrap">📤 产出：可投放的带渠道码链接</div></div></div></div><div style="display:flex;gap:0"><div style="flex:0 0 40px;display:flex;flex-direction:column;align-items:center"><div style="width:32px;height:32px;line-height:32px;border-radius:50%;background:#10b981;color:#fff;font-weight:700;text-align:center;font-size:14px">4</div><div style="width:2px;flex:1;background:#10b981;opacity:.25;min-height:24px;margin-top:2px"></div></div><div style="flex:1;border:1px solid #e8ebf0;border-left:3px solid #10b981;border-radius:8px;padding:10px 14px;margin-bottom:12px;background:#fcfcfd"><div style="font-weight:700;color:#1f2937;font-size:14px;margin-bottom:2px">📊 埋点回传<span style="display:inline-block;font-size:10.5px;color:#fff;background:#8b5cf6;border-radius:10px;padding:1px 9px;margin-left:6px;vertical-align:middle">技术 / 研发</span><span style="display:inline-block;font-size:10.5px;color:#fff;background:#10b981;border-radius:10px;padding:1px 9px;margin-left:6px;vertical-align:middle">广告优化师</span> <span style="font-size:11px;color:#94a3b8;font-weight:400">（埋点管理）</span></div><ol style="margin:6px 0 8px;padding-left:18px;color:#475569;font-size:12.5px;line-height:1.85"><li style="margin:2px 0">对照「投放渠道 × 可投放端」确认平台与端</li><li style="margin:2px 0">配置 <b>Click 上报</b>（像素）+ <b>API 回传</b>（CAPI / S2S）</li><li style="margin:2px 0">配置必传基础事件：激活 / 注册 / 登录 / 首充 / 付费</li><li style="margin:2px 0">填入 Pixel ID / Token（参考各渠道开发文档）</li></ol><div style="display:flex;gap:8px;flex-wrap:wrap"><div style="flex:1;min-width:240px;font-size:12px;color:#047857;background:#f6fefb;border:1px solid #a7f3d0;border-radius:6px;padding:5px 10px">✅ <b>检查点</b>：测试回传成功、事件到达广告平台、clickid 参数匹配</div><div style="font-size:12px;color:#10b981;background:#10b98114;border:1px solid #10b98155;border-radius:6px;padding:5px 10px;white-space:nowrap">📤 产出：广告平台回传闭环</div></div></div></div><div style="display:flex;gap:0"><div style="flex:0 0 40px;display:flex;flex-direction:column;align-items:center"><div style="width:32px;height:32px;line-height:32px;border-radius:50%;background:#8b5cf6;color:#fff;font-weight:700;text-align:center;font-size:14px">5</div></div><div style="flex:1;border:1px solid #e8ebf0;border-left:3px solid #8b5cf6;border-radius:8px;padding:10px 14px;margin-bottom:12px;background:#fcfcfd"><div style="font-weight:700;color:#1f2937;font-size:14px;margin-bottom:2px">🚀 投放监控<span style="display:inline-block;font-size:10.5px;color:#fff;background:#10b981;border-radius:10px;padding:1px 9px;margin-left:6px;vertical-align:middle">广告优化师</span> <span style="font-size:11px;color:#94a3b8;font-weight:400">（报表管理 / 渠道数据）</span></div><ol style="margin:6px 0 8px;padding-left:18px;color:#475569;font-size:12.5px;line-height:1.85"><li style="margin:2px 0">广告平台建广告，填入推广链接</li><li style="margin:2px 0">开始投放，实时监控回传数据</li><li style="margin:2px 0">查看渠道 ROI 报表与会员归因来源</li><li style="margin:2px 0">按数据 放量 / 降本 优化</li></ol><div style="display:flex;gap:8px;flex-wrap:wrap"><div style="flex:1;min-width:240px;font-size:12px;color:#047857;background:#f6fefb;border:1px solid #a7f3d0;border-radius:6px;padding:5px 10px">✅ <b>检查点</b>：转化数据回流、会员归因正确、渠道 ROI 可见</div><div style="font-size:12px;color:#8b5cf6;background:#8b5cf614;border:1px solid #8b5cf655;border-radius:6px;padding:5px 10px;white-space:nowrap">📤 产出：持续跑量与优化闭环</div></div></div></div><div style="margin-top:2px;padding:11px 14px;background:#eff6ff;border:1px solid #dbeafe;border-radius:8px;font-size:12px;color:#1e40af;line-height:1.8">📋 <b>使用方式</b>：把 5 个阶段当作上线 Checklist，<b>每阶段检查点全部 ✅ 后再进入下一阶段</b>；任一检查点不通过则回退修复，避免链路断点导致投放无归因 / 无法跑量。</div><div style="font-weight:700;color:#1d4ed8;margin:16px 0 8px;font-size:14px">二、配置主线流程图</div><div style="color:#6b7280;font-size:12.5px;margin-bottom:8px">一条主线 4 步走通：<b>域名配置 → 备包 / PWA → 渠道管理 → 埋点回传</b>；其中 H5 / PWA 形态可跳过「备包」。</div><div style="display:flex;align-items:stretch;gap:6px;overflow-x:auto;padding:8px 2px 12px"><div style="flex:1 1 0;min-width:150px;background:linear-gradient(135deg,#3b82f612,#3b82f603);border:1.5px solid #3b82f6;border-radius:12px;padding:14px 12px;text-align:center"><div style="width:28px;height:28px;line-height:28px;border-radius:50%;background:#3b82f6;color:#fff;font-weight:700;font-size:14px;margin:0 auto 6px">1</div><div style="font-size:26px;line-height:1">🌐</div><div style="font-weight:700;color:#3b82f6;font-size:15px;margin-top:5px">域名配置</div><div style="font-size:12px;color:#64748b;margin-top:4px;line-height:1.5">主域名 + 推广域名 + 防封救援</div></div><div style="flex:0 0 auto;display:flex;align-items:center;color:#06b6d4;font-size:24px;font-weight:700">→</div><div style="flex:1 1 0;min-width:150px;background:linear-gradient(135deg,#06b6d412,#06b6d403);border:1.5px solid #06b6d4;border-radius:12px;padding:14px 12px;text-align:center"><div style="width:28px;height:28px;line-height:28px;border-radius:50%;background:#06b6d4;color:#fff;font-weight:700;font-size:14px;margin:0 auto 6px">2</div><div style="font-size:26px;line-height:1">📦</div><div style="font-weight:700;color:#06b6d4;font-size:15px;margin-top:5px">备包 / PWA</div><div style="font-size:12px;color:#64748b;margin-top:4px;line-height:1.5">打安装包 · 发布 PWA · H5 免</div></div><div style="flex:0 0 auto;display:flex;align-items:center;color:#f59e0b;font-size:24px;font-weight:700">→</div><div style="flex:1 1 0;min-width:150px;background:linear-gradient(135deg,#f59e0b12,#f59e0b03);border:1.5px solid #f59e0b;border-radius:12px;padding:14px 12px;text-align:center"><div style="width:28px;height:28px;line-height:28px;border-radius:50%;background:#f59e0b;color:#fff;font-weight:700;font-size:14px;margin:0 auto 6px">3</div><div style="font-size:26px;line-height:1">🔗</div><div style="font-weight:700;color:#f59e0b;font-size:15px;margin-top:5px">渠道管理</div><div style="font-size:12px;color:#64748b;margin-top:4px;line-height:1.5">建渠道 + 渠道码 + 关联埋点</div></div><div style="flex:0 0 auto;display:flex;align-items:center;color:#10b981;font-size:24px;font-weight:700">→</div><div style="flex:1 1 0;min-width:150px;background:linear-gradient(135deg,#10b98112,#10b98103);border:1.5px solid #10b981;border-radius:12px;padding:14px 12px;text-align:center"><div style="width:28px;height:28px;line-height:28px;border-radius:50%;background:#10b981;color:#fff;font-weight:700;font-size:14px;margin:0 auto 6px">4</div><div style="font-size:26px;line-height:1">📊</div><div style="font-weight:700;color:#10b981;font-size:15px;margin-top:5px">埋点回传</div><div style="font-size:12px;color:#64748b;margin-top:4px;line-height:1.5">接广告平台 Click + API 回传</div></div></div><div style="font-weight:700;color:#1d4ed8;margin:16px 0 8px;font-size:14px">三、配置关联矩阵（形态 × 功能）</div><table style="width:100%;border-collapse:collapse;border:1px solid #e5e7eb;font-size:12.5px"><thead><tr><th style="padding:9px 10px;border:1px solid #e5e7eb;background:#f1f5f9;color:#334155;font-weight:700">功能 ＼ 形态</th><th style="padding:9px 10px;border:1px solid #e5e7eb;background:#f1f5f9;color:#334155;font-weight:700;white-space:nowrap">🤖 安卓 APK</th><th style="padding:9px 10px;border:1px solid #e5e7eb;background:#f1f5f9;color:#334155;font-weight:700;white-space:nowrap">🍎 iOS 原生</th><th style="padding:9px 10px;border:1px solid #e5e7eb;background:#f1f5f9;color:#334155;font-weight:700;white-space:nowrap">📦 安卓壳包</th><th style="padding:9px 10px;border:1px solid #e5e7eb;background:#f1f5f9;color:#334155;font-weight:700;white-space:nowrap">📦 iOS 壳包</th><th style="padding:9px 10px;border:1px solid #e5e7eb;background:#f1f5f9;color:#334155;font-weight:700;white-space:nowrap">🌐 H5 链接</th><th style="padding:9px 10px;border:1px solid #e5e7eb;background:#f1f5f9;color:#334155;font-weight:700;white-space:nowrap">📲 PWA</th></tr></thead><tbody><tr><td style="padding:8px 10px;border:1px solid #e5e7eb;font-weight:700;color:#1f2937;white-space:nowrap">🌐 域名管理</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">主域名 + 推广域名</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">主域名 + 推广域名</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">推广域名(壳访问URL)</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">推广域名(壳访问URL)</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">推广域名 + 防封页(救援)</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">推广域名(内外链)</td></tr><tr><td style="padding:8px 10px;border:1px solid #e5e7eb;font-weight:700;color:#1f2937;white-space:nowrap">📦 打包管理</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">上传 安卓包(.apk)</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">上传 iOS包(.ipa)</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">上传 安卓壳包</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">上传 iOS壳包</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">无需打包</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">免打包 · PWA 发布</td></tr><tr><td style="padding:8px 10px;border:1px solid #e5e7eb;font-weight:700;color:#1f2937;white-space:nowrap">🏪 仿应用商店</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">仿谷歌商店(可上架马甲)</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">仿苹果商店</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">可选</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">可选</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">—</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">可选(加桌面引导)</td></tr><tr><td style="padding:8px 10px;border:1px solid #e5e7eb;font-weight:700;color:#1f2937;white-space:nowrap">🔗 渠道管理</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">渠道+落地+渠道码写包</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">渠道+苹果安装类型</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">渠道码写入壳</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">渠道码写入壳</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">带渠道ID 的 H5 链接</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">带渠道ID 的 PWA 链接</td></tr><tr><td style="padding:8px 10px;border:1px solid #e5e7eb;font-weight:700;color:#1f2937;white-space:nowrap">📊 埋点管理</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">GAID 回传</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">IDFA/IDFV(ATT)</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">壳内H5像素+回传</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">壳内H5像素+回传</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">H5像素 + CAPI 回传</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;color:#475569">H5像素+CAPI+推送</td></tr></tbody></table><div style="font-weight:700;color:#1d4ed8;margin:20px 0 8px;font-size:14px">四、各形态配置流程（按顺序执行）</div><div style="border:1px solid #e8ebf0;border-radius:10px;padding:12px 16px;margin-bottom:10px;background:#fcfcfd"><div style="font-weight:700;color:#1f2937;margin-bottom:6px;font-size:14px">🤖 安卓 APK（原生安装包）</div><ol style="margin:0;padding-left:20px;color:#475569;font-size:13px;line-height:1.8"><li style="margin:3px 0">域名管理：配置主域名 + 推广域名（解析生效）</li><li style="margin:3px 0">打包管理：新增渠道包 → 上传 安卓包(.apk)，渠道码写入安装包</li><li style="margin:3px 0">仿应用商店：配置仿谷歌商店（可上架谷歌马甲包）</li><li style="margin:3px 0">渠道管理：建渠道 → 落地指向 → 关联埋点 → 生成带渠道码链接</li><li style="margin:3px 0">埋点管理：配置安卓回传（GAID；Facebook / TikTok / Kwai 的 click 或 API）</li></ol></div><div style="border:1px solid #e8ebf0;border-radius:10px;padding:12px 16px;margin-bottom:10px;background:#fcfcfd"><div style="font-weight:700;color:#1f2937;margin-bottom:6px;font-size:14px">🍎 iOS（原生 / 保存桌面 / 苹果商店）</div><ol style="margin:0;padding-left:20px;color:#475569;font-size:13px;line-height:1.8"><li style="margin:3px 0">域名管理：主域名 + 推广域名</li><li style="margin:3px 0">打包管理：新增渠道包 → 上传 iOS包(.ipa)</li><li style="margin:3px 0">仿应用商店：配置仿苹果商店</li><li style="margin:3px 0">渠道管理：渠道 + 落地指向，苹果安装类型（保存桌面 / 苹果商店）</li><li style="margin:3px 0">埋点管理：iOS 回传（IDFA / IDFV，注意 ATT 授权）</li></ol></div><div style="border:1px solid #e8ebf0;border-radius:10px;padding:12px 16px;margin-bottom:10px;background:#fcfcfd"><div style="font-weight:700;color:#1f2937;margin-bottom:6px;font-size:14px">📦 安卓壳包（WebView 套壳）</div><ol style="margin:0;padding-left:20px;color:#475569;font-size:13px;line-height:1.8"><li style="margin:3px 0">域名管理：配置推广域名（壳包打开的 URL）</li><li style="margin:3px 0">打包管理：新增渠道包 → 上传 安卓壳包（渠道码写入壳）</li><li style="margin:3px 0">渠道管理：渠道码写入壳包，装完即归因</li><li style="margin:3px 0">埋点管理：壳内 H5 像素 + 服务端回传</li></ol></div><div style="border:1px solid #e8ebf0;border-radius:10px;padding:12px 16px;margin-bottom:10px;background:#fcfcfd"><div style="font-weight:700;color:#1f2937;margin-bottom:6px;font-size:14px">📦 iOS 壳包（WebView 套壳）</div><ol style="margin:0;padding-left:20px;color:#475569;font-size:13px;line-height:1.8"><li style="margin:3px 0">域名管理：推广域名（壳访问 URL）</li><li style="margin:3px 0">打包管理：新增渠道包 → 上传 iOS壳包</li><li style="margin:3px 0">仿应用商店：苹果商店上架（已封装域名）</li><li style="margin:3px 0">渠道管理：渠道码写入壳</li><li style="margin:3px 0">埋点管理：壳内 H5 像素 + 回传</li></ol></div><div style="border:1px solid #e8ebf0;border-radius:10px;padding:12px 16px;margin-bottom:10px;background:#fcfcfd"><div style="font-weight:700;color:#1f2937;margin-bottom:6px;font-size:14px">🌐 H5 链接（不下载，浏览器直开）</div><ol style="margin:0;padding-left:20px;color:#475569;font-size:13px;line-height:1.8"><li style="margin:3px 0">域名管理：推广域名 + 防封页域名（被封自动救援）</li><li style="margin:3px 0">渠道管理：生成带渠道ID 的 H5 推广链接</li><li style="margin:3px 0">埋点管理：H5 像素（FB / TikTok pixel）+ CAPI 服务端回传</li><li style="margin:3px 0">安装引导：H5 顶部下载提示 / 弹窗，引导升级 PWA / APK（可选）</li></ol></div><div style="border:1px solid #e8ebf0;border-radius:10px;padding:12px 16px;margin-bottom:10px;background:#fcfcfd"><div style="font-weight:700;color:#1f2937;margin-bottom:6px;font-size:14px">📲 PWA（可安装 Web App · 免下载 · 可推送）</div><ol style="margin:0;padding-left:20px;color:#475569;font-size:13px;line-height:1.8"><li style="margin:3px 0">域名管理：推广域名（内外链 / 语言切换）</li><li style="margin:3px 0">PWA 管理：页面配置 → 推送配置 → 发布</li><li style="margin:3px 0">渠道管理：生成带渠道ID 的 PWA 链接</li><li style="margin:3px 0">埋点管理：H5 像素 + CAPI 回传，结合推送召回</li><li style="margin:3px 0">数据：域名统计看 打开次数 / 打开人数 / 下载次数</li></ol></div><div style="font-weight:700;color:#1d4ed8;margin:20px 0 8px;font-size:14px">五、投放渠道 × 可投放端</div><div style="color:#6b7280;font-size:12.5px;margin-bottom:8px">不同投放渠道（广告平台）可接受投放的端不同，配渠道 / 包前先对照下表确认。</div><table style="width:100%;border-collapse:collapse;border:1px solid #e5e7eb;font-size:12.5px"><thead><tr><th style="padding:9px 10px;border:1px solid #e5e7eb;background:#f1f5f9;color:#334155;font-weight:700;text-align:left">投放渠道</th><th style="padding:9px 10px;border:1px solid #e5e7eb;background:#f1f5f9;color:#334155;font-weight:700;white-space:nowrap">安卓 APK</th><th style="padding:9px 10px;border:1px solid #e5e7eb;background:#f1f5f9;color:#334155;font-weight:700;white-space:nowrap">iOS 原生</th><th style="padding:9px 10px;border:1px solid #e5e7eb;background:#f1f5f9;color:#334155;font-weight:700;white-space:nowrap">安卓壳包</th><th style="padding:9px 10px;border:1px solid #e5e7eb;background:#f1f5f9;color:#334155;font-weight:700;white-space:nowrap">iOS 壳包</th><th style="padding:9px 10px;border:1px solid #e5e7eb;background:#f1f5f9;color:#334155;font-weight:700;white-space:nowrap">H5 链接</th><th style="padding:9px 10px;border:1px solid #e5e7eb;background:#f1f5f9;color:#334155;font-weight:700;white-space:nowrap">PWA</th></tr></thead><tbody><tr><td style="padding:8px 10px;border:1px solid #e5e7eb;font-weight:700;color:#1f2937;white-space:nowrap">Facebook</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;font-weight:700;color:#16a34a">✓</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;font-weight:700;color:#16a34a">✓</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;font-weight:700;color:#16a34a">✓</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;font-weight:700;color:#16a34a">✓</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;font-weight:700;color:#16a34a">✓</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;font-weight:700;color:#16a34a">✓</td></tr><tr><td style="padding:8px 10px;border:1px solid #e5e7eb;font-weight:700;color:#1f2937;white-space:nowrap">TikTok</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;font-weight:700;color:#16a34a">✓</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;font-weight:700;color:#16a34a">✓</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;font-weight:700;color:#16a34a">✓</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;font-weight:700;color:#f59e0b">◯</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;font-weight:700;color:#16a34a">✓</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;font-weight:700;color:#16a34a">✓</td></tr><tr><td style="padding:8px 10px;border:1px solid #e5e7eb;font-weight:700;color:#1f2937;white-space:nowrap">谷歌 Google Ads</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;font-weight:700;color:#16a34a">✓</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;font-weight:700;color:#16a34a">✓</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;font-weight:700;color:#f59e0b">◯</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;font-weight:700;color:#f59e0b">◯</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;font-weight:700;color:#16a34a">✓</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;font-weight:700;color:#16a34a">✓</td></tr><tr><td style="padding:8px 10px;border:1px solid #e5e7eb;font-weight:700;color:#1f2937;white-space:nowrap">Kwai 快手</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;font-weight:700;color:#16a34a">✓</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;font-weight:700;color:#16a34a">✓</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;font-weight:700;color:#16a34a">✓</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;font-weight:700;color:#f59e0b">◯</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;font-weight:700;color:#16a34a">✓</td><td style="padding:8px 10px;border:1px solid #e5e7eb;text-align:center;font-weight:700;color:#16a34a">✓</td></tr></tbody></table><div style="font-size:11.5px;color:#94a3b8;margin-top:6px"><span style="color:#16a34a;font-weight:700">✓</span> 支持　<span style="color:#f59e0b;font-weight:700">◯</span> 支持（需注意 / 审核）　<span style="color:#cbd5e1;font-weight:700">✗</span> 不推荐</div><div style="font-weight:700;color:#1d4ed8;margin:20px 0 8px;font-size:14px">六、回传广告平台逻辑</div><div style="color:#6b7280;font-size:12.5px;margin-bottom:8px">每个渠道两条回传通道（Click + API），用点击参数把转化事件回传广告平台，闭环优化投放。</div><div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px"><div style="border:1px solid #e8ebf0;border-left:3px solid #f59e0b;border-radius:8px;padding:9px 14px;background:#fffdf8;font-size:12.5px;color:#475569;line-height:1.8">📍 <b style="color:#b45309">Click 上报（前端像素）</b>：落地页 / 壳内 H5 加载平台像素，记录点击参数（fbclid 等）后前端上报事件。简单，但受 <b>iOS ATT、浏览器隐私、清缓存</b>影响，丢包率高。</div><div style="border:1px solid #e8ebf0;border-left:3px solid #10b981;border-radius:8px;padding:9px 14px;background:#f6fefb;font-size:12.5px;color:#475569;line-height:1.8">🛰️ <b style="color:#047857">API 回传（服务端 CAPI / S2S）</b>：后台用<b>点击参数 + 转化事件</b>，服务端直连广告平台 API 回传。绕过浏览器限制，准确稳定，是 <b>iOS 与高价值事件</b>回传的命脉。</div><div style="border:1px solid #e8ebf0;border-left:3px solid #3b82f6;border-radius:8px;padding:9px 14px;background:#f7faff;font-size:12.5px;color:#475569;line-height:1.8">⚙️ <b style="color:#1d4ed8">实战</b>：两者<b>并行</b>（按 event_id 去重）——Click 保覆盖、API 保准确，iOS 尤其依赖 API 回传。</div></div><div style="font-weight:700;color:#334155;margin:14px 0 6px;font-size:13px">▸ 回传通道与开发文档</div><table style="width:100%;border-collapse:collapse;border:1px solid #e5e7eb;font-size:12.5px"><thead><tr><th style="padding:9px 10px;border:1px solid #e5e7eb;background:#f1f5f9;color:#334155;font-weight:700;text-align:left;width:14%">投放渠道</th><th style="padding:9px 10px;border:1px solid #e5e7eb;background:#f1f5f9;color:#334155;font-weight:700;text-align:left;width:17%">点击参数</th><th style="padding:9px 10px;border:1px solid #e5e7eb;background:#f1f5f9;color:#334155;font-weight:700;text-align:left;width:23%">回传方式</th><th style="padding:9px 10px;border:1px solid #e5e7eb;background:#f1f5f9;color:#334155;font-weight:700;text-align:left;width:31%">关键说明</th><th style="padding:9px 10px;border:1px solid #e5e7eb;background:#f1f5f9;color:#334155;font-weight:700;text-align:left;width:15%">开发文档</th></tr></thead><tbody><tr><td style="padding:8px 10px;border:1px solid #e5e7eb;font-weight:700;color:#1f2937">Facebook</td><td style="padding:8px 10px;border:1px solid #e5e7eb;color:#7c3aed;font-family:monospace;font-size:11.5px">fbclid / fbp</td><td style="padding:8px 10px;border:1px solid #e5e7eb;color:#475569">Pixel（Click）＋ CAPI（API）</td><td style="padding:8px 10px;border:1px solid #e5e7eb;color:#64748b;font-size:   function hidePrd(){var b=document.querySelector('.prd-bubble');if(b&&b.style.display!=='none')b.style.display='none';}
  new MutationObserver(hidePrd).observe(document.documentElement,{childList:true,subtree:true});
  hidePrd();setTimeout(hidePrd,1200);setTimeout(hidePrd,3000);
})();
</script>
<script>
(function(){
  // 二阶段功能说明书 · 可拖动悬浮窗（位置本地持久化；拖动>4px 不触发点击）
  function init(){
    if(document.getElementById('ar-spec-fab'))return;
    var el=document.createElement('div');
    el.id='ar-spec-fab';
    el.title='二阶段功能说明书（点击查看 · 按住可拖动）';
    el.innerHTML='<div style="font-size:11px;line-height:1.3;text-align:center;font-weight:700;letter-spacing:.5px">功能<br>说明书<br><span style="font-size:8.5px;font-weight:400;opacity:.85;letter-spacing:0">（二阶段）</span></div>';
    el.style.cssText='position:fixed;z-index:2147482000;width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(79,70,229,.45);cursor:grab;user-select:none;right:16px;bottom:152px;transition:transform .12s,box-shadow .12s';
    try{var p=JSON.parse(localStorage.getItem('ar_specfab_pos')||'null');if(p&&typeof p.x==='number'){el.style.left=Math.min(Math.max(0,p.x),innerWidth-64)+'px';el.style.top=Math.min(Math.max(0,p.y),innerHeight-64)+'px';el.style.right='auto';el.style.bottom='auto';}}catch(_){}
    var sx,sy,ox,oy,moved=false,drag=false;
    el.addEventListener('mousedown',function(e){drag=true;moved=false;sx=e.clientX;sy=e.clientY;var r=el.getBoundingClientRect();ox=r.left;oy=r.top;el.style.cursor='grabbing';e.preventDefault();});
    document.addEventListener('mousemove',function(e){if(!drag)return;var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>4||Math.abs(dy)>4)moved=true;if(!moved)return;var nx=Math.min(Math.max(0,ox+dx),innerWidth-64),ny=Math.min(Math.max(0,oy+dy),innerHeight-64);el.style.left=nx+'px';el.style.top=ny+'px';el.style.right='auto';el.style.bottom='auto';});
    document.addEventListener('mouseup',function(){if(!drag)return;drag=false;el.style.cursor='grab';var r=el.getBoundingClientRect();if(moved){try{localStorage.setItem('ar_specfab_pos',JSON.stringify({x:r.left,y:r.top}));}catch(_){}}});
    el.addEventListener('click',function(){if(moved){moved=false;return;}window.open('../docs/saas-phase2-feature-spec.html','_blank');});
    el.addEventListener('mouseenter',function(){el.style.transform='scale(1.07)';el.style.boxShadow='0 10px 28px rgba(79,70,229,.55)';});
    el.addEventListener('mouseleave',function(){el.style.transform='';el.style.boxShadow='0 8px 24px rgba(79,70,229,.45)';});
    document.body.appendChild(el);
  }
  if(document.body)init();else document.addEventListener('DOMContentLoaded',init);
})();
</script>
<script>
(function(){
  // 顶栏切换商户 → 当前页数据随商户刷新（数据隔离演示）
  var last='';
  function curMch(){var el=document.querySelector('.header-tenant__pill-value');return el?el.textContent.trim():'';}
  function check(){var v=curMch();if(v&&v!==last){var first=!last;last=v;if(!first&&window.__arRepaint){window.__arRepaint();if(window.__arToast)window.__arToast('已切换商户：'+v);}}}
  var mo=new MutationObserver(check);
  function start(){mo.observe(document.documentElement,{childList:true,subtree:true,characterData:true});setTimeout(check,1500);}
  if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
})();
</script>
<script>
/* 全局：去除输入框 Chrome 自动填充图标 —— 给所有 input/textarea 设 autocomplete=off（含动态渲染，保留密码框的 new-password） */
(function(){
  function off(el){ if(el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA')){ var a=el.getAttribute('autocomplete'); if(a!=='new-password'&&a!=='off') el.setAttribute('autocomplete','off'); } }
  function scan(root){ off(root); if(root&&root.querySelectorAll){ var ns=root.querySelectorAll('input,textarea'); for(var i=0;i<ns.length;i++) off(ns[i]); } }
  var mo=new MutationObserver(function(muts){ for(var i=0;i<muts.length;i++){ var m=muts[i]; for(var j=0;j<m.addedNodes.length;j++){ var n=m.addedNodes[j]; if(n.nodeType===1) scan(n); } } });
  function start(){ scan(document); mo.observe(document.documentElement,{childList:true,subtree:true}); }
  if(document.body) start(); else document.addEventListener('DOMContentLoaded',start);
})();
</script>
